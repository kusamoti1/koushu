<!DOCTYPE html>
<html lang="ja" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>甲種化学 実務＆試験対策アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- KaTeX の導入 (高速数式レンダリング) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        html, body { 
            height: 100%; margin: 0; padding: 0; 
            background-color: #cbd5e1; 
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Meiryo', sans-serif; 
            overflow: hidden; 
        }
        .app-container { 
            width: 100%; max-width: 480px; margin: 0 auto;
            height: 100dvh; 
            background-color: #f8fafc; 
            display: flex; flex-direction: column; 
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .scrollable-content { 
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; 
            padding: 1rem; padding-bottom: 2rem; min-h-0; 
        }
        .btn-active:active { transform: scale(0.96); transition: transform 0.1s; }
        .goro-box { background-color: #fdf2f8; border: 2px solid #fbcfe8; border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; }
        .reason-box { background-color: #eff6ff; border-left: 4px solid #3b82f6; padding: 0.75rem; margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.6;}
        .law-box { background-color: #f0fdf4; border-left: 4px solid #22c55e; padding: 0.75rem; margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.6; }
        .trap-box { background-color: #fff1f2; border-left: 4px solid #f43f5e; padding: 0.75rem; margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.6; }
        .tip-box { background-color: #fffbeb; border: 2px solid #fcd34d; border-radius: 0.5rem; padding: 0.75rem; margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.6; }
        .pop-in { animation: popIn 0.2s ease-out forwards; }
        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .bottom-nav { 
            background: #ffffff; border-top: 1px solid #e2e8f0; 
            display: flex; justify-content: space-around; 
            padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0;
        }
        .nav-item { flex: 1; padding: 0.75rem 0; text-align: center; color: #64748b; font-size: 0.75rem; font-weight: bold; transition: color 0.2s; }
        .nav-item.active { color: #4f46e5; }
        .nav-icon { font-size: 1.25rem; margin-bottom: 0.25rem; display: block; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ヘッダー -->
        <header class="bg-slate-800 text-white p-4 flex justify-between items-center shadow-md flex-shrink-0 z-10">
            <h1 class="text-lg font-bold">甲種化学 最強アプリ</h1>
            <span id="total-count-badge" class="text-xs bg-slate-700 px-2 py-1 rounded">問題読込中…</span>
        </header>

        <!-- メイン画面 -->
        <main class="scrollable-content" id="main-content">
            <!-- ====== ホーム画面 ====== -->
            <div id="view-home" class="flex flex-col h-full">
                <h2 class="text-sm font-bold text-gray-500 mb-2 mt-2">分野別の実力（習得率）</h2>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 space-y-5">
                    <div class="relative w-full bg-slate-100 rounded-full h-3 mt-4">
                        <div id="score-law-text" class="absolute -top-6 left-0 text-xs font-bold text-slate-700">法令 <span class="text-emerald-600">0%</span></div>
                        <div class="absolute -top-4 bottom-0 left-[60%] w-[2px] bg-red-500 z-10 opacity-50"></div>
                        <div id="bar-law" class="bg-emerald-500 h-3 rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                    <div class="relative w-full bg-slate-100 rounded-full h-3 mt-8">
                        <div id="score-sec-text" class="absolute -top-6 left-0 text-xs font-bold text-slate-700">保安管理 <span class="text-amber-500">0%</span></div>
                        <div class="absolute -top-4 bottom-0 left-[60%] w-[2px] bg-red-500 z-10 opacity-50"></div>
                        <div id="bar-sec" class="bg-amber-400 h-3 rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                    <div class="relative w-full bg-slate-100 rounded-full h-3 mt-8 mb-2">
                        <div id="score-kno-text" class="absolute -top-6 left-0 text-xs font-bold text-slate-700">学識 <span class="text-rose-500">0%</span></div>
                        <div class="absolute -top-4 bottom-0 left-[60%] w-[2px] bg-red-500 z-10 opacity-50"></div>
                        <div id="bar-kno" class="bg-rose-400 h-3 rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>
                <div class="mt-auto">
                    <button onclick="startReview()" class="btn-active w-full bg-amber-500 text-white font-bold text-lg py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 relative mb-4">
                        <i class="fa-solid fa-brain"></i> 今日の復習を始める
                        <span id="review-badge" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-black px-2 py-1 rounded-full border-2 border-white shadow hidden">0問</span>
                    </button>
                    <p class="text-xs text-center text-gray-500">※新しい学習は下の「学習を選ぶ」から</p>
                </div>
            </div>

            <!-- ====== モード選択画面 ====== -->
            <div id="view-modes" class="hidden flex flex-col h-full gap-4 pt-2">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                    <h2 class="text-base font-bold text-slate-700 mb-4 text-center"><i class="fa-solid fa-filter text-indigo-500"></i> 学習する科目を選ぶ</h2>
                    <div class="flex gap-2 mb-6">
                        <button id="flt-law" onclick="toggleFilter('law')" class="flex-1 bg-emerald-500 text-white font-bold py-3 rounded-lg transition-all border-2 border-emerald-500 text-sm shadow-sm">法令</button>
                        <button id="flt-sec" onclick="toggleFilter('sec')" class="flex-1 bg-amber-500 text-white font-bold py-3 rounded-lg transition-all border-2 border-amber-500 text-sm shadow-sm">保安管理</button>
                        <button id="flt-kno" onclick="toggleFilter('kno')" class="flex-1 bg-rose-500 text-white font-bold py-3 rounded-lg transition-all border-2 border-rose-500 text-sm shadow-sm">学識</button>
                    </div>
                    
                    <button onclick="startQuizMode()" class="btn-active w-full bg-slate-800 text-white font-bold text-lg py-4 rounded-xl shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-pen-to-square"></i> じっくり演習スタート <span class="text-xs bg-slate-600 px-2 py-1 rounded-full ml-1">10問</span>
                    </button>
                </div>
            </div>

            <!-- ====== まとめノート画面 ====== -->
            <div id="view-notebook" class="hidden flex flex-col h-full">
                <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2"><i class="fa-solid fa-star text-yellow-500"></i> まとめノート</h2>
                <div id="notebook-list" class="space-y-4"></div>
                <p id="notebook-empty" class="text-center text-xs text-gray-500 mt-8">※問題画面の★ボタンを押すと、ここに追加されます。</p>
            </div>

            <!-- ====== 演習UI ====== -->
            <div id="ui-standard" class="hidden flex-col h-full">
                <div class="flex justify-between items-center text-xs font-bold mb-3 shrink-0">
                    <div class="flex items-center gap-2">
                        <span id="std-category" class="text-white px-3 py-1 rounded shadow-sm"></span>
                        <span id="std-rank" class="px-2 py-1 rounded border bg-white"></span>
                        <span id="std-counter" class="text-gray-500 ml-1"></span>
                    </div>
                    <button id="std-bookmark" onclick="toggleBookmark(event)" class="text-gray-400 text-2xl p-1 px-2 active:scale-90 transition-transform"><i class="fa-regular fa-star"></i></button>
                </div>
                
                <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-200 mb-4 relative">
                    <p id="std-text" class="text-base font-bold text-slate-800 leading-relaxed"></p>
                    <button id="btn-inline-canvas" onclick="openCanvasModal()" class="hidden w-full mt-5 bg-indigo-50 text-indigo-600 border border-indigo-200 font-bold py-3 rounded-lg flex items-center justify-center gap-2 active:bg-indigo-100">
                        <i class="fa-solid fa-pen-nib"></i> 全画面で計算メモを開く
                    </button>
                </div>

                <div id="std-answers" class="grid gap-4 grid-cols-2 mb-4 shrink-0">
                    <button onclick="checkStandardAnswer(true)" class="btn-active bg-white text-slate-800 font-bold p-3 rounded-xl shadow-sm border-2 border-slate-200 hover:border-indigo-300 text-sm">〇</button>
                    <button onclick="checkStandardAnswer(false)" class="btn-active bg-white text-slate-800 font-bold p-3 rounded-xl shadow-sm border-2 border-slate-200 hover:border-indigo-300 text-sm">×</button>
                </div>

                <div id="std-explanation-view" class="hidden bg-slate-50 rounded-xl p-5 border border-slate-200 shadow-inner mb-6">
                    <div class="flex items-center justify-center mb-4 border-b border-slate-200 pb-3">
                        <span id="std-result-mark" class="text-4xl mr-3 drop-shadow-md"></span>
                    </div>
                    <p class="text-sm text-indigo-600 font-bold mb-2"><i class="fa-solid fa-lightbulb"></i> 詳しい解説</p>
                    <div id="std-explanation-text" class="text-sm text-slate-800 leading-relaxed"></div>
                </div>

                <button id="std-next" onclick="nextQuestion()" class="hidden shrink-0 mt-auto btn-active w-full bg-slate-800 text-white font-bold text-lg py-4 rounded-xl shadow-lg flex items-center justify-center">次の問題へ <i class="fa-solid fa-arrow-right ml-2"></i></button>
                <button id="std-finish" onclick="finishSession()" class="hidden shrink-0 mt-auto btn-active w-full bg-indigo-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg flex items-center justify-center">結果を見る <i class="fa-solid fa-flag-checkered ml-2"></i></button>
            </div>

            <!-- ====== 結果画面 ====== -->
            <div id="ui-result" class="hidden flex-col h-full justify-center text-center">
                <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-200 mb-8 pop-in">
                    <h2 class="text-xl font-bold text-gray-600 mb-2">演習完了</h2>
                    <div class="my-6">
                        <p class="text-sm text-gray-500 mb-1">正解数</p>
                        <p class="text-6xl font-black text-slate-800 tracking-tighter"><span id="res-score" class="text-indigo-600">0</span><span class="text-3xl text-gray-400 font-bold">/<span id="res-total">0</span></span></p>
                    </div>
                </div>
                <button onclick="switchTab('home')" class="btn-active w-full bg-slate-800 text-white font-bold text-lg py-4 rounded-xl shadow mt-auto">ホームに戻る</button>
            </div>
        </main>

        <button id="btn-open-canvas" onclick="openCanvasModal()" class="hidden fixed bottom-[90px] right-6 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-[0_4px_15px_rgba(0,0,0,0.3)] flex items-center justify-center text-xl z-40 active:scale-90 transition-transform">
            <i class="fa-solid fa-pen"></i>
        </button>

        <nav class="bottom-nav">
            <button class="nav-item active" id="tab-home" onclick="switchTab('home')"><i class="fa-solid fa-house nav-icon"></i> ホーム</button>
            <button class="nav-item" id="tab-modes" onclick="switchTab('modes')"><i class="fa-solid fa-graduation-cap nav-icon"></i> 学習を選ぶ</button>
            <button class="nav-item" id="tab-notebook" onclick="switchTab('notebook')"><i class="fa-solid fa-book-bookmark nav-icon"></i> ノート</button>
        </nav>
        
        <!-- 全画面計算メモ -->
        <div id="canvas-modal" class="hidden fixed inset-0 z-[100] bg-white flex flex-col">
            <div class="bg-slate-800 pt-[env(safe-area-inset-top)]"></div>
            <div class="bg-slate-800 text-white p-4 flex justify-between items-center shrink-0 shadow-md">
                <span class="font-bold"><i class="fa-solid fa-pen"></i> 計算メモ</span>
                <div>
                    <button onclick="clearCanvas()" class="bg-slate-600 hover:bg-slate-500 px-4 py-2 rounded text-sm mr-2 font-bold active:scale-95">全消去</button>
                    <button onclick="closeCanvasModal()" class="bg-rose-500 hover:bg-rose-400 px-4 py-2 rounded text-sm font-bold active:scale-95">閉じる</button>
                </div>
            </div>
            <div class="flex-grow relative bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+CjxyZWN0IHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0iI2ZmZiIvPgo8Y2lyY2xlIGN4PSIxIiBjeT0iMSIgcj0iMSIgZmlsbD0iI2UxZTRlOCIvPgo8L3N2Zz4=')]">
                <canvas id="drawing-canvas" class="absolute inset-0 w-full h-full touch-none cursor-crosshair"></canvas>
            </div>
            <div class="bg-white pb-[env(safe-area-inset-bottom)]"></div>
        </div>
    </div>

    <script>
        // ★ 究極の軽量化1: DOM要素を起動時にキャッシュして、以降は検索させない
        const els = {};
        document.addEventListener('DOMContentLoaded', () => {
            const ids = [
                'view-home', 'view-modes', 'view-notebook', 'ui-standard', 'ui-result',
                'score-law-text', 'bar-law', 'score-sec-text', 'bar-sec', 'score-kno-text', 'bar-kno',
                'review-badge', 'btn-open-canvas', 'btn-inline-canvas',
                'std-category', 'std-rank', 'std-counter', 'std-bookmark', 'std-text', 
                'std-answers', 'std-explanation-view', 'std-result-mark', 'std-explanation-text',
                'std-next', 'std-finish', 'res-score', 'res-total',
                'notebook-list', 'notebook-empty', 'main-content', 'canvas-modal', 'drawing-canvas',
                'flt-law', 'flt-sec', 'flt-kno'
            ];
            ids.forEach(id => { els[id] = document.getElementById(id); });
            initApp(); 
        });

        // ==========================================
        // データベース (400問)
        // ==========================================
        const dbLaw = [
            ["S","製造施設の位置変更は、原則として都道府県知事の「許可」が必要である。","製造施設の位置変更は、原則として都道府県知事への「届出」で足りる。","<div class='trap-box'>⚠️ <b>許可 vs 届出の鉄則：</b>製造施設の位置・構造・設備の変更は「事前の許可」が原則です。「届出」は軽微な変更（工事完成後）や保安職制の選任などに使います。位置変更は周辺への影響が大きいため、特に許可が必要です。</div><div class='reason-box'>根拠：高圧ガス保安法第14条。位置変更は近隣への安全距離にも影響するため、事前に行政がチェックする「許可制」が採られています。</div>"],
            ["S","危害予防規程を定め、届け出る義務があるのは第一種製造者のみである。","第一種製造者および第二種製造者は、どちらも危害予防規程を届け出る。","<div class='reason-box'>危害予防規程（高圧ガス保安法第26条）は、製造施設における危険や障害の予防策を定めた社内規程です。作成・届出義務があるのは<b>「第一種製造者のみ」</b>で、規模が小さい第二種製造者には義務がありません。</div><div class='trap-box'>⚠️ 危害予防規程は「届出」であって「認可」ではない点も頻出ミスです。定めたら知事に届け出るだけで、知事のお墨付き（認可）は不要です。</div>"],
            ["A","高圧ガスの従業員への「保安教育を施す義務」は第一種・第二種製造者および特定消費者に課せられており、「保安教育計画を定める義務」は第一種製造者に課せられている。","保安教育計画を定める義務は第一種製造者のみであり、第二種製造者や特定消費者には保安教育を施す義務そのものもない。","<div class='trap-box'>⚠️ 「保安教育を<b>施す</b>義務」と「保安教育計画を<b>定める</b>義務」は別物です。<br>教育を施す義務：第一種・第二種・特定消費者 全員<br>教育計画を定める義務：<b>第一種製造者のみ</b>明示的に規定</div>"],
            ["B","高圧ガスの製造施設には、原則として外部の者の立入禁止措置を講じる。","高圧ガスの製造施設であっても、昼間は外部の者の立ち入りを制限しなくてもよい。","<div class='reason-box'>高圧ガス保安法の技術基準（一般高圧ガス保安規則）では、製造施設の周囲に<b>柵・塀・標識などを設けて関係者以外の立入りを禁止</b>することが義務付けられています。昼夜・平日休日を問いません。</div><div class='trap-box'>⚠️ 「昼間は制限不要」「業務時間外のみ禁止」などの限定的な表現はすべて誤りです。第三者が不用意に立ち入ってバルブを操作したり、タバコに火をつけたりすると重大事故に直結するため、<b>時間帯・曜日を問わず常時禁止</b>が原則です。</div>"],
            ["A","第一種製造者は、保安統括者を選任したとき、遅滞なく都道府県知事に届け出る。","第一種製造者は、保安統括者を選任したとき、都道府県知事の許可を受ける。","<div class='trap-box'>⚠️ 保安役職（保安統括者・保安技術管理者・保安主任者・保安係員）の選任・解任は「許可」ではなく「遅滞なく届出」です。行政が保安体制を常に把握するための制度ですが、事前承認（許可）は不要です。</div><div class='reason-box'>「遅滞なく」とは、正当な理由がある場合を除き、速やかに行うことを意味します。特定の日数は定められていませんが、選任・解任後すぐに届け出るのが原則です。</div>"],
            ["A","可燃性ガスの容器には外面に「燃」の文字を、毒性ガスの容器には「毒」の文字を表示しなければならない。","可燃性ガスの容器外面には「可燃性」、毒性ガスの容器外面には「毒性」という文字を全文表示する義務がある。","<div class='reason-box'>容器保安規則第10条により、表示義務があるのは<b>「燃」（1文字）</b>と<b>「毒」（1文字）</b>です。「可燃性」「毒性」という複数文字ではありません。不燃性かつ無毒性のガス（例：窒素・ヘリウム）には文字表示義務はありません。</div><div class='trap-box'>⚠️ 試験ではこの「1文字か、複数文字か」の区別が狙われます。また「燃」か「毒」か両方に該当するガス（例：アンモニア＝毒性かつ可燃性、硫化水素＝毒性かつ可燃性）は両方の文字（「燃」「毒」）を表示します。</div>"],
            ["S","特定高圧ガス消費者は、消費施設について年1回以上定期自主検査を行い記録を保存する。","特定高圧ガス消費者は、小規模であるため定期自主検査を行う義務は免除されている。","<div class='reason-box'>特定高圧ガス消費者（モノシラン・ジシラン・ホスフィン・アルシン・モノゲルマン・ジボラン・セレン化水素の7種類を一定量以上消費する者）には、<b>年1回以上の定期自主検査と記録の保存義務</b>があります（高圧ガス保安法第35条の2）。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 特定高圧ガス7種（語呂：モジホアモジセ）</p>モノシラン・ジシラン・ホスフィン・アルシン・モノゲルマン・ジボラン・セレン化水素</div>"],
            ["S","第一種製造者は、原則として都道府県知事等が行う「保安検査」を毎年1回受ける。","第一種製造者は、自社で自主検査を行っていれば、行政の「保安検査」は受けなくてよい。","<div class='reason-box'>保安検査（高圧ガス保安法第35条）は、自社の定期自主検査とは別に行政（都道府県知事・KHK・指定保安検査機関）が実施する外部検査です。<b>原則として毎年1回</b>受検する義務があります。</div><div class='trap-box'>⚠️ 例外として「認定保安検査実施者」に認定された事業者は、自ら実施した保安検査の結果を届け出ることで、行政検査が免除されます（自主保安の優良事業者向け制度）。</div>"],
            ["S","移動時にイエローカードの携帯が義務なのは「可燃性・毒性・酸素」などである。","高圧ガスを移動する場合、ガスの種類に関わらず常にイエローカードの携帯が義務である。","<div class='reason-box'>イエローカード（緊急連絡カード）は、事故時に消防・警察・救急が迅速に対応するための情報カードです。携帯義務があるのは<b>可燃性ガス・毒性ガス・酸素</b>の移動時のみで、窒素・ヘリウムなどの不燃性・無毒性ガスには義務はありません。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 移動時の携帯義務まとめ</p>イエローカード：可燃性・毒性・酸素<br>消火設備：可燃性・酸素<br>防毒マスク等：毒性ガス</div>"],
            ["A","事故発生時は、規模や種類に関わらず、遅滞なく都道府県知事等に届け出る。","事故発生時、第二種製造者などの小規模事業者は都道府県知事等への届出を省略できる。","<div class='reason-box'>高圧ガス保安法第36条により、高圧ガスによる事故が発生したときは、<b>製造者・販売業者・消費者の規模に関わらず</b>、遅滞なく都道府県知事等に事故の状況および措置について届け出る義務があります。小規模事業者だから免除、という例外規定は存在しません。</div><div class='trap-box'>⚠️ 「第二種だから届出不要」「小規模なので省略できる」という選択肢は誤りです。事故の大小・事業者の規模に関わらず<b>全事業者が報告義務を負います</b>。なお、移動中（車両）での事故の場合は消防署・警察署等に直接届け出ます。</div>"],
            ["A","第一種製造施設の「軽微な変更」工事を行う場合、完成後に都道府県知事に届け出る。","第一種製造施設の軽微な変更工事を行う場合であっても、事前に知事の許可を受ける。","<div class='trap-box'>⚠️ 変更の種類と手続きの整理：<br>①大規模変更（位置・構造・設備等）：事前に<b>知事の許可</b>→完成後に<b>完成検査</b>受検<br>②軽微な変更（小規模修繕・部品交換等）：許可不要・工事完成後に<b>届出</b>のみ<br>③廃止：許可不要・遅滞なく<b>届出</b>のみ</div>"],
            ["B","高圧ガスの廃棄は、不活性ガスであっても定められた基準に従って行う。","高圧ガスの廃棄は、可燃性ガスまたは毒性ガスに限り、定められた基準に従って行う。","<div class='reason-box'>高圧ガス保安法第25条の廃棄基準は<b>すべての高圧ガス</b>に適用されます。窒素のような不活性ガスでも、大量放出による酸素欠乏（密閉空間での窒息）や周囲への影響を考慮した基準に従って廃棄する必要があります。</div><div class='trap-box'>⚠️ 「毒性・可燃性ガスだけが廃棄規制の対象」は誤りです。不活性ガスの廃棄であっても、①周囲の人が多い場所でないこと、②少量ずつ放出すること、③換気を確保することなどの基準に従う必要があります。</div>"],
            ["S","防液堤の設置が義務付けられているのは、可燃性・毒性ガスの「液化ガス」の貯槽である。","防液堤の設置が義務付けられているのは、可燃性・毒性ガスの「圧縮ガス」の貯槽である。","<div class='reason-box'>防液堤（ダイク）は、貯槽から液化ガスが漏洩した際に周囲に広がらないよう「受け皿」として機能します。<b>液化ガスの貯槽</b>にのみ設置義務があります。</div><div class='trap-box'>⚠️ 気体の圧縮ガス（例：圧縮窒素ボンベ）が漏れても、気体は防液堤では堰き止められないので意味がありません。「圧縮ガスにも防液堤が必要」は誤りです。</div>"],
            ["A","第一種製造者は、新設等の際、完成検査に合格した後でなければ施設を使用してはならない。","第一種製造者は、工事が完成すれば、完成検査を受ける前でも試運転として施設を使用できる。","<div class='reason-box'>高圧ガス保安法第20条により、第一種製造者が施設を新設・変更した場合は、<b>完成検査に合格しなければ使用を開始できません</b>。「試運転だから」「少量だから」という例外はありません。完成検査は都道府県知事・KHK・指定完成検査機関が実施します。</div><div class='trap-box'>⚠️ 「工事完成＝使用開始可能」は誤りです。工事完成 → 完成検査の申請 → 合格証の取得 → 初めて使用開始可能、という流れです。認定完成検査実施者は自ら実施した検査結果を届け出ることで行政検査が不要になります。</div>"],
            ["S","高圧ガス移動監視者の資格が必要なのは、可燃性ガス等を「一定数量以上」移動させる場合である。","高圧ガスを移動する場合、運転者はガスの量に関わらず必ず高圧ガス移動監視者の資格を持つ。","<div class='reason-box'>高圧ガス保安法の移動監視者制度では、<b>可燃性・毒性・酸素などを一定数量以上</b>移動させる場合に限り、高圧ガス移動監視者（または甲種・乙種の製造保安責任者免状取得者）を乗車させる義務があります。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 移動監視者が必要な数量の目安</p>圧縮ガス（可燃性・毒性）：<b>300m³以上</b>の移動<br>液化ガス（可燃性・毒性）：<b>3000kg以上</b>の移動<br>少量移動（上記未満）：資格保有者の乗車義務なし<br>※酸素はさらに大きい数量（例：6000m³等）が基準</div>"],
            ["A","温度35℃で圧力が 1 MPa 以上となる圧縮ガスは、現在の圧力が低くても「高圧ガス」に該当する。","圧縮ガスが高圧ガスに該当するかどうかは、現在の圧力が 1 MPa 以上あるかどうかのみで判断される。","<div class='reason-box'>高圧ガス保安法第2条の定義では、圧縮ガスが高圧ガスに該当する条件は「<b>①常用温度において1MPa以上</b>、または<b>②温度35℃において1MPa以上</b>となるもの」です。現在の圧力が低くても、35℃での設計圧力が1MPa以上であれば「高圧ガス」として規制を受けます。</div><div class='trap-box'>⚠️ 「現在の圧力が低いから高圧ガスではない」は誤りです。容器内のガスは温度が上がれば圧力も上がります。常温での保管状態ではなく、<b>温度35℃での圧力で判定</b>するのが重要です。</div>"],
            ["A","液化ガスの「高圧ガス」の定義は、常用温度において圧力が 0.2 MPa 以上となるものである。","液化ガスの「高圧ガス」の定義は、常用温度において圧力が 1 MPa 以上となるものである。","<div class='reason-box'>高圧ガス保安法第2条の定義では、液化ガスの高圧ガス該当条件は<b>「常用温度で0.2 MPa以上」または「圧力が0.2 MPaとなる温度が35℃以下」</b>です。圧縮ガスの1MPaより低い0.2MPaが基準なのは、液化ガスが気化すると体積が急激に膨張する危険性が高いためです。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 高圧ガスの定義まとめ（圧力基準）</p><b>圧縮ガス：</b> 常用温度または35℃で <b>1 MPa以上</b><br><b>液化ガス：</b> 常用温度で <b>0.2 MPa以上</b>（または0.2MPaになる温度が35℃以下）<br><b>圧縮アセチレン：</b> 35℃で <b>0.2 MPa以上</b>（特別に低い基準）</div>"],
            ["S","圧縮アセチレンガスの「高圧ガス」の定義は、温度35℃において圧力が 0.2 MPa 以上となるものである。","圧縮アセチレンガスの「高圧ガス」の定義は、他の圧縮ガスと同じく圧力が 1 MPa 以上となるものである。","<div class='reason-box'>アセチレン（C₂H₂）は<b>分解爆発</b>（酸素なしに自己分解して爆発）する性質を持ち、1.5 MPa以上で圧縮すると危険です。そのため他の圧縮ガスよりはるかに低い<b>「35℃で0.2 MPa以上」</b>という厳しい基準で高圧ガスに分類されます。</div><div class='trap-box'>⚠️ アセチレンだけ特別に0.2 MPaという点が頻出です。「圧縮ガスは全部1 MPa基準」は誤りです。アセチレン容器は溶解アセチレン（アセトンに溶かした状態）として保管されるのもそのためです。</div>"],
            ["B","保安係員は、高圧ガス製造保安責任者免状を持ち、かつ所定の経験を有する者から選任する。","保安係員は、高圧ガス製造保安責任者免状さえ持っていれば、実務経験がなくても選任できる。","<div class='reason-box'>保安係員を含む保安役職（統括者・技術管理者・主任者・係員）の選任には、<b>国家資格（免状）と所定の実務経験の両方</b>が必要です。理論知識（免状）だけでは現場を安全に指揮する能力として不十分であり、実務経験を通じた判断力・対応力が求められます。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 保安役職と選任要件</p>全役職共通：<b>免状＋実務経験</b>が必要<br>免状のみでは選任不可（経験年数は役職・ガス種・施設規模で異なる）</div>"],
            ["S","特定高圧ガスはモノシラン等7種類であり、アンモニアや塩素は含まれない。","アンモニアや塩素は「特定高圧ガス」に指定されており、消費する者は知事への届出が必要である。","<div class='reason-box'>特定高圧ガスとは、半導体製造等で用いられる特殊材料ガスで、毒性・爆発性が特に高い7種類に限定されています。アンモニアや塩素も強い毒性ガスですが、<b>特定高圧ガスとは別の枠組み</b>で規制されます。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 特定高圧ガス7種（語呂：モジホアモジセ）</p>①モノシラン（SiH₄）②ジシラン（Si₂H₆）③ホスフィン（PH₃）<br>④アルシン（AsH₃）⑤モノゲルマン（GeH₄）⑥ジボラン（B₂H₆）<br>⑦セレン化水素（H₂Se）<br>アンモニア・塩素はこのリストに<b>含まれない</b>ことに注意！</div>"],
            ["A","高圧ガス容器の刻印「TP」は、その容器の耐圧試験圧力（Test Pressure）を表している。","高圧ガス容器の刻印「TP」は、その容器の内容積（リットル）を表している。","<div class='reason-box'>容器保安規則により、容器の肩部またはネック部に刻印が義務付けられています。<b>「TP」はTest Pressure（耐圧試験圧力）</b>を表し、単位はMPaです。この圧力の水圧試験に合格した容器であることを示します。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 容器刻印の意味まとめ</p><b>TP</b>：耐圧試験圧力（Test Pressure）<br><b>FP</b>：最高充填圧力（Filling Pressure）<br><b>V</b>：内容積（Volume）（リットル単位）<br><b>W</b>：容器の質量（Weight）（kg単位）<br><b>TW</b>：容器＋多孔質物等の風袋質量（アセチレン容器）<br><b>EM</b>：最大充填量（液化ガス容器）</div>"],
            ["A","販売業者は、高圧ガスの販売事業を開始する日の20日前までに都道府県知事に届け出る。","販売業者は、高圧ガスの販売事業を開始した後、遅滞なく都道府県知事に届け出なければならない。","<div class='reason-box'>高圧ガス保安法第20条の3により、高圧ガスの販売事業者は<b>事業開始の日の20日前まで</b>に都道府県知事に届け出なければなりません。「事業開始後に遅滞なく」というのは誤りです。</div><div class='trap-box'>⚠️ 「事後報告ではなく事前届出（20日前まで）」は頻出ポイント！<br>同様に「第二種製造者」と「特定高圧ガス消費者」も、それぞれ事業開始の20日前まで・消費開始の20日前までに届け出が必要です。<b>これら3つはすべて「20日前まで」の事前届出</b>と覚えましょう。</div>"],
            ["B","高圧ガスを輸入した者は、輸入したガスおよび容器について、原則「輸入検査」を受けなければならない。","高圧ガスを輸入した者は、海外で検査を受けていれば日本での「輸入検査」は免除される。","<div class='reason-box'>高圧ガス保安法第22条により、高圧ガスまたは容器を輸入した者は、原則として<b>輸入検査（日本の法令基準に適合しているかの確認）</b>を受けなければなりません。海外の安全基準が日本基準と同等以上かどうかは個別に確認が必要であり、海外での検査実績があっても日本の輸入検査は原則免除されません。</div><div class='trap-box'>⚠️ 「外国で合格済みだから日本の検査は不要」は誤りです。ただし、輸入検査の合格後に移動・販売・消費が可能になります。なお、指定輸入検査機関による検査も認められています。</div>"],
            ["S","第一種製造者は、危害予防規程を定めたときは都道府県知事に「届け出る」だけでよい。","第一種製造者は、危害予防規程を定めたときは都道府県知事の「認可」を受けなければならない。","<div class='reason-box'>高圧ガス保安法第26条により、第一種製造者は危害予防規程を定めて都道府県知事に<b>「届け出る」</b>だけでよく、知事による「認可（お墨付き）」は不要です。届出は行政が保安体制を把握するための手続きであり、内容の承認を求めるものではありません。</div><div class='trap-box'>⚠️ 「認可か届出か」は最重要ポイント！<br><b>届出で足りるもの：</b>危害予防規程の制定・変更、保安役職の選任・解任、軽微な変更工事完了後、廃止<br><b>許可・認可が必要なもの：</b>製造施設の新設・主要な変更工事</div>"],
            ["S","車両で高圧ガスを移動する場合、消火設備の携行義務があるのは「可燃性ガス」と「酸素」の移動時のみである。","車両で高圧ガスを移動する場合、可燃性ガス・酸素・毒性ガスの全ての移動時に消火設備を携行しなければならない。","<div class='reason-box'>一般高圧ガス保安規則第49条より、消火設備の携行義務は<b>「可燃性ガスまたは酸素」の移動時のみ</b>です。毒性ガス（塩素等）だけの移動には消火設備は不要で、代わりに<b>防毒マスク・防護手袋・除害剤</b>の携行が義務付けられています。</div>"],
            ["B","第一種製造者の許可は、正当な理由なく1年以上製造を開始しない場合、取り消されることがある。","第一種製造者の許可は、一度取得すれば、何年間製造を休止しても取り消されることはない。","<div class='reason-box'>高圧ガス保安法第38条により、許可を受けた者が<b>正当な理由なく1年以上製造を開始しない場合</b>、または1年以上製造を休止した場合、都道府県知事は許可を取り消すことができます。公共の安全のために与えられた許可が、実態のない「幽霊許可」になることを防ぐための規定です。</div><div class='trap-box'>⚠️ 「一度許可を受ければ永続的に有効」は誤りです。法令違反・事故・長期未使用などの場合は許可が取り消される場合があります。正当な理由（設備工事の長期化など）がある場合は取り消しの対象になりません。</div>"],
            ["A","保安技術管理者は、製造施設の保安に関する技術的な事項を統括する者であり、第一種製造者において必ず選任する。","保安技術管理者は、第一種製造者において選任が推奨されているが、義務ではない。","<div class='reason-box'>高圧ガス保安法第27条の2により、第一種製造者は<b>保安技術管理者の選任が義務</b>付けられています。保安技術管理者は、製造施設の保安に関する技術的事項を統括管理する役職です。「推奨」「任意」ではなく、法的に必須の役職です。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 保安職制と選任義務</p><b>保安統括者：</b>第一種製造者（規模要件あり）<br><b>保安技術管理者：</b>第一種製造者（必須）<br><b>保安主任者：</b>第一種製造者（技術管理者の補佐）<br><b>保安係員：</b>第一種製造者（主任者の補佐）<br>いずれも「推奨」ではなく<b>法的義務</b>です</div>"],
            ["S","第一種製造者は保安教育計画を定め、それに従って保安教育を施す義務がある。教育の実施記録は安全管理上の観点から保存することが強く推奨される。","第一種製造者には保安教育計画を定める義務はなく、教育は任意で実施すればよい。","<div class='reason-box'>高圧ガス保安法第27条により、第一種製造者は<b>保安教育計画を定め（作成義務）</b>、それに従って従業員に<b>保安教育を施す義務（実施義務）</b>があります。「計画なし・任意実施」は法違反です。教育の実施記録は保安管理の証拠として保存することが強く推奨されます。</div><div class='trap-box'>⚠️ 「計画を定める義務」と「教育を施す義務」を分けて理解することが重要です。<br>教育を施す義務：<b>第一種・第二種製造者・特定消費者すべて</b><br>計画を定める義務：<b>第一種製造者のみ</b>（第二種には計画作成義務なし）</div>"],
            ["A","「指定設備」とは国等の認定を受けた設備であり、これを使用する場合は保安検査の一部が免除される。","「指定設備」を使用する場合であっても、通常の設備と全く同じ厳しい保安検査を受けなければならない。","<div class='reason-box'>指定設備とは、<b>経済産業大臣の認定（指定設備認定）を受けた、設計・製造品質が確認された設備</b>のことです。指定設備を使用する場合は、設置時の完成検査および定期の保安検査の一部が免除・簡略化されます。これにより信頼性の高い設備の普及を促進する制度です。</div><div class='trap-box'>⚠️ 「全ての検査が免除」ではなく「<b>一部が免除・簡略化</b>」される点に注意です。また、指定設備であっても自主管理（定期自主検査・技術基準の維持）の義務はなくなりません。</div>"],
            ["S","第二種製造者は許可は不要だが、事業を開始する「20日前まで」に知事に届け出なければならない。","第二種製造者は、製造事業を開始した後、遅滞なくその旨を都道府県知事に届け出なければならない。","第二種製造者は事業を開始する「20日前まで」に知事に「届出」をする必要があります。事後報告は不可です。"],
            ["B","危害予防規程には、自社の従業員だけでなく、協力業者の作業に関する保安も定める。","危害予防規程は、自社の従業員のみを対象とし、協力業者の作業については含まれない。","<div class='reason-box'>危害予防規程（高圧ガス保安法第26条）は、製造施設内で働くすべての人（自社従業員・協力業者・下請け業者）の安全を確保するための規程です。施設内で作業する<b>協力業者も対象</b>であり、その作業に関する保安事項も規程に含める必要があります。</div><div class='trap-box'>⚠️ 「協力業者は関係ない」という選択肢は誤りです。自社管理外の業者が施設内で作業する際も、施設管理者（第一種製造者）には保安を確保する責任があります。協力業者への教育・規程の周知も義務の一部です。</div>"],
            ["A","第一種製造者は、保安技術管理者が不在のときに備え、必ずあらかじめ「代理者」を選任しておかなければならない。","第一種製造者は、所定の要件を満たす優秀な管理者であれば、代理者を選任しなくてもよい。","<div class='reason-box'>高圧ガス保安法第33条により、第一種製造者は保安技術管理者等が旅行・疾病などで職務を行うことができない場合に備えて、<b>あらかじめ代理者を選任しておく義務があります</b>。この義務には例外はなく、管理者がどれほど優秀であっても代理者の選任は省略できません。</div><div class='trap-box'>⚠️ 「緊急時にその場で代理者を決めれば良い」は誤りです。事前（あらかじめ）の選任が法的要件です。代理者の選任も保安役職の選任と同様に届出が必要です。</div>"],
            ["A","第一種製造者が施設の一部を廃止したときは、許可は不要であり、遅滞なく都道府県知事に届け出ればよい。","第一種製造者が製造施設の一部を廃止したときは、都道府県知事の許可を受けなければならない。","<div class='reason-box'>施設の廃止は「製造をやめる・設備を撤去する」行為であり、新たな危険が増すわけではないため<b>事前の許可は不要</b>です。ただし、行政が施設の現状を把握するために<b>遅滞なく届出</b>する義務があります（高圧ガス保安法第21条）。</div><div class='tip-box'>💡 廃止と変更の区別：<br>廃止（全部・一部）→ 許可不要、遅滞なく届出<br>大規模な変更工事 → 事前に許可が必要、完成後に完成検査<br>軽微な変更工事 → 許可不要、完成後に届出のみ</div>"],
            ["B","液化石油ガス以外の高圧ガス販売業者は「取扱主任者」を選任するが、「保安統括者」の選任義務はない。","高圧ガスを販売する場合、販売業者には必ず「保安統括者」を選任する義務がある。","<div class='reason-box'>高圧ガスの販売業者に選任義務があるのは<b>「高圧ガス取扱主任者」</b>です（高圧ガス保安法第28条）。「保安統括者」は第一種製造者（一定規模以上）が選任する役職であり、販売業者には選任義務がありません。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 各事業者の選任義務まとめ</p><b>第一種製造者：</b>保安統括者・保安技術管理者・主任者・係員<br><b>販売業者：</b>高圧ガス取扱主任者<br><b>特定高圧ガス消費者：</b>特定高圧ガス取扱主任者<br>「保安統括者」を販売業者に当てはめるのは誤りです</div>"],
            ["A","車両で高圧ガスを移動する際、駐車するときは、原則として第一種保安物件（学校等）の付近を避ける。","車両で高圧ガスを移動する際、昼間であれば第一種保安物件（学校等）の付近に駐車してもよい。","<div class='reason-box'>一般高圧ガス保安規則第49条により、高圧ガスを積載した車両は、<b>第一種保安物件（学校・病院・劇場・百貨店など多数の人が集まる施設）の付近に駐車することが原則禁止</b>されています。昼間・夜間の区別はありません。</div><div class='trap-box'>⚠️ 「昼間だから問題ない」は誤りです。時間帯を問わず第一種保安物件の付近への駐車は原則禁止です。また、やむを得ず駐車する場合（交通渋滞など）でも、できる限り短時間で移動する必要があります。</div>"],
            ["A","保安検査は、都道府県知事だけでなく、高圧ガス保安協会（KHK）や指定保安検査機関も行うことができる。","保安検査は、必ず都道府県知事自らが行わなければならず、民間の機関に委託することはできない。","<div class='reason-box'>高圧ガス保安法第35条により、保安検査は<b>都道府県知事・高圧ガス保安協会（KHK）・指定保安検査機関</b>のいずれかが実施できます。行政の代わりに専門性を持つKHKや指定機関が実施することが認められており、「知事のみが実施」ではありません。</div><div class='tip-box'>💡 保安検査の実施機関（3パターン）<br>①都道府県知事（または協定市長）<br>②高圧ガス保安協会（KHK）<br>③指定保安検査機関（民間の認定機関）<br>また、認定保安検査実施者の場合は自社実施＋結果の届出で行政検査が不要になります。</div>"],
            ["A","容器に充填するガスの名称は、容器の外面に見やすく「表示（ペイント等）」しなければならない（刻印ではない）。","容器に充填するガスの名称は、消えないように外面に「刻印」しなければならない。","<div class='reason-box'>容器保安規則第10条により、充填するガスの名称は<b>容器の外面に「表示（ペイント・印字・シール等）」</b>する義務があります。金属に文字を刻み込む「刻印」は、ガスの名称ではなく製造年・試験圧力・内容積などの容器固有情報（スペック情報）に使われます。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 刻印で義務付けられる情報（容器の固有データ）</p>検査機関の名称略号、容器製造業者の名称略号、充填するガスの種類（記号）、<br>容器の記号・番号、内容積（V）、容器質量（W）、最高充填圧力（FP）、<br>耐圧試験圧力（TP）、合格年月、容器の規格番号 など</div>"],
            ["S","定期自主検査の記録は、一般高圧ガス保安規則において原則として「1年以上」保存しなければならない。","定期自主検査の記録は、作成後すみやかに都道府県知事に提出すれば、保存しておく義務はない。","<div class='reason-box'>一般高圧ガス保安規則第82条により、定期自主検査の記録は<b>原則として1年以上保存</b>する義務があります（知事への提出ではなく、事業所での保存義務）。知事から求められた場合には報告・提示する必要があります。</div><div class='trap-box'>⚠️ 「提出すれば保存義務なし」は誤りです。自主検査記録は事業所が自ら保存しておくことが義務です。都道府県知事に提出するものではありません。監査や立入検査の際に確認書類として提示を求められます。</div>"],
            ["S","許可が必要な変更工事を行った場合は、第一種設備か第二種設備かにかかわらず「完成検査」に合格する必要がある。","第一種製造設備以外の設備（第二種など）について変更工事を行った場合、完成検査は不要である。","<div class='reason-box'>高圧ガス保安法第20条により、<b>許可を受けて行った変更工事が完了した場合</b>、設備の種別（第一種・第二種）にかかわらず<b>完成検査に合格しなければ使用を開始できません</b>。「第一種設備だけに完成検査が必要」という理解は誤りです。</div><div class='trap-box'>⚠️ 許可を要する変更工事 → 完成後に完成検査（必須）<br>軽微な変更工事（許可不要） → 完成後に届出のみ（検査不要）<br>この「許可の要否」と「完成検査の要否」のセットが頻出ポイントです。</div>"],
            ["B","高圧ガス製造施設の「第一種保安物件」には、自力避難が困難な学校、病院、および人が集まる劇場が含まれる。","高圧ガス製造施設における「第一種保安物件」には、住宅や一般の工場が含まれる。","<div class='reason-box'>保安物件は、高圧ガス施設からの距離基準（保安距離）を定めるための区分です。<b>第一種保安物件</b>は自力避難が困難な人が多い施設・多数の人が集まる施設で、より厳しい保安距離が適用されます。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 保安物件の区分</p><b>第一種保安物件（距離が長い・厳しい）：</b><br>学校・病院・劇場・映画館・百貨店・公会堂・図書館など多数の人が集まる場所<br><b>第二種保安物件（やや緩い距離）：</b><br>住宅・一般的なオフィスビルなど<br>住宅・工場は<b>第一種には含まれない</b>ことに注意！</div>"],
            ["A","特定高圧ガスの消費は、消費を開始する日の「20日前まで」に都道府県知事に届け出なければならない。","特定高圧ガスの消費者は、消費を開始した日から30日以内に都道府県知事に届け出ればよい。","<div class='reason-box'>高圧ガス保安法第24条の2により、特定高圧ガスを消費しようとする者は<b>消費開始日の20日前まで</b>に都道府県知事に届け出る必要があります。「消費を始めてから30日以内」のような事後報告は認められません。</div><div class='trap-box'>⚠️ 「事後30日以内」は誤りです。特定高圧ガスの消費は危険性が高いため、<b>事前（20日前まで）</b>に行政が把握できるよう届出義務が設定されています。行政が事前に消費施設の安全を確認できる体制を確保するための制度です。</div>"],
            ["A","特定高圧ガス消費者が消費施設に選任するのは「特定高圧ガス取扱主任者」である。","特定高圧ガス消費者は、消費施設に「保安責任者」を選任し、都道府県知事に届け出なければならない。","<div class='reason-box'>高圧ガス保安法第24条の4により、特定高圧ガス消費者が選任する役職名は<b>「特定高圧ガス取扱主任者」</b>です。「保安責任者」という名称の役職は高圧ガス保安法には存在しません。名称の正確さが問われる頻出設問です。</div><div class='trap-box'>⚠️ 名称の混同に注意！<br>特定高圧ガス消費者 → <b>特定高圧ガス取扱主任者</b><br>販売業者 → <b>高圧ガス取扱主任者</b><br>第一種製造者 → <b>保安統括者・保安技術管理者・保安主任者・保安係員</b><br>「保安責任者」という名称は存在しません。</div>"],
            ["A","高圧ガスを充填する容器は、あらかじめ容器検査に合格し、容器検査合格印が「刻印」されたものでなければならない。","高圧ガスを充填する容器は、目視でサビや傷がなければ、容器検査合格印がなくても充填してよい。","<div class='reason-box'>高圧ガス保安法第48条により、高圧ガスを充填できる容器は<b>あらかじめ容器検査に合格し、合格印（刻印）が付されたもの</b>に限られます。目視による外観確認だけでは内部の劣化・腐食・欠陥は確認できないため、刻印なしの充填は厳禁です。</div><div class='trap-box'>⚠️ 「外見上問題なければOK」は誤りです。容器の安全性は外見だけでは判断できません。また、容器再検査の期限が過ぎた容器も充填禁止です。合格印（刻印）があっても再検査期限超過なら充填できません。</div>"],
            ["S","可燃性ガスと酸素の充填容器を同一車両で混載する場合、充填容器等の内容積の合計が20リットル以下であるなど法定の条件を満たす場合に限り認められる。","可燃性ガスと酸素を同一の車両で積載して移動することは、いかなる場合も禁止されている。","<div class='reason-box'>原則は混載禁止ですが、<b>充填容器の内容積合計が20L以下</b>など法定の例外条件を満たす場合に限り混載できます（例：小型溶接セット）。「仕切り板を設ける」などの措置だけで無制限に混載できるわけではありません。</div>"],
            ["S","毒性ガスの容器の外面の塗色は、原則として『ねずみ色（グレー）』である。","毒性ガスの容器の外面の塗色は、危険を示すために原則として『赤色』である。","<div class='reason-box'>容器保安規則第10条により、毒性ガス（ただしアンモニア・塩素などの個別規定があるものを除く）の容器塗色は原則として<b>「ねずみ色（グレー）」</b>です。赤は水素など可燃性ガスの塗色であり、毒性ガスが「危険だから赤」というわけではありません。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 主要ガスの容器塗色（語呂合わせ）</p><b>酸素：黒</b>（サングロ）｜<b>水素：赤</b>（スイアカ）<br><b>アンモニア：白</b>（アンシロ）｜<b>塩素：黄</b>（エンキ）<br><b>液化炭酸ガス（CO₂）：緑</b>｜<b>アセチレン：褐色（茶色）</b><br><b>毒性ガス（その他）：ねずみ色</b>｜<b>液化石油ガス：ねずみ色またはグレー</b></div>"],
            ["B","アセチレン容器には安全のため多孔質物と溶剤が入っており、その風袋質量（TW）の刻印には多孔質物の質量も含まれる。","アセチレンガスの容器の刻印（TW）には、容器本体の質量のみが含まれ、多孔質物の質量は含まれない。","<div class='reason-box'>アセチレン容器の<b>TW（風袋質量）</b>には、容器本体の質量に加えて<b>多孔質物（珪藻土・軽石など）の質量</b>と溶剤（アセトン・DMF）の質量も含まれます。充填量はTWに充填後の総質量を測定して差し引くことで求めます。</div><div class='tip-box'>💡 なぜ多孔質物を入れるのか？<br>アセチレンは高圧で単独圧縮すると分解爆発を起こすため、多孔質物の細孔にアセトン等の溶剤を含ませ、そこにアセチレンを「溶解」させることで安全に保存します（溶解アセチレン）。<br>TW = 容器本体 ＋ 多孔質物 ＋ 溶剤（アセトン等）の合計質量です。</div>"],
            ["B","高圧ガス製造保安責任者免状は、都道府県知事が交付するが、国家資格であるため全国どこでも有効である。","高圧ガス製造保安責任者免状は都道府県知事が交付するため、交付された都道府県内でのみ有効である。","<div class='reason-box'>高圧ガス製造保安責任者試験は経済産業大臣が認めた<b>国家資格</b>です。試験の実施・免状の交付事務は都道府県知事が行いますが、<b>国家資格として全国どこでも有効</b>です。交付した都道府県以外の事業所でも使用できます。</div><div class='trap-box'>⚠️ 「都道府県知事が交付するから都道府県限定」という誤解が典型的な引っかけです。調理師免許や電気工事士と同様に、地方行政が事務を担当しても全国有効な国家資格です。免状を紛失した場合の再交付は交付した知事に申請します。</div>"],
            ["A","事業の全部または一部を休止しようとするときは、許可は不要であり、あらかじめ都道府県知事に「届け出る」だけでよい。","第一種製造者は、事業の全部または一部を休止しようとするときは、あらかじめ知事の許可を受けなければならない。","<div class='reason-box'>事業の休止は「製造を止める」行為であり、新たな危険が増すわけではないため<b>事前の許可は不要</b>です。ただし行政が製造施設の稼働状況を把握するため、<b>あらかじめ（事前に）届け出る</b>義務があります（高圧ガス保安法第21条）。</div><div class='tip-box'>💡 「あらかじめ届出」と「遅滞なく届出」の違い：<br>休止・廃止予定（予定がわかっている）→ <b>あらかじめ届出</b>（事前届出）<br>事故・不測の出来事（予測困難）→ <b>遅滞なく届出</b>（事後速やかに）<br>どちらも許可は不要です。</div>"],
            ["A","保安教育計画を定め、実施する義務（責任）を負うのは「事業者」であり、保安技術管理者ではない。","保安技術管理者は、第一種製造所において、自ら保安教育計画を作成し、実施する義務を負う。","<div class='reason-box'>高圧ガス保安法第27条により、<b>保安教育計画を定め、実施する責任は「事業者（第一種製造者）」</b>にあります。保安技術管理者はその計画の立案・実施に協力・関与しますが、法律上の義務主体はあくまでも事業者です。</div><div class='trap-box'>⚠️ 「保安技術管理者が義務主体」は誤りです。法令上の義務と実務上の担当者を混同しないよう注意が必要です。保安役職者（管理者・主任者等）は事業者の指示のもとで保安に関する職務を行う立場です。</div>"],
            ["B","指定保安検査機関は、経済産業大臣または都道府県知事の指定を受けた「民間」の検査機関である。","指定保安検査機関は、都道府県の職員のみで構成される公的な検査機関である。","<div class='reason-box'>指定保安検査機関は、行政の代わりに保安検査を実施することが認められた<b>民間の専門機関</b>です。経済産業大臣または都道府県知事から指定を受けており、その専門的な技術力と中立性が認められた機関のみが指定されます。都道府県職員とは別の存在です。</div><div class='tip-box'>💡 保安検査の実施機関の体系：<br>（国レベル）高圧ガス保安協会（KHK）←法律に基づく公益法人<br>（国・県レベル）指定保安検査機関←行政指定の民間機関<br>（自主管理）認定保安検査実施者←優良事業者の自主実施<br>いずれも「都道府県職員」ではありません。</div>"],

            // ===== 追加問題（法令）=====
            ["S","充填容器（残ガス容器を含む）の保管場所は、常に温度40℃以下に保たなければならない。","充填容器は直射日光に当たらない場所で保管すればよく、特定の温度以下に保つ法的な義務はない。","<div class='reason-box'>容器内のガスは温度上昇で内圧が急激に上がります。40℃を超えると安全弁が作動したり、最悪の場合破裂するため、<b>「常に40℃以下」</b>は絶対的なルールです。残ガス容器も対象です。</div>"],
            ["S","第一種貯蔵所（貯蔵量が300m³または3000kg以上）を設置するには、都道府県知事の「許可」が必要である。","第一種貯蔵所を設置するには、都道府県知事への「届出」のみで足りる。","<div class='trap-box'>⚠️ <b>試験の罠：</b>「第一種貯蔵所（300m³/3000kg以上）＝知事の許可」「第二種貯蔵所（それ未満）＝届出のみ」の区別が頻出。貯蔵量が多いほど規制が厳しくなります。</div>"],
            ["A","製造保安責任者の選任・解任を行った場合、どちらの場合も遅滞なく都道府県知事に届け出なければならない。","製造保安責任者を新たに選任した場合は届け出るが、解任した場合には届出の義務はない。","<div class='reason-box'>高圧ガス保安法第33条により、保安役職者（保安統括者・技術管理者・主任者・係員）の<b>選任・解任の両方</b>について、遅滞なく都道府県知事に届け出る義務があります。行政が「現在誰が保安責任者か」を常に正確に把握するために必要な制度です。</div><div class='trap-box'>⚠️ 「解任は届出不要」は誤りです。もし解任を届け出なければ、行政の記録では解任された者が依然として責任者として登録されたままになり、保安体制の実態と記録が乖離してしまいます。「選任も解任も遅滞なく届出」がセットで要求されます。</div>"],
            ["B","高圧ガスを車両で移動中に事故が発生した場合、速やかに最寄りの消防署・警察署または海上保安部等に直接届け出なければならない。","高圧ガスを移動中に事故が発生した場合、まず製造元の会社に連絡し、会社を経由して行政に報告すればよい。","<div class='reason-box'>移動中の事故は、会社経由の間接報告ではなく、<b>直接、行政機関（消防・警察・海上保安部）に通報</b>する義務があります。事故後に被害が拡大する前に行政が状況を把握できるようにするためです。</div>"],
            ["S","高圧ガスの容器は、容器再検査の期限が来たら再検査を受けなければならず、合格しなければ高圧ガスを充填することはできない。","高圧ガス容器は、最初の製造時の検査（容器検査）に合格すれば、その後の定期的な再検査は必要ない。","<div class='reason-box'>容器は長期使用により内外面の腐食・疲労・変形が進みます。高圧ガス保安法第49条により<b>定期的な容器再検査が義務</b>付けられており、期限が来た容器は再検査に合格しなければ充填できません。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 容器再検査の周期（主な例）</p>一般的な鋼製容器：製造後5年→再検査、その後5年ごと<br>超高圧（300以上）圧縮天然ガス容器：特別な周期<br>FRP複合容器：種類によって異なる（3〜5年）<br>液化石油ガス容器：製造後5年、その後5年ごと（2.5年の場合も）<br>※期限切れ容器への充填は<b>厳禁</b></div>"],
            ["A","認定完成検査実施者として認定された事業者は、自ら行った完成検査の結果を知事に届け出ることで、知事等が行う完成検査の受検が不要になる。","認定完成検査実施者であっても、新設・変更工事の完成検査は必ず知事等が直接実施しなければならない。","<div class='reason-box'>高圧ガス保安法第20条の2により、<b>認定完成検査実施者として認定された事業者</b>は、自ら実施した完成検査の結果を都道府県知事に届け出ることで、知事等による完成検査を受検する必要がなくなります。保安管理が優れた事業者に対する規制緩和措置です。</div><div class='tip-box'>💡 「認定系」の制度まとめ：<br><b>認定完成検査実施者</b>→ 自社で完成検査実施→届出で行政完成検査が不要<br><b>認定保安検査実施者</b>→ 自社で保安検査実施→届出で行政保安検査が不要<br>どちらも「自社実施の結果を届け出る」点が共通です。</div>"],
            ["A","可燃性ガスを廃棄する場合、火気のない安全な場所で少量ずつ大気に放出するか、燃焼設備で焼却（燃焼法）して廃棄しなければならない。","可燃性ガスを廃棄する場合、拡散が速いため、まとめて一度に大気に放出するのが安全かつ効率的である。","<div class='reason-box'>可燃性ガスを一度に大量放出すると、周囲の空気と混合して<b>爆発濃度範囲（爆発下限〜上限）に達し、わずかな火花で大爆発</b>を引き起こす危険があります。廃棄には2つの安全な方法があります。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 可燃性ガスの廃棄方法</p>①<b>少量ずつの大気放出：</b>ガス濃度が爆発範囲に達しないよう徐々に希釈して放出（火気のない場所で）<br>②<b>燃焼法（フレアスタック等）：</b>燃焼設備で完全燃焼させてCO₂・H₂O等の無害な物質に変換して排出<br>「まとめて一気に放出」は厳禁！</div>"],
            ["B","高圧ガス保安協会（KHK）は、高圧ガス保安法に基づいて設立された公益法人であり、保安検査・容器検査・製品認定・保安教育などの業務を担う。","高圧ガス保安協会（KHK）は純粋な民間企業であり、高圧ガス保安法上の公的な権限は一切持っていない。","<div class='reason-box'>高圧ガス保安協会（KHK：Koatsu Gas Hoan Kyokai）は<b>高圧ガス保安法に基づいて設立された公益法人</b>（一般財団法人）です。経済産業大臣の指定を受けて、行政に代わる公的な権限を持ち、様々な業務を実施しています。「純粋な民間企業」ではありません。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 KHKの主要業務</p>①<b>保安検査</b>（第一種製造施設の定期検査）<br>②<b>容器検査・再検査</b><br>③<b>特定設備検査</b><br>④<b>特定機器認証・指定設備認定</b><br>⑤<b>保安教育・研修の実施</b><br>⑥<b>調査研究・技術基準の整備</b></div>"],
            ["B","保安技術管理者は製造施設の技術的保安事項を統括し、保安主任者はその補佐として現場リーダーを務め、保安係員が現場実務を担当する階層構造になっている。","保安主任者は保安統括者の補佐として事業所全体の保安を管轄し、保安技術管理者と同等の権限を持つ。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 保安職制の階層（上→下）</p>保安統括者（経営トップ層）<br>↓ 保安技術管理者（現場技術のトップ）<br>↓ 保安主任者（現場リーダー）<br>↓ 保安係員（現場実務担当）</div>"],
            ["B","充填容器を他者に譲渡・引渡しする場合、容器の外面に定められた表示（塗色・刻印・文字表示）がすべて揃っていなければ行ってはならない。","充填容器の譲渡・引渡しは、ガスの種類と量がわかれば、容器の外面表示が不完全でも行ってよい。","<div class='reason-box'>高圧ガス保安法第46条により、表示のない容器（塗色・刻印・文字表示のいずれかが欠けた容器）の譲渡・引渡しは禁止されています。受け取った者が<b>「何のガスが入っているかわからない」状態では、誤った取り扱いによる事故が発生</b>するリスクがあるためです。</div><div class='trap-box'>⚠️ 「ガスの種類と量がわかれば表示不要」は誤りです。法令で定められた表示（塗色・刻印・ガス名称の文字表示・燃・毒の文字等）がすべて揃っていることが法的要件です。表示が一つでも欠けると、たとえ口頭でガスを説明しても譲渡・引渡しは禁止です。</div>"],
            ["A","可燃性ガスや毒性ガス等を車両で移動する場合、車両の前後に定められた警戒標識（危険物表示）を掲示しなければならない。","高圧ガスを車両で移動する場合、ガスの種類にかかわらず一律に警戒標識を掲示する義務はない。","<div class='reason-box'>一般高圧ガス保安規則第49条により、可燃性ガス・毒性ガス・酸素などを車両で移動する場合は<b>車両の前後に警戒標識（「高圧ガス」と記載した所定の標識）を掲示する義務</b>があります。不活性ガスや非特定ガスのみを少量移動する場合は掲示義務が免除される場合があります。</div><div class='tip-box'>💡 移動時の安全措置まとめ：<br>警戒標識：可燃性・毒性・酸素（車両前後に掲示）<br>消火設備：可燃性・酸素（携行必要）<br>防毒マスク・除害剤：毒性ガス（携行必要）<br>イエローカード：可燃性・毒性・酸素（携行必要）<br>移動監視者：一定数量以上の可燃性・毒性等（乗車必要）</div>"],
            ["A","第二種製造者には完成検査の受検義務はないが、製造設備を常に技術基準に適合させて維持する義務は課されている。","第二種製造者は規模が小さいため、製造設備の技術基準への適合義務もない。","<div class='trap-box'>⚠️ 「完成検査が不要＝技術基準も不要」という誤解が頻出です。<br>第二種製造者：完成検査の<b>受検義務なし</b>、しかし<b>技術基準への適合維持義務はあり</b>（自主管理です）</div>"],
            ["A","製造施設の全部を廃止した場合、都道府県知事の許可は不要で、遅滞なく都道府県知事に届け出なければならない。","製造施設の全部を廃止した場合、都道府県知事の許可を受けてから廃止作業を行わなければならない。","<div class='reason-box'>廃止は「製造を完全にやめる」行為であり、新たな危険を生じさせるものではないため、<b>事前の許可は不要</b>です。ただし、行政が施設状況を把握するため<b>遅滞なく届け出る義務</b>があります（高圧ガス保安法第21条）。</div><div class='tip-box'>💡 廃止・休止・変更の手続き整理：<br>施設の<b>廃止（全部・一部）</b> → 許可不要、<b>遅滞なく届出</b><br>事業の<b>休止・再開</b> → 許可不要、<b>あらかじめ届出</b><br>施設の<b>大規模変更</b> → <b>事前に許可が必要</b>、完成後に完成検査<br>施設の<b>軽微な変更</b> → 許可不要、完成後に届出のみ</div>"],
            ["A","高圧ガスを販売する業者は、販売した（または購入した）高圧ガスの種類・量・相手方などを帳簿に記録し、一定期間保存しなければならない。","高圧ガス販売業者は、売上金額の記録さえしていれば、ガスの種類・量・相手先の詳細な記録は不要である。","<div class='reason-box'>高圧ガス保安法第29条により、販売業者は<b>帳簿を備えて高圧ガスの種類・数量・販売先等を記録し、一定期間保存する義務</b>があります。この記録は事故発生時の原因追跡・ガスの不正流通防止・行政の監査対応に活用されます。</div><div class='trap-box'>⚠️ 「売上金額の記録だけでよい」は誤りです。記録しなければならないのは「ガスの種類・数量・引渡し先（販売相手方）等」の保安上重要な情報です。財務的な記録（売上金額）だけでは法律の要件を満たしません。</div>"],

            ["A","可燃性ガスの爆発限界（燃焼範囲）は、一般に温度が高くなると広くなり、圧力が下がると狭くなる。","可燃性ガスの爆発限界（燃焼範囲）は、一般に温度が高くなると狭くなり、圧力が下がると広くなる。","<div class='reason-box'>爆発限界に対する温度・圧力の影響：<br>①<b>温度が高い</b>→ 分子の熱運動が活発になり反応しやすくなるため、下限が下がり上限が上がって<b>爆発範囲が「広く」</b>なります。<br>②<b>圧力が下がる（低圧）</b>→ 分子密度が低下して連鎖反応が続きにくくなるため<b>爆発範囲が「狭く」</b>なります（極低圧では爆発しなくなる）。</div><div class='trap-box'>⚠️ まとめると：温度↑→範囲↑（広くなる）、圧力↑→概ね上限が上がるが変化は複雑。圧力↓→範囲↓（狭くなる）。「温度↑→狭くなる」「圧力↓→広くなる」はどちらも誤りです。</div>"],
            ["S","静電気着火を防ぐため、配管内の液体の流速は制限し（遅くし）、接地（アース）をとるのが良い。","静電気着火を防ぐため、配管内の液体の流速はできるだけ速くし、静電気が滞留する前に流し切るのが良い。","<div class='reason-box'>流速が速いほど、摩擦が大きくなり<b>静電気が大量に発生</b>してしまいます。静電気対策は「流速を遅くする」が鉄則です。</div>"],
            ["A","シアン化水素は、アルカリなどの不純物が混入すると重合爆発を起こす危険があるため安定剤を入れる。","シアン化水素は、酸などの不純物が混入すると重合爆発を起こすため、アンモニアを入れてアルカリ性に保つ。","<div class='reason-box'>アルカリ等の触媒が混ざると連鎖反応を起こして爆発します。そのため容器には「安定剤（亜硫酸ガス等）」を入れて弱酸性に保ちます。</div>"],
            ["S","酸素バルブを開閉する際、軍手に油が付着していると、摩擦で自然発火・爆発する危険がある。","酸素バルブを開閉する際、軍手に油やグリースが付着していても、酸素自体は燃えないため安全である。","<div class='reason-box'>酸素自体は燃えませんが「他の物を激しく燃やす性質（支燃性）」が極めて強力です。油が高濃度酸素に触れると自然発火します。</div>"],
            ["S","硫化水素は卵の腐った臭いがする毒性ガスで、高濃度になると嗅覚を麻痺させる特徴がある。","硫化水素は無色無臭の毒性ガスであり、漏洩しても気づきにくいため非常に危険である。","<div class='reason-box'>硫化水素（H₂S）は<b>腐卵臭（腐った卵の臭い）</b>がある毒性ガスです。低濃度（数ppm）では臭いで気づけますが、<b>高濃度（100ppm以上）になると嗅覚神経が麻痺</b>して「臭いが消えた＝安全」と誤解し、致死量にさらされたまま気づかずに倒れる事故が多発します。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 硫化水素の毒性段階</p>1ppm：臭いを感じる<br>10ppm：頭痛・目の炎症<br>50ppm以上：嗅覚麻痺開始<br>100ppm：1時間以内に症状悪化<br>200〜300ppm：生命の危険<br>700〜1000ppm以上：即死<br>許容濃度（TLV-TWA）：<b>1ppm</b>と非常に厳しい値</div>"],
            ["A","一酸化炭素（CO）は、分子量28で空気とほぼ同じ重さであるため、特別に窪地に滞留しやすい性質はない。","一酸化炭素（CO）は、空気より重いためピットなどの窪地に滞留しやすい。","<div class='reason-box'>一酸化炭素（CO）の分子量は<b>28</b>で、空気の平均分子量（約29）より<b>わずかに軽い</b>です。比重は28÷29≒0.97で空気とほぼ同じため、特別に沈降・滞留しやすい性質はありません。均一に分布する傾向があります。</div><div class='trap-box'>⚠️ 「COは重い→窪地に滞留する」は誤りです。<b>比重がほぼ1の無色無臭の毒性ガス</b>であるCOは、均一に空気と混合するため特定の場所に滞留しにくい反面、どこにでも存在する危険があります。CO中毒の恐ろしさは「無色無臭で気づかない」点にあります。また、可燃性（爆発下限4%、上限74%）でもあります。</div>"],
            ["B","破裂板（ラプチャーディスク）は、異常圧力で板が破れてガスを逃がすため、一度作動したら部品ごと交換する。","破裂板（ラプチャーディスク）は、安全弁と同様に、圧力が正常に戻れば自動的に閉止して再利用できる。","<div class='reason-box'>破裂板（ラプチャーディスク）は<b>薄い金属板（ディスク）が設定圧力に達すると破裂してガスを放出</b>する安全装置です。板が物理的に破れることで動作するため、一度作動したら<b>部品（ディスク）の交換が必須</b>で、自動復帰はしません。</div><div class='tip-box'>💡 安全弁と破裂板の比較：<br><b>安全弁（スプリング式）</b>：圧力が下がると自動閉止→繰り返し使用可能<br><b>破裂板：</b>一度作動したら板が破れる→交換が必要（一回限り）<br>破裂板は応答が速くシール性が高い反面、作動後は全開放状態になる点が特徴。安全弁との組み合わせ設置もある。</div>"],
            ["S","アンモニアの配管や弁などの材料として、銅および銅合金を使用してはならない。","アンモニアの配管や弁などの材料として、銅や真鍮（銅合金）を使用してもよい。","<div class='reason-box'>アンモニア（NH₃）は水分が存在すると<b>銅・銅合金（真鍮・青銅等）を激しく腐食</b>させます。アンモニア水溶液（NH₃水）が銅と反応して錯体（銅アミン錯体）を形成して溶解するためです。アンモニア設備の材料は<b>鋼（炭素鋼・ステンレス鋼）</b>を使用します。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 ガスと禁止材料の組合せ（超頻出！）</p><b>アンモニア：銅・銅合金（真鍮等）禁止</b>→ 腐食・溶解するため<br><b>アセチレン：銅・銅合金（含有率62%以上）禁止</b>→ 爆発性の銅アセチリド生成<br><b>液酸（液化酸素）：油脂類禁止</b>→ 高濃度酸素中で発火<br><b>塩素（乾燥）：鋼使用可能</b>← 水分がなければ腐食しない</div>"],
            ["A","オーステナイト系ステンレス鋼は、低温でも脆くならないため、液化酸素などの極低温設備の材料に適している。","一般的な炭素鋼は低温に強いため、液化酸素などの極低温設備の材料に適している。","<div class='reason-box'>一般的な炭素鋼・フェライト系ステンレス鋼は<b>低温で「低温脆性（靱性が低下して割れやすくなる現象）」</b>を起こします。一方、<b>オーステナイト系ステンレス鋼（SUS304、SUS316等）</b>はFCC（面心立方格子）結晶構造を持ち、極低温でも靱性を保つため液化ガス設備（液化酸素、液化窒素、LNG等）に最適な材料です。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 低温設備に適した材料</p><b>オーステナイト系ステンレス（SUS304等）：</b>極低温OK（-196℃まで）<br><b>アルミニウム合金：</b>極低温OK<br><b>銅・銅合金：</b>極低温OK<br><b>炭素鋼（普通鋼）：</b>低温脆性あり→極低温設備には不適<br><b>フェライト系ステンレス（SUS430等）：</b>低温脆性あり</div>"],
            ["S","可燃性ガスをパージする際、まず窒素等の不活性ガスで追い出し、その後、空気で置換するのが正しい。","可燃性ガスをパージする際、まず設備内に空気を送り込んでガスを追い出すのが正しい手順である。","<div class='reason-box'>可燃性ガスに直接「空気（酸素）」を入れると大爆発します。正解は<b>「①窒素で追い出す → ②その後、空気で置換する」</b>です。</div>"],
            ["S","配管の両端のバルブを閉め、内部に液化ガスが満たされた状態を「液封」と呼び、温度上昇により配管が破裂する危険がある。","配管の両端のバルブを閉め、内部に液化ガスが満たされた状態を「液封」と呼び、安全にガスを保管できる状態である。","<div class='reason-box'>液体はほぼ非圧縮性であり、逃げ場のない密閉空間で温度が上昇して膨張しようとすると<b>急激に圧力が上昇して配管・容器を破裂</b>させます（液封事故）。わずか1℃の温度上昇でも数MPaもの圧力上昇が生じます。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 液封防止対策</p>①<b>逃し弁（安全弁）の設置：</b>過昇圧時に自動放出<br>②<b>均圧管の設置：</b>配管の行き止まり区間を設けない配管設計<br>③<b>液封になりうる区間の把握と作業手順の徹底</b><br>夏場に日光で温まった配管内の液体が膨張して破裂する「液封事故」は実際に多発しています。</div>"],
            ["B","ホスゲンの漏洩検知には、ハリソン試験紙を用い、ガスに触れると赤色に変化する。","ホスゲンの漏洩検知には、アンモニア水を含ませた綿球を近づけて白煙を確認する方法が適している。","白煙（塩化アンモニウム）を生じるのは「塩素」や「塩化水素」です。ホスゲンには「ハリソン試験紙（赤色変化）」を用います。"],
            ["A","シアン化水素が漏洩した際の除害剤として、水酸化ナトリウム水溶液（苛性ソーダ）を用いるのは適切である。","シアン化水素が漏洩した際の除害剤として、塩酸などの酸性水溶液を用いるのは適切である。","<div class='reason-box'>シアン化水素（HCN）は弱酸性のガスです。<b>強アルカリ性の水酸化ナトリウム（NaOH）水溶液（苛性ソーダ）で中和・吸収</b>させることが最も効果的です。化学反応：HCN ＋ NaOH → NaCN ＋ H₂O（シアン化ナトリウム生成）。酸性水溶液（塩酸等）を用いると中和効果はなく、危険です。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 毒性ガスと除害剤の対応（頻出！）</p><b>アンモニア（NH₃）：</b>水（大量）または希硫酸（酸性）<br><b>塩素（Cl₂）：</b>消石灰水溶液（アルカリ）または苛性ソーダ水溶液<br><b>シアン化水素（HCN）：</b>苛性ソーダ水溶液（アルカリ）<br><b>ホスゲン（COCl₂）：</b>消石灰水溶液・苛性ソーダ水溶液（アルカリ）</div>"],
            ["S","酸化エチレンは、空気がなくても自己分解して爆発を起こすため、貯槽には窒素などの不活性ガスを封入する。","酸化エチレンは、空気中の酸素と混ざらなければ爆発しないため、そのままタンクに保管してよい。","酸化エチレンは非常に不安定で「分解爆発」を起こしやすいガスです。空気を遮断するために窒素を封入し、冷却して保管します。"],
            ["A","防爆構造の「本質安全防爆構造」とは、発生する電気火花が、爆発性ガスに点火しないことが確認された構造である。","防爆構造の「本質安全防爆構造」とは、機器の周囲を頑丈な金属で覆い、爆発の圧力を封じ込める構造である。","<div class='reason-box'><b>本質安全防爆構造（Intrinsic Safety：ia/ib）</b>は、電気回路の電流・電圧・エネルギーを極めて小さく制限して、発生する電気火花や熱がガスの最小発火エネルギーに達しないよう設計した構造です。「そもそも点火できないエネルギー量」にすることが本質です。</div><div class='trap-box'>⚠️ 「頑丈な金属で囲む」のは「耐圧防爆構造」です。本質安全防爆構造は外側が頑丈でなくても、電気的エネルギーが非常に小さいので着火しないという考え方です。主に電流計・温度センサー等の計装機器に採用されます（Zone 0区域での使用が可能な唯一の防爆構造）。</div>"],
            ["A","塩素ガスは完全に乾燥した状態であれば常温で鋼（鉄）を腐食しないため、鋼製容器に充填できる。","塩素ガスは強力な腐食性を持つため、いかなる状態であっても鋼製（鉄製）の容器には充填できない。","<div class='reason-box'>塩素（Cl₂）は水分が存在すると<b>塩酸（HCl）と次亜塩素酸（HOCl）を生成</b>し、鋼材を激しく腐食させます。しかし、<b>完全に乾燥した（無水の）塩素ガスは常温では鋼・鉄をほとんど腐食しません</b>。そのため、塩素は乾燥状態を保って鋼製容器（塩素ボンベ）に充填されます。</div><div class='trap-box'>⚠️ 「塩素は何でも腐食する」は誤りです。<b>乾燥塩素（無水）</b>と<b>湿った塩素（水分あり）</b>では腐食挙動が全く異なります。<br>乾燥状態：鋼・鉄 → 使用可能<br>湿潤状態：鋼・鉄 → 腐食する → チタン・ハステロイ等の耐食材料が必要<br>なお、高温（250℃以上）では乾燥状態でも鋼の腐食が進みます。</div>"],
            ["S","アンモニアの容器の塗色は白色である。","アンモニアの容器の塗色は黄色である。","<div class='reason-box'>容器保安規則第10条により、アンモニア（NH₃）の容器外面は<b>白色</b>に塗色することが義務付けられています。黄色は塩素（Cl₂）の容器色です。両者を混同しないように注意が必要です。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 語呂合わせで覚える容器塗色</p><b>アン・シロ</b>（アンモニア→白）｜<b>エン・キ</b>（塩素→黄）<br><b>サン・グロ</b>（酸素→黒）｜<b>スイ・アカ</b>（水素→赤）<br><b>液炭・ミドリ</b>（液化炭酸ガス→緑）｜<b>アセ・チャ</b>（アセチレン→褐色）<br>※特に「アンモニア白」と「塩素黄」の混同に注意！</div>"],
            ["B","ホスゲンの除害には、消石灰水溶液や苛性ソーダ水溶液などのアルカリ水溶液を用いる。","ホスゲンの除害には水が最も適している。","ホスゲンは水には溶けにくく加水分解も遅いため、水だけでは処理できません。強アルカリ性の水溶液を散布して中和・分解させます。"],
            ["B","可燃性ガスの安全弁の排気管の開口部は、周囲に火気のない安全な場所に導き、かつ雨水が浸入しない構造とする。","可燃性ガスの安全弁の排気管の開口部は、点検しやすさを優先し、必ず作業員の足元に向けて開口させる。","<div class='reason-box'>安全弁が作動して可燃性ガスが噴出した場合、<b>近くに火気（電気スイッチ・エンジン・タバコ等）があれば即座に爆発・火災</b>につながります。排気管の開口部は、火気がなく人がいない安全な場所（建物の屋上・大気中へ高く放出等）に設置し、<b>雨水・異物が逆流・滞留しないよう先端をU字型や傘型に工夫</b>します。</div><div class='trap-box'>⚠️ 「作業員の足元に向けて開口」は最も危険な設置方法です。ガス噴出時に作業員が爆発・中毒・窒息する危険があります。安全弁の開口部は「高所へ」「火気のない方向へ」「雨水が入らない向きに」というのが原則です。</div>"],
            ["S","アセチレンを容器に充填する際は、容器内に多孔質物を詰め、それにアセトン等を含ませて、そこに溶解させる。","アセチレンを容器に充填する際は、他の圧縮ガスと同様に、空のボンベにそのまま高圧で圧縮して充填する。","<div class='reason-box'>アセチレン（C₂H₂）は1.5 MPa以上に圧縮すると衝撃・摩擦・火花などの刺激で<b>分解爆発（C₂H₂ → 2C + H₂ + 熱）</b>を起こします。そのため、容器に<b>多孔質物（珪藻土・石綿・木炭等）を充填し、溶剤（アセトンまたはDMF）を含ませて、そこにアセチレンを溶解</b>させる「溶解アセチレン」として安全に保管します。</div><div class='tip-box'>💡 溶解アセチレンのポイント：<br>・容器内にアセチレン単独の空間がないため分解爆発が起きにくい<br>・アセトン1Lにアセチレン約25L（25気圧時）が溶解可能<br>・容器を横にして使うとアセトンが流出するため、<b>必ず立てて使用</b><br>・容器圧力から充填量を計算する際にTW（風袋質量）を使用</div>"],
            ["A","塩素を含むフロンガス（CFC・HCFC系）は、高温の火炎に触れると熱分解してホスゲン・塩化水素などの猛毒ガスを発生することがある。","フロンガスは種類を問わず不燃性・無毒の安全なガスであり、火災時などの高温下においても有害ガスを発生することはない。","<div class='reason-box'>塩素を含むフロン（CFC・HCFC系）は高温分解でホスゲン（COCl₂）等の有毒ガスを生成します。一方、<b>塩素を含まないHFC系</b>（R-410A等）からはホスゲンは生成しませんが、フッ化水素は生成します。「フロン全般＝ホスゲン発生」は誤りです。</div>"],
            ["A","ガスの燃焼において、酸素の供給が不足すると不完全燃焼となり、有毒な一酸化炭素（CO）が発生する。","ガスの燃焼において、酸素の供給が不足して不完全燃焼が起きても、発生するのは無害な二酸化炭素のみである。","<div class='reason-box'>完全燃焼（酸素十分）：CH₄ ＋ 2O₂ → <b>CO₂</b> ＋ 2H₂O（二酸化炭素＋水）<br>不完全燃焼（酸素不足）：2CH₄ ＋ 3O₂ → <b>2CO</b> ＋ 4H₂O（<b>一酸化炭素</b>＋水）<br>酸素が不足すると炭素が完全に酸化されず、毒性の強い<b>一酸化炭素（CO）</b>が発生します。</div><div class='trap-box'>⚠️ 「不完全燃焼でも二酸化炭素だけ」は誤りです。家庭や工場での換気不足による一酸化炭素中毒事故の原因はこの不完全燃焼です。COは無色無臭なのに猛毒（TLV-TWA：25ppm）であり、ヘモグロビンへの親和性はO₂の250倍です。換気の徹底が最重要な予防策です。</div>"],
            ["S","配管の「内部」の欠陥を検出するには、超音波探傷試験（UT）や放射線透過試験（RT）が適している。","配管内部（奥深く）の溶接欠陥を検出するには、浸透探傷試験（PT）が最も適している。","浸透探傷試験（PT）は色付きの液体を塗って「表面のキズ」を見つけるものです。<b>内部のキズ</b>には「放射線透過試験（RT）」や「超音波探傷試験（UT）」を用います。"],
            ["S","タンク内を窒素で置換した後、人が内部に入るためには、さらに空気で置換し、酸素濃度が18%以上であることを確認する。","タンク内を窒素で十分に置換した後であれば、内部は無菌状態になるため人が入って作業しても安全である。","窒素で置換しただけのタンク内は「無酸素状態」です。一呼吸で倒れ死亡する危険があるため、必ずさらに空気で再置換し、酸素濃度を確認してから入ります。"],
            ["B","毒性ガスの除害設備は、吸収剤の交換や補充が容易に行える構造でなければならない。","毒性ガスの除害設備は、吸収剤の交換ができないよう完全に密閉・溶接された構造でなければならない。","除害剤（水や苛性ソーダなど）はガスを吸収すると効果が薄れていくため、緊急時や定期メンテナンスで素早く交換・補充できる構造が必要です。"],
            ["A","ガス漏れを検知するため、配管の継手部に石鹸水を塗布して泡の発生を確認する試験を「発泡漏えい試験」という。","配管の継手部に石鹸水を塗布して泡の発生を確認する試験は、ガス漏れの検知には役に立たない。","現場で最もシンプルかつ確実に行われるガス漏れチェック方法です。微小な漏れでもプクプクと膨らむため、目視で容易に発見できます。"],
            ["B","圧縮機の潤滑油には、ガスの圧縮熱によって高温になっても引火したり分解したりしないよう、引火点が高く熱安定性の良いものが求められる。","圧縮機の潤滑油には、スムーズに流れるように引火点が低く蒸発しやすいものが求められる。","気体を圧縮すると温度が非常に高くなります。潤滑油の引火点が低いと、その熱で油が発火し、圧縮機内部で爆発を起こす原因となります。"],
            ["A","一酸化炭素（CO）を大量に廃棄する場合、燃焼設備を用いて完全燃焼させ、二酸化炭素（CO2）にして大気中に放出する方法がある。","一酸化炭素（CO）を大量に廃棄する場合、そのまま大気中に放出して拡散させれば安全である。","一酸化炭素は猛毒ですが、燃やす（酸化させる）と無毒な二酸化炭素になります。これを「燃焼法」による除害と呼びます。"],
            ["B","オーステナイト系ステンレス鋼は、引張応力と塩化物イオン（海水など）が存在する環境下で「応力腐食割れ」を起こすことがある。","オーステナイト系ステンレス鋼は塩分に極めて強いため、海水にさらされても腐食や割れを起こすことは絶対にない。","<div class='reason-box'>オーステナイト系ステンレス（SUS304など）の弱点です。応力（引っ張られる力）と塩分が揃うと、突然細かいヒビが入って割れる現象が起きます。</div>"],
            ["B","磁粉探傷試験（MT）は、鉄鋼などの磁石にくっつく材料の表面のキズを見つけるのに適している。","磁粉探傷試験（MT）は、ステンレス鋼やアルミニウムなどの非磁性材料のキズを見つけるのに適している。","MTは磁石の力で鉄粉を集めてキズを見つけるため、磁石にくっつかないステンレスやアルミニウムには使えません（鉄鋼材料専用です）。"],
            ["A","遠心式圧縮機（ターボ）を小流量で運転した際、吐出圧力と流量が周期的に変動し激しい振動を伴う現象を「サージング」という。","遠心式圧縮機（ターボ）を小流量で運転した際、配管内に真空が発生して液が逆流する現象を「サージング」という。","サージング（脈動現象）は、圧縮機が息継ぎをしているような状態です。配管や機器を破壊する恐れがあるため、バイパス弁を開いて流量を確保するなどの対策を行います。"],
            ["S","気体の比重（空気を1としたときの重さ）は、その気体の分子量を空気の平均分子量（約29）で割ることで概算できる。","気体の比重（空気を1としたときの重さ）は、気体の種類に関わらず温度だけで決定される。","アボガドロの法則により、重さの比＝分子量の比になります。例えばプロパン（分子量44）は 44÷29 ≒ 1.5倍で空気より重い、と計算できます。"],
            ["A","ポンプの運転において、吐出弁を完全に閉めた状態で長時間運転（締切運転）すると、内部の液温が上昇し故障の原因となる。","ポンプの運転において、吐出弁を完全に閉めた状態で長時間運転（締切運転）しても、液が流れないためポンプに負担はかからない。","逃げ場のない液体が羽根車でかき回され続けるため、摩擦熱で温度が急上昇し、ポンプ内部の焼き付きなどを起こします。"],
            ["A","ターボ圧縮機（遠心式圧縮機）は、往復式圧縮機に比べてガスの脈動が少なく、連続的にガスを送り出せる。","ターボ圧縮機（遠心式圧縮機）は、往復式圧縮機に比べてガスの脈動が大きく、バルブ等の部品の摩耗が激しいのが特徴である。","ターボ式は扇風機のように連続してガスを送り出すため<b>脈動が少ない（流れがスムーズ）</b>です。脈動が大きいのは、ピストンが往復する往復式圧縮機です。"],
            ["S","ガスの漏洩検知において、可燃性ガスには接触燃焼式センサー、毒性ガスには定電位電解式センサーなどがよく用いられる。","ガスの漏洩検知において、すべてのガスは接触燃焼式センサー１種類で検知できる。","接触燃焼式はガスが燃えたときの熱を利用し、定電位電解式はガスが電極で反応して流れる微小な電流を測るため、それぞれの特性に合わせて使い分けます。"],
            ["B","玉形弁（グローブバルブ）は、流体の流量を微調整する（絞る）目的に適したバルブである。","仕切弁（ゲートバルブ）は、流体の流量を微調整する（絞る）目的に最も適したバルブである。","<div class='reason-box'>仕切弁は「全開か全閉か」で使うバルブであり、半開きにすると弁の板が摩耗してしまいます。流量の微調整には「玉形弁（グローブバルブ）」が適しています。</div>"],
            ["B","配管内のガスを不活性ガスで置換する方法のうち、不活性ガスを連続的に流し続けて追い出す方法を「スウィープパージ」という。","配管内のガスを不活性ガスで置換する方法のうち、真空引きしてから不活性ガスを入れるのを繰り返す方法を「加圧パージ」という。","<div class='reason-box'><b>スウィープパージ（掃引パージ）</b>は、不活性ガス（窒素等）を連続的に流し込んで既存のガスを押し出す（掃き出す）方法です。真空引きを繰り返すのは「真空パージ」、加圧してから一気に排出を繰り返すのは「加圧パージ」です。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 パージ方法の種類まとめ</p><b>スウィープパージ：</b>不活性ガスを流し続けて追い出す（一方向流）<br><b>真空パージ：</b>真空引きして残ガスを除去→不活性ガス導入を繰り返す<br><b>加圧パージ：</b>不活性ガスで加圧→一気に排出を繰り返す<br>可燃性ガスの場合は必ず「窒素」等の不活性ガスでパージ！直接空気を入れるのは爆発の危険があります。</div>"],
            ["S","ポンプの吸込口付近で圧力が液体の飽和蒸気圧より低くなり、液体中に気泡が発生する現象を「キャビテーション」という。","ポンプの吸込口付近で圧力が上がり、配管が破裂する現象を「キャビテーション」という。","<div class='reason-box'>キャビテーション（Cavitation：空洞現象）は、ポンプ吸込口で流速が速くなり局所的に圧力が液体の<b>飽和蒸気圧より低く</b>なると、液体が自発的に沸騰して<b>気泡（空洞）が発生する現象</b>です。</div><div class='tip-box'>💡 キャビテーションの影響と対策：<br><b>影響：</b>気泡が下流の高圧部分で崩壊（衝撃波）→羽根車の侵食・振動・騒音・性能低下<br><b>原因：</b>ポンプ設置位置が高すぎる（NPSH不足）、吸込み配管の抵抗が大きい<br><b>対策：</b>ポンプを低い位置に設置、吸込み配管を太く短くする、入口弁を絞らない、液温を下げる（蒸気圧低下）</div>"],
            ["B","防爆構造の電気機器を使用する場合、その機器の「温度等級」は、対象となるガスの「発火点」よりも低いものを選ぶ必要がある。","防爆構造の電気機器を使用する場合、その機器の「温度等級」は、対象となるガスの「発火点」よりも高いものを選ぶ必要がある。","機器の表面温度がガスの発火点を超えると自然発火してしまうため、必ずガスの発火点よりも<b>「表面温度が低くなる」温度等級</b>の機器を選ばなければなりません。"],
            ["A","静電気の発生を抑えるため、可燃性液体の配管内流速は一般に 1 m/s 以下に制限することが推奨される。","静電気の発生を抑えるため、可燃性液体の配管内流速は 10 m/s 以上の高速に保つことが推奨される。","<div class='reason-box'>可燃性液体（ガソリン・灯油・有機溶剤等）は、配管内壁との摩擦で<b>静電気が発生</b>します。流速が速いほど摩擦が増し、静電気の発生量が多くなります。特に電気伝導度が低い液体（電荷が逃げにくい）は静電気が蓄積しやすく、放電による着火の危険があるため<b>流速を1 m/s以下</b>に制限します。</div><div class='trap-box'>⚠️ 「流速を速くして素早く充填する」は静電気の観点では危険です。接地（アース）・等電位ボンディングを施した上で、さらに流速も制限することが重要です。タンクローリーへの充填作業前にはアース線の接続確認が必須です。</div>"],
            ["A","可燃性液体をタンクに注入する際、配管をタンクの底まで伸ばし、液の中へ静かに注入する「液中注入」が推奨される。","可燃性液体をタンクに注入する際、液面の上からホースを垂らして落下させる「落下注入」は、静電気を発生させにくいため推奨される。","<div class='reason-box'>液体を液面上から空中に落下させると、液滴が空気と摩擦して<b>大量の静電気が発生</b>します（帯電した液滴が飛散する状態）。一方、<b>液中注入（配管をタンク底まで伸ばして液面下で静かに注入）</b>では液体が直接液面下に充填されるため、静電気の発生が大幅に抑えられます。</div><div class='tip-box'>💡 液中注入の実施方法：<br>配管の先端をタンク底部近くまで延長→液面以下に開口部を設置→ゆっくりとした流速（1m/s以下）で充填<br>アース（接地）も同時に行うことで静電気対策が完成します。「液面上から落下」は最も危険な充填方法です。</div>"],
            ["B","空気より重いフロンガスや窒素は、無毒であっても地下ピットなどに滞留すると酸素欠乏症（窒息）の危険がある。","フロンガスや窒素は無毒であるため、地下ピットなどの密閉空間で漏洩しても、窒息の危険性は全くない。","<div class='reason-box'>毒性がなくても、ガスが酸素を置き換えて<b>酸素濃度を低下させると酸素欠乏症（窒息）</b>の危険があります。フロン（比重＞1）や窒素（比重≒1）は地下ピット・地下室・タンク内に滞留しやすく、酸素を押し出して酸素欠乏空間を作ります。</div><div class='trap-box'>⚠️ 「無毒だから安全」は大誤解！<br>酸素欠乏の基準：O₂濃度が<b>18%未満</b>で酸素欠乏状態（法令上の危険基準）<br>16%以下：頭痛・思考力低下・吐き気<br>12%以下：意識喪失（体が動かない状態に）<br>6%以下：数分で死亡<br>通常空気のO₂濃度は約21%。わずか3%低下（18%）でも危険域です。</div>"],

            // ===== 追加問題（保安管理）=====
            ["S","水素ガスは爆発下限界が約4%と低く、爆発範囲（4〜75%）が非常に広い上、着火に必要な最小点火エネルギーが約0.017mJと極めて小さい。","水素ガスは分子量が小さく軽いため、漏洩しても上方に急速に拡散し、爆発下限界に達することはほとんどない。","<div class='reason-box'>水素の最小点火エネルギー（0.017mJ）は人体の静電気（数mJ）でも着火するほど微小です。爆発範囲（4〜75%）はガスの中でも最広クラス。水素設備における<b>静電気対策・接地（アース）</b>は最重要課題です。</div>"],
            ["S","アンモニアガスの許容濃度（TLV-TWA）は25ppmであり、刺激臭があることで少量の漏洩に気づきやすいが、高濃度では危険な毒性を発現する。","アンモニアガスは無臭のため高濃度になるまで気づきにくく、非常に危険な毒性ガスである。","<div class='reason-box'>アンモニアは独特の刺激臭で少量の漏洩でも気づけます。許容濃度（TLV-TWA）は<b>25ppm</b>。25ppmを超えると目や喉への刺激、300ppm以上で呼吸困難、1000ppm以上で生命に危険な症状が現れます。（※日本産業衛生学会は20ppm勧告）</div>"],
            ["S","塩素ガスの漏洩検知には「ヨウ化カリウムデンプン紙」を用い、塩素がKIを酸化してI₂を遊離させ、デンプンと反応して青紫色に変色する。","塩素ガスの漏洩検知には「酢酸鉛試験紙」を用い、黒色に変化することで検知する。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 検知試験紙の対応早見表</p>塩素：<b>ヨウ化カリウムデンプン紙</b>（青紫色）<br>硫化水素：<b>酢酸鉛試験紙</b>（黒色：PbS生成）<br>ホスゲン：<b>ハリソン試験紙</b>（赤色）<br>この3つの対応は頻出中の頻出！</div>"],
            ["A","液化窒素（-196℃）を扱う際は、皮膚への接触による凍傷と、密閉空間での酸素欠乏（窒息）の両方の危険性に注意が必要である。","液化窒素は無毒な不活性ガスのため、素手で触れても安全であり、特別な防護具は不要である。","<div class='reason-box'>液化窒素の危険：①-196℃の「凍傷」（接触で即座に組織が凍傷壊死）②1L の液体窒素が気化すると約700Lの気体になる「酸素欠乏」。密閉室では瞬時に酸素濃度が低下して死亡事故に直結します。</div>"],
            ["S","スプリング式安全弁は、設定圧力（吹出し圧力）を超えると自動的に開放してガスを排出し、圧力が正常値に戻ると自動的に再閉止する「自動復帰型」の圧力安全装置である。","安全弁は、設定圧力を超えると開放するが、一度作動したら部品交換しないと再使用できない一回限りの装置である。","「一度作動したら交換が必要」なのは安全弁ではなく<b>「破裂板（ラプチャーディスク）」</b>です。安全弁は圧力が正常値に戻ると自動で閉まり繰り返し使用できます。両者の違いは試験頻出です。"],
            ["A","液化酸素は淡青色の液体で-183℃以下で存在し、有機物（油・グリース・ゴム等）が高濃度酸素に触れると自然発火・爆発する危険がある。","液化酸素は無色透明な液体であり、油が混入しても酸素自体は燃えないため発火・爆発の危険はない。","<div class='reason-box'>液化酸素の色は「淡い青色（空色）」が特徴。高濃度酸素環境では有機物が激しく燃焼します。液酸の製造・貯蔵設備は「絶対に油分禁止」が鉄則です。バルブのグリースにも注意が必要です。</div>"],
            ["S","一酸化炭素（CO）は無色無臭の可燃性かつ毒性ガスであり、ヘモグロビンとの結合力が酸素の約250倍であることから、低濃度でも重篤な中毒を引き起こす。","一酸化炭素（CO）は甘い独特の臭いがあるため、漏洩した場合でも早期に気づいて避難できる。","<div class='reason-box'>COは<b>「無色無臭」</b>で気づかない内に蓄積します。ヘモグロビン（Hb）との親和性はO₂の250倍のため、0.1%（1000ppm）で1時間、0.4%（4000ppm）で数分以内に死亡します。製鉄所・石炭ガス工場での事故が多い危険ガスです。</div>"],
            ["A","毒性ガスの充填容器は、可燃性ガスや不活性ガスの容器と区別し、専用の保管場所または仕切りを設けた場所に分別して保管しなければならない。","毒性ガスの充填容器は整理して置けばよく、他のガスの容器と同じ場所に保管してもよい。","<div class='reason-box'>毒性ガス容器の漏洩は人命に関わる事故につながります。<b>他のガス（可燃性・不活性ガス等）と混在させた保管は禁止</b>されており、専用区画または仕切り（壁・フェンス等）で区分けされた場所での分別保管が義務付けられています。</div><div class='tip-box'>💡 分別保管が必要な理由：<br>①事故時に「どの場所に何のガスがあるか」が即座に把握できるようにするため<br>②可燃性ガスと毒性ガスが混在していると、漏洩時に火災・爆発と中毒が同時に起こる複合事故のリスクが高まる<br>③緊急の消防・救急対応において初動を迅速にするため<br>整理・整頓しているだけでは法令の要件を満たしません。</div>"],
            ["B","水素が燃焼するときの炎（水素炎）は、日中の明るい屋外ではほぼ無色透明に見えるため視認が困難である。","水素が燃焼するときは、可燃性ガスの中でも特に明るいオレンジ色の炎を出すため、遠くからでも確認できる。","<div class='reason-box'>水素炎は<b>淡い青色で可視光線の輝度が非常に低く、日光の中ではほぼ見えません</b>（赤外線は強く放出）。接近作業時は赤外線炎感知器が必須です。知らずに踏み込んで火傷を負う事故が実際に発生しています。</div>"],
            ["A","毒性ガスを移送するポンプは、ダブルメカニカルシール構造、ベローズシール構造、マグネット駆動型など、外部へのガス漏洩を防止する特殊な構造を採用する。","毒性ガスの移送には通常の工業用ポンプを使用し、定期的なグランドパッキンの締め付けで対応すればよい。","<div class='reason-box'>毒性ガスの漏洩は人命と環境に甚大な影響を与えるため、<b>ポンプの軸封（シール）部からのガス漏洩防止が最優先事項</b>です。グランドパッキン（グランドシール）は単純な構造で漏洩しやすく、毒性ガス用には不適切です。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 毒性ガスポンプの軸封構造</p><b>ダブルメカニカルシール：</b>2重のメカシール、間の空間に封液（バリアフルード）を充填してシール漏れを検知<br><b>ベローズシール（ベローズポンプ）：</b>金属製の蛇腹で完全密封<br><b>マグネット駆動型（マグカップリング）：</b>磁力で動力伝達→軸貫通なしで完全密封<br>グランドパッキンは毒性ガスには<b>使用不可</b></div>"],
            ["A","窒素・アルゴン等の不活性ガスは毒性はないが、密閉空間で大量に漏洩すると酸素濃度を低下させ、酸素欠乏症（窒息）を引き起こす危険がある。","不活性ガスは毒性がないため、密閉された地下タンク内で漏洩しても人体への危険は全くない。","<div class='reason-box'>「毒性なし＝安全」は大誤解です。酸素欠乏の段階：21%（正常）→ 18%（欠乏）→ 16%以下（頭痛・判断力低下）→ 12%以下（意識不明）→ 6%以下（数分で死亡）。毒性ガスより気づきにくく危険です。</div>"],
            ["B","往復式圧縮機（レシプロ）は高圧縮比が得やすく少量〜大量まで対応できる反面、ピストンの往復による脈動が生じやすく、配管への振動対策が必要である。","往復式圧縮機（レシプロ）はターボ式と同様に脈動がなく、配管への振動対策は特に必要ない。","<div class='reason-box'>往復式圧縮機（レシプロ：Reciprocating）はピストンの「往復運動」でガスを圧縮するため、<b>吸入→圧縮→吐出のサイクルで間欠的（パルス状）にガスが吐出</b>され、脈動（pulsation）が生じます。これに対してターボ式は連続的な流れで脈動が少ないです。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 往復式（レシプロ）vs 遠心式（ターボ）の比較</p><b>往復式：</b>高圧縮比OK、少〜中量に適す、脈動大、摩耗部品多（弁・ピストン）<br><b>遠心式（ターボ）：</b>高圧縮比は困難、大量に適す、脈動なし（サージングに注意）<br>脈動対策：多気筒化・気筒数を奇数にする・バッファタンク・脈動吸収管・防振継手の採用</div>"],
            ["A","毒性・腐食性の高圧ガス配管のフランジ接続部には、ガス特性（腐食性・温度・圧力）に適したガスケット材（PTFE・スパイラルガスケット等）を選定し、定期的な点検・交換を行う。","高圧ガス配管のフランジ部のガスケットは、安価な汎用品であれば材質にかかわらず使用できる。","<div class='reason-box'>フランジ接続部のガスケットは<b>ガスの腐食性・使用温度・圧力に合わせた材質選定が必須</b>です。不適切なガスケット材は化学的腐食・熱劣化・膨潤などで損傷し、甚大な漏洩事故を引き起こします。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 主なガスケット材料と用途</p><b>PTFE（フッ素樹脂）：</b>化学的耐性が高い、腐食性ガス（HF・HCl・Cl₂）に適す<br><b>スパイラルガスケット：</b>高温高圧に強い（メタルジャケット構造）<br><b>天然ゴム（NBR等）：</b>低圧・常温、腐食性ガスには不向き<br><b>SUS316L製：</b>高温耐腐食性<br>「安価な汎用品を使う」はガスケット起因の重大事故（BLEVE等）の原因になります。</div>"],
            ["S","火災の成立には「可燃物（燃料）」「支燃物（酸素）」「点火源（発火エネルギー）」の燃焼の三要素が同時に揃う必要があり、防火はこのいずれか一つを除去することで達成できる。","火災の成立には「可燃物」と「支燃物（酸素）」の2要素があれば十分で、点火源がなくても自然発火する。","<div class='tip-box'>💡 <b>防火の3戦略：</b><br>①可燃物の除去（代替溶剤への変更等）<br>②不活性ガス封入で酸素を排除（イナーティング）<br>③静電気・火花・高温面などの点火源排除<br>自然発火（発火点超過）も点火源があると同じ扱いです。</div>"],
            ["S","毒性ガスの製造施設の除害設備は、施設内で起こりうる最大量のガスが漏洩した場合でも処理できる能力を持つよう設計・維持しなければならない。","毒性ガスの除害設備は、日常の微小な漏洩を処理できる能力があれば十分で、大規模事故への対応は消防に任せればよい。","<div class='reason-box'>一般高圧ガス保安規則により、毒性ガスの製造施設には<b>「施設内で起こりうる最大量のガス漏洩」を処理できる除害設備の設置・維持が義務</b>付けられています。消防隊が到着するまでの数十分間、施設自体で漏洩ガスを処理できることが求められます。</div><div class='trap-box'>⚠️ 「日常の微小漏洩だけ対応できればよい」「大規模は消防に任せればよい」は誤りです。消防隊が到着する前の初期段階が最も被害が広がりやすいため、<b>最悪シナリオを想定した設計容量（最大漏洩量ベース）</b>が法令上の要件です。除害剤の補充・メンテナンスも義務的に実施する必要があります。</div>"],
            ["S","プロパン（C₃H₈）の分子量は44で空気（約29）より重く、漏洩すると地面・床面付近の低い場所に滞留するため、ガス検知器は床面付近に設置する。","プロパンガスは空気より軽いため、漏洩すると天井部分に滞留する。そのため検知器は天井付近に設置する。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 ガス検知器の設置位置（比重で判断）</p><b>床面付近（低い位置）：</b>プロパン(44)・ブタン(58)・塩素(71)・硫化水素(34)・フロン<br><b>天井付近（高い位置）：</b>水素(2)・アンモニア(17)・アセチレン(26)・メタン(16)<br>分子量29（空気）と比較して判断</div>"],
            ["A","液化天然ガス（LNG）の主成分はメタン（CH₄）であり、常圧での沸点は約-162℃である。液体から気体になると体積は約600倍に膨張する。","液化天然ガス（LNG）の主成分はプロパンであり、常圧での沸点は約-42℃である。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 LNGとLPGの違い（超頻出！）</p><b>LNG</b>（液化天然ガス）：主成分<b>メタン（CH₄）</b>、沸点<b>-162℃</b>、気化膨張<b>約600倍</b><br><b>LPG</b>（液化石油ガス）：主成分<b>プロパン（C₃H₈）</b>＋ブタン（C₄H₁₀）、沸点<b>-42℃</b>（プロパン）<br>この区別は頻出！沸点の数値まで確実に覚えよう</div><div class='reason-box'>LNGの沸点（-162℃）はプロパン（-42℃）より約120℃低く、LNGの方がより深冷な設備が必要です。気化膨張（約600倍）が大きいため、貯蔵タンクからの漏洩は急激な大量気化を引き起こし、火災・爆発事故のリスクが非常に高くなります。LNGはメタンが主成分なので<b>空気より軽く（上昇・拡散）</b>、LPGは空気より重く（沈降・滞留）します。</div>"],
            ["B","塩化水素（HCl）は刺激性の強い毒性ガスで、水分があると塩酸を生じ金属を腐食させる。また空気中では湿気と反応して白煙（塩酸ミスト）を生じる。","塩化水素（HCl）は乾燥した状態では金属を腐食しないが、空気中に放出されると黒煙を生じる。","<div class='reason-box'>塩化水素（HCl）は<b>乾燥状態では鋼・鉄を腐食しない</b>ため、乾燥状態の容器への充填・保管が可能です（塩素と同じ原理）。しかし水分が存在すると<b>塩酸（HCl水溶液）</b>を生成して金属を激しく腐食します。空気中に放出されると空気中の水蒸気と反応して<b>白色のミスト（塩酸ミスト）を生じ白煙</b>のように見えます。</div><div class='trap-box'>⚠️ 「空気中に放出されると黒煙を生じる」は誤りです。黒煙は炭素系物質の燃焼などで生じます。HClが空気中で見せるのは<b>白煙</b>（塩酸ミスト）です。また、アンモニア（NH₃）も空気中のHClと反応して白煙（塩化アンモニウム：NH₄Cl）を生じます。これを利用して「HCl検知」にアンモニア水を使う場合があります。</div>"],
            ["S","フッ化水素（HF）は猛毒の毒性ガスで、皮膚・粘膜を激しく侵すだけでなく、ガラスやセラミックスを溶解する特異な性質を持つ。","フッ化水素（HF）は水に溶けにくい弱い毒性ガスであり、ガラスへの影響はほとんどない。","<div class='reason-box'>フッ化水素の特異性：①<b>ガラスを溶かす</b>（SiO₂ + 4HF → SiF₄ + 2H₂O）ためフッ酸はガラス容器に保存不可、②皮膚に触れると骨まで侵食する遅発性の深達性腐食（フッ素イオンがCa²⁺と反応してカルシウムを奪う）を起こします。</div>"],
            ["A","可燃性ガスで満たされた設備をメンテナンスで開放する際は、まず不活性ガス（窒素等）でパージしてから空気置換し、酸素濃度を確認した後に作業を開始する。","可燃性ガスの設備を開放する際は、空気を直接送り込んでガスを追い出してから作業を開始する。","<div class='reason-box'>可燃性ガスに直接空気を入れると爆発濃度範囲を通過する際に着火・爆発の危険があります。正しい手順：①<b>窒素でパージ</b>（安全な不燃性雰囲気にする）→②<b>空気置換</b>→③<b>酸素濃度確認</b>（18%以上）→作業開始</div>"],
            ["A","緊急遮断弁は、異常検知（火災・地震・ガス漏洩）の際に自動的または手動で閉止し、ガスの流れを遮断して被害の拡大を防ぐ安全装置である。","緊急遮断弁は通常は閉じており、ガスの流量が一定値を超えたときに自動的に開放してガスを逃がす圧力安全装置である。","<div class='reason-box'>緊急遮断弁（ESV：Emergency Shut-Off Valve）は<b>通常は開いており、異常時（火災・地震・ガス漏洩・圧力異常等）に自動または手動で閉止</b>してガスの流れを遮断し、被害の拡大を防ぐ安全装置です。「通常閉・緊急開」のものは安全弁・逃し弁（異常高圧時にガスを放出）です。</div><div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 安全装置の動作方向</p><b>緊急遮断弁（ESV）：</b>通常<b>開</b>→異常時に<b>閉</b>（ガス供給を止める）<br><b>安全弁・逃し弁：</b>通常<b>閉</b>→異常高圧時に<b>開</b>（ガスを放出して減圧）<br><b>破裂板：</b>通常<b>閉</b>→設定圧力超で板が破れて<b>開</b>（一回限り）<br>この方向の違いが試験に出ます！</div>"],
            ["B","防爆エリアの区分において、通常の運転状態で爆発性雰囲気が継続的または長時間存在する区域を「Zone 0」と分類し、最も厳しい防爆規格の機器を使用する。","防爆エリアの区分では、爆発性雰囲気が最も発生しやすい区域を「Zone 2」と分類し、最も厳しい防爆規格の機器を使用する。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 防爆エリア区分</p><b>Zone 0</b>：常時危険→最も厳しい防爆機器（本質安全等）<br><b>Zone 1</b>：通常運転時に時々危険→防爆機器必須<br><b>Zone 2</b>：異常時のみ危険→一般電気機器も条件付きで可</div>"],
            ["A","可燃性ガスで満たされた設備を不活性ガス（窒素等）で充満させ、酸素濃度を爆発に必要なレベル以下に保つ操作を「イナーティング（不活性化）」という。","可燃性ガスで満たされた設備を酸素で充満させ、可燃性ガスを酸化・燃焼させて除去することを「イナーティング（不活性化）」という。","<div class='trap-box'>⚠️ 「酸素を入れる」のは全く逆で爆発の危険があります。イナーティングは<b>酸素を排除して爆発不可能な状態を作る</b>操作です（窒素・アルゴン・CO₂でパージ）。</div>"],
            ["S","可燃性液体をタンクや容器に充填する際に発生する静電気を防ぐため、充填設備とタンクの間は等電位ボンディング（等電位接続）と接地（アース）を行う必要がある。","可燃性液体を充填する際の静電気は、充填速度を上げて素早く充填することで発生を抑えられる。","<div class='reason-box'>静電気対策の3原則：<br>①<b>接地（アース）</b>：発生した電荷を大地に逃がす<br>②<b>等電位ボンディング</b>：異なる機器間の電位差をなくす<br>③<b>流速制限</b>（1m/s以下）：摩擦そのものを減らす<br>充填速度を「上げる」のは逆効果です。</div>"],
            ["A","ガス漏洩の検知警報設備の検知部は、対象ガスの比重や設置場所の換気状況に応じて、適切な高さ（空気より重いガスは床面付近、軽いガスは天井付近）に設置する。","ガス漏洩の検知警報設備は、点検のしやすさを優先して、すべてのガスで作業員の腰の高さに設置するのが最も効果的である。","検知器の高さはガスの比重で決まります。設置ルール：比重＞1（空気より重い）→床面から30cm以内。比重＜1（空気より軽い）→天井から30cm以内。腰の高さは正しくありません。"]
        ];

        const dbKno = [
            ["S","ボイルの法則により、温度一定で気体の圧力を2倍にすると、その体積は半分になる。","ボイルの法則により、温度一定で気体の圧力を2倍にすると、その体積も2倍になる。","<div class='reason-box'>ボイルの法則：$P_1 V_1 = P_2 V_2 = 一定$（温度一定）<br>圧力と体積は<b>反比例</b>。圧力が2倍→体積は1/2倍、圧力が3倍→体積は1/3倍。<br>計算例：P₁=1 MPa、V₁=10L、P₂=2 MPa のとき V₂=5L</div>", 1],

            ["A","液体の蒸気圧が外圧（大気圧）と等しくなったときに、液体の内部からも気化が起こる「沸騰」が始まる。","液体の蒸気圧が外圧より低くなったときに、初めて「沸騰」が始まる。","<div class='reason-box'>蒸気圧 = 外圧（大気圧）になったとき、液体の内部でも気泡が生じて「沸騰」が始まります。<br>液体を加熱すると蒸気圧が上昇し、ある温度（<b>沸点</b>）で外圧と一致します。<br>水の場合：沸点100℃で蒸気圧≒101.3 kPa（1気圧）</div><div class='tip-box'>💡 外圧と沸点の関係（重要！）：<br>外圧↑（高圧鍋）→ より高温にならないと蒸気圧が外圧に追いつけない→沸点が<b>上がる</b>（高い温度で沸騰）<br>外圧↓（山頂・高地）→ より低い蒸気圧で外圧と一致→沸点が<b>下がる</b>（低い温度で沸騰）<br>エベレスト山頂（気圧約34kPa）では約70℃で水が沸騰します。</div>"],
            ["B","絶対零度（0 K）は、セルシウス温度（℃）で表すと -273.15 ℃ である。","絶対零度（0 K）は、セルシウス温度（℃）で表すと 0 ℃ である。","<div class='reason-box'>絶対温度（ケルビン）とセルシウス温度の変換：$T[K] = t[°C] + 273.15$<br>絶対零度 $T = 0K$ のとき $t = 0 - 273.15 = <b>-273.15°C</b>$<br>これ以上温度が下がらない理論上の最低温度で、分子の熱運動が完全に停止した状態です（量子力学的には零点振動が残ります）。</div><div class='tip-box'>💡 よく使う絶対温度の換算：<br>0℃ = 273K（計算では273.15を273として近似することが多い）<br>25℃ = 298K（標準状態）<br>100℃ = 373K<br>-196℃（液体窒素沸点）= 77K<br>「℃に273を足すとK」「KからK引くとは違う」という基本を徹底しましょう。</div>"],

            ["S","メタンの完全燃焼の式（$CH_4 + 2O_2 \\rightarrow CO_2 + 2H_2O$）より、必要な酸素の体積はメタンの体積の2倍である。","メタンの完全燃焼の式より、必要な酸素の体積はメタンの体積と同じである。","反応式の係数に注目します。$CH_4$ の係数は1、$O_2$ の係数は2なので、メタンの2倍の体積の酸素が必要です。", 1],
