<!DOCTYPE html>
<html lang="ja" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>甲種化学 実務＆試験対策アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- KaTeX の導入 (高速数式レンダリング) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        html, body { 
            height: 100%; margin: 0; padding: 0; 
            background-color: #cbd5e1; 
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Meiryo', sans-serif; 
            overflow: hidden; 
        }
        .app-container { 
            width: 100%; max-width: 480px; margin: 0 auto;
            height: 100dvh; 
            background-color: #f8fafc; 
            display: flex; flex-direction: column; 
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .scrollable-content { 
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; 
            padding: 1rem; padding-bottom: 2rem; min-h-0; 
        }
        .btn-active:active { transform: scale(0.96); transition: transform 0.1s; }
        .goro-box { background-color: #fdf2f8; border: 2px solid #fbcfe8; border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; }
        .reason-box { background-color: #eff6ff; border-left: 4px solid #3b82f6; padding: 0.75rem; margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.6;}
        .law-box { background-color: #f0fdf4; border-left: 4px solid #22c55e; padding: 0.75rem; margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.6; }
        .trap-box { background-color: #fff1f2; border-left: 4px solid #f43f5e; padding: 0.75rem; margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.6; }
        .tip-box { background-color: #fffbeb; border: 2px solid #fcd34d; border-radius: 0.5rem; padding: 0.75rem; margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.6; }
        .pop-in { animation: popIn 0.2s ease-out forwards; }
        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .bottom-nav { 
            background: #ffffff; border-top: 1px solid #e2e8f0; 
            display: flex; justify-content: space-around; 
            padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0;
        }
        .nav-item { flex: 1; padding: 0.75rem 0; text-align: center; color: #64748b; font-size: 0.75rem; font-weight: bold; transition: color 0.2s; }
        .nav-item.active { color: #4f46e5; }
        .nav-icon { font-size: 1.25rem; margin-bottom: 0.25rem; display: block; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ヘッダー -->
        <header class="bg-slate-800 text-white p-4 flex justify-between items-center shadow-md flex-shrink-0 z-10">
            <h1 class="text-lg font-bold">甲種化学 最強アプリ</h1>
            <span id="total-count-badge" class="text-xs bg-slate-700 px-2 py-1 rounded">問題読込中…</span>
        </header>

        <!-- メイン画面 -->
        <main class="scrollable-content" id="main-content">
            <!-- ====== ホーム画面 ====== -->
            <div id="view-home" class="flex flex-col h-full">
                <h2 class="text-sm font-bold text-gray-500 mb-2 mt-2">分野別の実力（習得率）</h2>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 space-y-5">
                    <div class="relative w-full bg-slate-100 rounded-full h-3 mt-4">
                        <div id="score-law-text" class="absolute -top-6 left-0 text-xs font-bold text-slate-700">法令 <span class="text-emerald-600">0%</span></div>
                        <div class="absolute -top-4 bottom-0 left-[60%] w-[2px] bg-red-500 z-10 opacity-50"></div>
                        <div id="bar-law" class="bg-emerald-500 h-3 rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                    <div class="relative w-full bg-slate-100 rounded-full h-3 mt-8">
                        <div id="score-sec-text" class="absolute -top-6 left-0 text-xs font-bold text-slate-700">保安管理 <span class="text-amber-500">0%</span></div>
                        <div class="absolute -top-4 bottom-0 left-[60%] w-[2px] bg-red-500 z-10 opacity-50"></div>
                        <div id="bar-sec" class="bg-amber-400 h-3 rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                    <div class="relative w-full bg-slate-100 rounded-full h-3 mt-8 mb-2">
                        <div id="score-kno-text" class="absolute -top-6 left-0 text-xs font-bold text-slate-700">学識 <span class="text-rose-500">0%</span></div>
                        <div class="absolute -top-4 bottom-0 left-[60%] w-[2px] bg-red-500 z-10 opacity-50"></div>
                        <div id="bar-kno" class="bg-rose-400 h-3 rounded-full transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>
                <div class="mt-auto">
                    <button onclick="startReview()" class="btn-active w-full bg-amber-500 text-white font-bold text-lg py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 relative mb-4">
                        <i class="fa-solid fa-brain"></i> 今日の復習を始める
                        <span id="review-badge" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-black px-2 py-1 rounded-full border-2 border-white shadow hidden">0問</span>
                    </button>
                    <p class="text-xs text-center text-gray-500">※新しい学習は下の「学習を選ぶ」から</p>
                </div>
            </div>

            <!-- ====== モード選択画面 ====== -->
            <div id="view-modes" class="hidden flex flex-col h-full gap-4 pt-2">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                    <h2 class="text-base font-bold text-slate-700 mb-4 text-center"><i class="fa-solid fa-filter text-indigo-500"></i> 学習する科目を選ぶ</h2>
                    <div class="flex gap-2 mb-6">
                        <button id="flt-law" onclick="toggleFilter('law')" class="flex-1 bg-emerald-500 text-white font-bold py-3 rounded-lg transition-all border-2 border-emerald-500 text-sm shadow-sm">法令</button>
                        <button id="flt-sec" onclick="toggleFilter('sec')" class="flex-1 bg-amber-500 text-white font-bold py-3 rounded-lg transition-all border-2 border-amber-500 text-sm shadow-sm">保安管理</button>
                        <button id="flt-kno" onclick="toggleFilter('kno')" class="flex-1 bg-rose-500 text-white font-bold py-3 rounded-lg transition-all border-2 border-rose-500 text-sm shadow-sm">学識</button>
                    </div>
                    
                    <button onclick="startQuizMode()" class="btn-active w-full bg-slate-800 text-white font-bold text-lg py-4 rounded-xl shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-pen-to-square"></i> じっくり演習スタート <span class="text-xs bg-slate-600 px-2 py-1 rounded-full ml-1">10問</span>
                    </button>
                </div>
            </div>

            <!-- ====== まとめノート画面 ====== -->
            <div id="view-notebook" class="hidden flex flex-col h-full">
                <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2"><i class="fa-solid fa-star text-yellow-500"></i> まとめノート</h2>
                <div id="notebook-list" class="space-y-4"></div>
                <p id="notebook-empty" class="text-center text-xs text-gray-500 mt-8">※問題画面の★ボタンを押すと、ここに追加されます。</p>
            </div>

            <!-- ====== 演習UI ====== -->
            <div id="ui-standard" class="hidden flex-col h-full">
                <div class="flex justify-between items-center text-xs font-bold mb-3 shrink-0">
                    <div class="flex items-center gap-2">
                        <span id="std-category" class="text-white px-3 py-1 rounded shadow-sm"></span>
                        <span id="std-rank" class="px-2 py-1 rounded border bg-white"></span>
                        <span id="std-counter" class="text-gray-500 ml-1"></span>
                    </div>
                    <button id="std-bookmark" onclick="toggleBookmark(event)" class="text-gray-400 text-2xl p-1 px-2 active:scale-90 transition-transform"><i class="fa-regular fa-star"></i></button>
                </div>
                
                <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-200 mb-4 relative">
                    <p id="std-text" class="text-base font-bold text-slate-800 leading-relaxed"></p>
                    <button id="btn-inline-canvas" onclick="openCanvasModal()" class="hidden w-full mt-5 bg-indigo-50 text-indigo-600 border border-indigo-200 font-bold py-3 rounded-lg flex items-center justify-center gap-2 active:bg-indigo-100">
                        <i class="fa-solid fa-pen-nib"></i> 全画面で計算メモを開く
                    </button>
                </div>

                <div id="std-answers" class="grid gap-4 grid-cols-2 mb-4 shrink-0">
                    <button onclick="checkStandardAnswer(true)" class="btn-active bg-white text-slate-800 font-bold p-3 rounded-xl shadow-sm border-2 border-slate-200 hover:border-indigo-300 text-sm">〇</button>
                    <button onclick="checkStandardAnswer(false)" class="btn-active bg-white text-slate-800 font-bold p-3 rounded-xl shadow-sm border-2 border-slate-200 hover:border-indigo-300 text-sm">×</button>
                </div>

                <div id="std-explanation-view" class="hidden bg-slate-50 rounded-xl p-5 border border-slate-200 shadow-inner mb-6">
                    <div class="flex items-center justify-center mb-4 border-b border-slate-200 pb-3">
                        <span id="std-result-mark" class="text-4xl mr-3 drop-shadow-md"></span>
                    </div>
                    <p class="text-sm text-indigo-600 font-bold mb-2"><i class="fa-solid fa-lightbulb"></i> 詳しい解説</p>
                    <div id="std-explanation-text" class="text-sm text-slate-800 leading-relaxed"></div>
                </div>

                <button id="std-next" onclick="nextQuestion()" class="hidden shrink-0 mt-auto btn-active w-full bg-slate-800 text-white font-bold text-lg py-4 rounded-xl shadow-lg flex items-center justify-center">次の問題へ <i class="fa-solid fa-arrow-right ml-2"></i></button>
                <button id="std-finish" onclick="finishSession()" class="hidden shrink-0 mt-auto btn-active w-full bg-indigo-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg flex items-center justify-center">結果を見る <i class="fa-solid fa-flag-checkered ml-2"></i></button>
            </div>

            <!-- ====== 結果画面 ====== -->
            <div id="ui-result" class="hidden flex-col h-full justify-center text-center">
                <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-200 mb-8 pop-in">
                    <h2 class="text-xl font-bold text-gray-600 mb-2">演習完了</h2>
                    <div class="my-6">
                        <p class="text-sm text-gray-500 mb-1">正解数</p>
                        <p class="text-6xl font-black text-slate-800 tracking-tighter"><span id="res-score" class="text-indigo-600">0</span><span class="text-3xl text-gray-400 font-bold">/<span id="res-total">0</span></span></p>
                    </div>
                </div>
                <button onclick="switchTab('home')" class="btn-active w-full bg-slate-800 text-white font-bold text-lg py-4 rounded-xl shadow mt-auto">ホームに戻る</button>
            </div>
        </main>

        <button id="btn-open-canvas" onclick="openCanvasModal()" class="hidden fixed bottom-[90px] right-6 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-[0_4px_15px_rgba(0,0,0,0.3)] flex items-center justify-center text-xl z-40 active:scale-90 transition-transform">
            <i class="fa-solid fa-pen"></i>
        </button>

        <nav class="bottom-nav">
            <button class="nav-item active" id="tab-home" onclick="switchTab('home')"><i class="fa-solid fa-house nav-icon"></i> ホーム</button>
            <button class="nav-item" id="tab-modes" onclick="switchTab('modes')"><i class="fa-solid fa-graduation-cap nav-icon"></i> 学習を選ぶ</button>
            <button class="nav-item" id="tab-notebook" onclick="switchTab('notebook')"><i class="fa-solid fa-book-bookmark nav-icon"></i> ノート</button>
        </nav>
        
        <!-- 全画面計算メモ -->
        <div id="canvas-modal" class="hidden fixed inset-0 z-[100] bg-white flex flex-col">
            <div class="bg-slate-800 pt-[env(safe-area-inset-top)]"></div>
            <div class="bg-slate-800 text-white p-4 flex justify-between items-center shrink-0 shadow-md">
                <span class="font-bold"><i class="fa-solid fa-pen"></i> 計算メモ</span>
                <div>
                    <button onclick="clearCanvas()" class="bg-slate-600 hover:bg-slate-500 px-4 py-2 rounded text-sm mr-2 font-bold active:scale-95">全消去</button>
                    <button onclick="closeCanvasModal()" class="bg-rose-500 hover:bg-rose-400 px-4 py-2 rounded text-sm font-bold active:scale-95">閉じる</button>
                </div>
            </div>
            <div class="flex-grow relative bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+CjxyZWN0IHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0iI2ZmZiIvPgo8Y2lyY2xlIGN4PSIxIiBjeT0iMSIgcj0iMSIgZmlsbD0iI2UxZTRlOCIvPgo8L3N2Zz4=')]">
                <canvas id="drawing-canvas" class="absolute inset-0 w-full h-full touch-none cursor-crosshair"></canvas>
            </div>
            <div class="bg-white pb-[env(safe-area-inset-bottom)]"></div>
        </div>
    </div>

    <script>
        // ★ 究極の軽量化1: DOM要素を起動時にキャッシュして、以降は検索させない
        const els = {};
        document.addEventListener('DOMContentLoaded', () => {
            const ids = [
                'view-home', 'view-modes', 'view-notebook', 'ui-standard', 'ui-result',
                'score-law-text', 'bar-law', 'score-sec-text', 'bar-sec', 'score-kno-text', 'bar-kno',
                'review-badge', 'btn-open-canvas', 'btn-inline-canvas',
                'std-category', 'std-rank', 'std-counter', 'std-bookmark', 'std-text', 
                'std-answers', 'std-explanation-view', 'std-result-mark', 'std-explanation-text',
                'std-next', 'std-finish', 'res-score', 'res-total',
                'notebook-list', 'notebook-empty', 'main-content', 'canvas-modal', 'drawing-canvas',
                'flt-law', 'flt-sec', 'flt-kno'
            ];
            ids.forEach(id => { els[id] = document.getElementById(id); });
            initApp(); 
        });

        // ==========================================
        // データベース (400問)
        // ==========================================
        const dbLaw = [
            ["S","製造施設の位置変更は、原則として都道府県知事の「許可」が必要である。","製造施設の位置変更は、原則として都道府県知事への「届出」で足りる。","大規模な設備変更は「届出（事後報告）」ではダメで、事前に「許可」が必要です。"],
            ["S","危害予防規程を定め、届け出る義務があるのは第一種製造者のみである。","第一種製造者および第二種製造者は、どちらも危害予防規程を届け出る。","危害予防規程の作成・届出義務があるのは、規模の大きい「第一種製造者」だけです。"],
            ["A","高圧ガスの従業員への「保安教育を施す義務」は第一種・第二種製造者および特定消費者に課せられており、「保安教育計画を定める義務」は第一種製造者に課せられている。","保安教育計画を定める義務は第一種製造者のみであり、第二種製造者や特定消費者には保安教育を施す義務そのものもない。","<div class='trap-box'>⚠️ 「保安教育を<b>施す</b>義務」と「保安教育計画を<b>定める</b>義務」は別物です。<br>教育を施す義務：第一種・第二種・特定消費者 全員<br>教育計画を定める義務：<b>第一種製造者のみ</b>明示的に規定</div>"],
            ["B","高圧ガスの製造施設には、原則として外部の者の立入禁止措置を講じる。","高圧ガスの製造施設であっても、昼間は外部の者の立ち入りを制限しなくてもよい。","関係者以外の立ち入りは厳禁です。標識や柵などの立入禁止措置が求められます。"],
            ["A","第一種製造者は、保安統括者を選任したとき、遅滞なく都道府県知事に届け出る。","第一種製造者は、保安統括者を選任したとき、都道府県知事の許可を受ける。","保安役職を選任・解任した場合は「遅滞なく届出」が必要です。許可ではありません。"],
            ["A","可燃性ガスの容器には外面に「燃」の文字を、毒性ガスの容器には「毒」の文字を表示しなければならない。","可燃性ガスの容器外面には「可燃性」、毒性ガスの容器外面には「毒性」という文字を全文表示する義務がある。","<div class='reason-box'>容器保安規則第10条により、表示義務があるのは<b>「燃」（1文字）</b>と<b>「毒」（1文字）</b>です。「可燃性」「毒性」という複数文字ではありません。不燃性ガスへの表示義務はありません。</div>"],
            ["S","特定高圧ガス消費者は、消費施設について年1回以上定期自主検査を行い記録を保存する。","特定高圧ガス消費者は、小規模であるため定期自主検査を行う義務は免除されている。","特定高圧ガス消費者（モノシラン等を大量に使う者）にも、定期自主検査と記録保存の義務があります。"],
            ["S","第一種製造者は、原則として都道府県知事等が行う「保安検査」を毎年1回受ける。","第一種製造者は、自社で自主検査を行っていれば、行政の「保安検査」は受けなくてよい。","自社の自主検査とは別に、行政やKHKが行う「保安検査」を毎年受ける義務があります。"],
            ["S","移動時にイエローカードの携帯が義務なのは「可燃性・毒性・酸素」などである。","高圧ガスを移動する場合、ガスの種類に関わらず常にイエローカードの携帯が義務である。","イエローカードの携帯が義務なのは、可燃性ガス、毒性ガス、酸素など特定のガスのみです。"],
            ["A","事故発生時は、規模や種類に関わらず、遅滞なく都道府県知事等に届け出る。","事故発生時、第二種製造者などの小規模事業者は都道府県知事等への届出を省略できる。","事故が起きた場合は、規模に関わらずすべての高圧ガス事業者に通報・届出の義務があります。"],
            ["A","第一種製造施設の「軽微な変更」工事を行う場合、完成後に都道府県知事に届け出る。","第一種製造施設の軽微な変更工事を行う場合であっても、事前に知事の許可を受ける。","「軽微な変更」については許可は不要です。工事完成後に「届出」を行えば足ります。"],
            ["B","高圧ガスの廃棄は、不活性ガスであっても定められた基準に従って行う。","高圧ガスの廃棄は、可燃性ガスまたは毒性ガスに限り、定められた基準に従って行う。","廃棄の基準は、無害なガス（窒素など）も含めて「すべての高圧ガス」に適用されます。"],
            ["S","防液堤の設置が義務付けられているのは、可燃性・毒性ガスの「液化ガス」の貯槽である。","防液堤の設置が義務付けられているのは、可燃性・毒性ガスの「圧縮ガス」の貯槽である。","防液堤が必要なのは「液化ガス」の貯槽です。気体の圧縮ガスは漏れても防液堤でせき止められません。"],
            ["A","第一種製造者は、新設等の際、完成検査に合格した後でなければ施設を使用してはならない。","第一種製造者は、工事が完成すれば、完成検査を受ける前でも試運転として施設を使用できる。","施設を新設・変更した場合は、「完成検査」に合格しないと使用開始できません（試運転も不可）。"],
            ["S","高圧ガス移動監視者の資格が必要なのは、可燃性ガス等を「一定数量以上」移動させる場合である。","高圧ガスを移動する場合、運転者はガスの量に関わらず必ず高圧ガス移動監視者の資格を持つ。","監視者が必要になるのは、可燃性ガスや毒性ガスなどを「一定数量（例：300m3）以上」移動させる場合のみです。"],
            ["A","温度35℃で圧力が 1 MPa 以上となる圧縮ガスは、現在の圧力が低くても「高圧ガス」に該当する。","圧縮ガスが高圧ガスに該当するかどうかは、現在の圧力が 1 MPa 以上あるかどうかのみで判断される。","圧縮ガスの定義は「常用温度で1MPa以上、または35℃で1MPa以上となるもの」です。今の圧力が低くても該当します。"],
            ["A","液化ガスの「高圧ガス」の定義は、常用温度において圧力が 0.2 MPa 以上となるものである。","液化ガスの「高圧ガス」の定義は、常用温度において圧力が 1 MPa 以上となるものである。","液化ガスの定義は「常用温度で0.2 MPa以上、または圧力が0.2 MPaとなる温度が35℃以下であるもの」です。"],
            ["S","圧縮アセチレンガスの「高圧ガス」の定義は、温度35℃において圧力が 0.2 MPa 以上となるものである。","圧縮アセチレンガスの「高圧ガス」の定義は、他の圧縮ガスと同じく圧力が 1 MPa 以上となるものである。","アセチレンは爆発しやすいため、他の圧縮ガスよりも厳しい「0.2 MPa」で高圧ガスに分類されます。"],
            ["B","保安係員は、高圧ガス製造保安責任者免状を持ち、かつ所定の経験を有する者から選任する。","保安係員は、高圧ガス製造保安責任者免状さえ持っていれば、実務経験がなくても選任できる。","現場の実務を指揮する保安主任者や保安係員には、国家資格と実務経験の両方が必要です。"],
            ["S","特定高圧ガスはモノシラン等7種類であり、アンモニアや塩素は含まれない。","アンモニアや塩素は「特定高圧ガス」に指定されており、消費する者は知事への届出が必要である。","特定高圧ガスは特殊な7種類です。毒性の強いアンモニアや塩素ですが、特定高圧ガスの枠組みには入りません。"],
            ["A","高圧ガス容器の刻印「TP」は、その容器の耐圧試験圧力（Test Pressure）を表している。","高圧ガス容器の刻印「TP」は、その容器の内容積（リットル）を表している。","「TP」は耐圧試験圧力です。内容積は「V」、質量は「W」と刻印されます。"],
            ["A","販売業者は、高圧ガスの販売事業を開始する日の20日前までに都道府県知事に届け出る。","販売業者は、高圧ガスの販売事業を開始した後、遅滞なく都道府県知事に届け出なければならない。","販売事業は「事後報告（遅滞なく）」ではなく、「開始の20日前まで」に届出を行う必要があります。"],
            ["B","高圧ガスを輸入した者は、輸入したガスおよび容器について、原則「輸入検査」を受けなければならない。","高圧ガスを輸入した者は、海外で検査を受けていれば日本での「輸入検査」は免除される。","海外のガスや容器が日本の厳しい安全基準を満たしているか確認するため、必ず日本での輸入検査が必要です。"],
            ["S","第一種製造者は、危害予防規程を定めたときは都道府県知事に「届け出る」だけでよい。","第一種製造者は、危害予防規程を定めたときは都道府県知事の「認可」を受けなければならない。","危害予防規程は作成して知事に「届け出る」だけで足ります（認可＝お墨付きは不要です）。"],
            ["S","車両で高圧ガスを移動する場合、消火設備の携行義務があるのは「可燃性ガス」と「酸素」の移動時のみである。","車両で高圧ガスを移動する場合、可燃性ガス・酸素・毒性ガスの全ての移動時に消火設備を携行しなければならない。","<div class='reason-box'>一般高圧ガス保安規則第49条より、消火設備の携行義務は<b>「可燃性ガスまたは酸素」の移動時のみ</b>です。毒性ガス（塩素等）だけの移動には消火設備は不要で、代わりに<b>防毒マスク・防護手袋・除害剤</b>の携行が義務付けられています。</div>"],
            ["B","第一種製造者の許可は、正当な理由なく1年以上製造を開始しない場合、取り消されることがある。","第一種製造者の許可は、一度取得すれば、何年間製造を休止しても取り消されることはない。","許可を取ったのに1年間放置したり事業を休止したりすると、権利が取り消される可能性があります。"],
            ["A","保安技術管理者は、製造施設の保安に関する技術的な事項を統括する者であり、第一種製造者において必ず選任する。","保安技術管理者は、第一種製造者において選任が推奨されているが、義務ではない。","保安技術管理者は現場の技術トップであり、一定規模以上の第一種製造事業所では選任が法的に必須です。"],
            ["S","第一種製造者は保安教育計画を定め、それに従って保安教育を施す義務がある。教育の実施記録は安全管理上の観点から保存することが強く推奨される。","第一種製造者には保安教育計画を定める義務はなく、教育は任意で実施すればよい。","第一種製造者には保安教育計画の作成と教育の実施が法令上義務付けられています。実施記録の保存は法令上の明示的義務規定は限定的ですが、保安管理の証拠として保存することが強く推奨されます。"],
            ["A","「指定設備」とは国等の認定を受けた設備であり、これを使用する場合は保安検査の一部が免除される。","「指定設備」を使用する場合であっても、通常の設備と全く同じ厳しい保安検査を受けなければならない。","指定設備認定を受けた信頼性の高い設備は、設置時の検査や定期的な保安検査が免除・緩和されます。"],
            ["S","第二種製造者は許可は不要だが、事業を開始する「20日前まで」に知事に届け出なければならない。","第二種製造者は、製造事業を開始した後、遅滞なくその旨を都道府県知事に届け出なければならない。","第二種製造者は事業を開始する「20日前まで」に知事に「届出」をする必要があります。事後報告は不可です。"],
            ["B","危害予防規程には、自社の従業員だけでなく、協力業者の作業に関する保安も定める。","危害予防規程は、自社の従業員のみを対象とし、協力業者の作業については含まれない。","出入りする協力業者に対する保安の確保も、危害予防規程に定める必要があります。"],
            ["A","第一種製造者は、保安技術管理者が不在のときに備え、必ずあらかじめ「代理者」を選任しておかなければならない。","第一種製造者は、所定の要件を満たす優秀な管理者であれば、代理者を選任しなくてもよい。","保安技術管理者が旅行や病気で不在のときに備え、例外なくあらかじめ「代理者」を選任しておかなければなりません。"],
            ["A","第一種製造者が施設の一部を廃止したときは、許可は不要であり、遅滞なく都道府県知事に届け出ればよい。","第一種製造者が製造施設の一部を廃止したときは、都道府県知事の許可を受けなければならない。","施設の一部廃止は、危険が増す行為ではないため「許可」は不要ですが、遅滞なく「届出」が必要です。"],
            ["B","液化石油ガス以外の高圧ガス販売業者は「取扱主任者」を選任するが、「保安統括者」の選任義務はない。","高圧ガスを販売する場合、販売業者には必ず「保安統括者」を選任する義務がある。","「保安統括者」を選任するのは第一種製造者などです。販売業者には「取扱主任者」の選任義務があります。"],
            ["A","車両で高圧ガスを移動する際、駐車するときは、原則として第一種保安物件（学校等）の付近を避ける。","車両で高圧ガスを移動する際、昼間であれば第一種保安物件（学校等）の付近に駐車してもよい。","学校や病院などの第一種保安物件の近くに、危険な高圧ガス積載車を駐車することは原則禁止されています。"],
            ["A","保安検査は、都道府県知事だけでなく、高圧ガス保安協会（KHK）や指定保安検査機関も行うことができる。","保安検査は、必ず都道府県知事自らが行わなければならず、民間の機関に委託することはできない。","知事の代わりに、専門機関であるKHKや指定保安検査機関が保安検査を行うことが認められています。"],
            ["A","容器に充填するガスの名称は、容器の外面に見やすく「表示（ペイント等）」しなければならない（刻印ではない）。","容器に充填するガスの名称は、消えないように外面に「刻印」しなければならない。","ガスの名称は、容器の外面に白文字などで「表示（ペイント）」します。鉄に掘り込む「刻印」とは異なります。"],
            ["S","定期自主検査の記録は、一般高圧ガス保安規則において原則として「1年以上」保存しなければならない。","定期自主検査の記録は、作成後すみやかに都道府県知事に提出すれば、保存しておく義務はない。","自主検査の記録は、原則として1年以上保存することが義務付けられています（提出ではなく保存義務）。"],
            ["S","許可が必要な変更工事を行った場合は、第一種設備か第二種設備かにかかわらず「完成検査」に合格する必要がある。","第一種製造設備以外の設備（第二種など）について変更工事を行った場合、完成検査は不要である。","許可が必要な変更工事を行った場合は、第一種設備かどうかにかかわらず「完成検査」が必要です。"],
            ["B","高圧ガス製造施設の「第一種保安物件」には、自力避難が困難な学校、病院、および人が集まる劇場が含まれる。","高圧ガス製造施設における「第一種保安物件」には、住宅や一般の工場が含まれる。","自力で避難するのが難しい人が多い施設や、人が多数集まる施設が第一種保安物件に指定されています。"],
            ["A","特定高圧ガスの消費は、消費を開始する日の「20日前まで」に都道府県知事に届け出なければならない。","特定高圧ガスの消費者は、消費を開始した日から30日以内に都道府県知事に届け出ればよい。","特定高圧ガスの消費は、消費を開始する日の「20日前まで」に届け出なければなりません。事後報告ではダメです。"],
            ["A","特定高圧ガス消費者が消費施設に選任するのは「特定高圧ガス取扱主任者」である。","特定高圧ガス消費者は、消費施設に「保安責任者」を選任し、都道府県知事に届け出なければならない。","特定高圧ガス消費者が選任するのは「特定高圧ガス取扱主任者」です。保安責任者という名称ではありません。"],
            ["A","高圧ガスを充填する容器は、あらかじめ容器検査に合格し、容器検査合格印が「刻印」されたものでなければならない。","高圧ガスを充填する容器は、目視でサビや傷がなければ、容器検査合格印がなくても充填してよい。","安全性が確認されていない容器に高圧ガスを詰めることは非常に危険なため、合格印（刻印）は必須です。"],
            ["S","可燃性ガスと酸素の充填容器を同一車両で混載する場合、充填容器等の内容積の合計が20リットル以下であるなど法定の条件を満たす場合に限り認められる。","可燃性ガスと酸素を同一の車両で積載して移動することは、いかなる場合も禁止されている。","<div class='reason-box'>原則は混載禁止ですが、<b>充填容器の内容積合計が20L以下</b>など法定の例外条件を満たす場合に限り混載できます（例：小型溶接セット）。「仕切り板を設ける」などの措置だけで無制限に混載できるわけではありません。</div>"],
            ["S","毒性ガスの容器の外面の塗色は、原則として『ねずみ色（グレー）』である。","毒性ガスの容器の外面の塗色は、危険を示すために原則として『赤色』である。","容器の塗色ルールにおいて、毒性ガス（アンモニア、塩素などを除く）の一般的な塗色は「ねずみ色」です。"],
            ["B","アセチレン容器には安全のため多孔質物と溶剤が入っており、その風袋質量（TW）の刻印には多孔質物の質量も含まれる。","アセチレンガスの容器の刻印（TW）には、容器本体の質量のみが含まれ、多孔質物の質量は含まれない。","アセチレン容器内には多孔質物と溶剤が入っているため、風袋質量（TW）としてその重さも含めて刻印されます。"],
            ["B","高圧ガス製造保安責任者免状は、都道府県知事が交付するが、国家資格であるため全国どこでも有効である。","高圧ガス製造保安責任者免状は都道府県知事が交付するため、交付された都道府県内でのみ有効である。","免状の交付者は都道府県知事ですが、国家資格であるため一度取得すれば日本全国どの事業所でも使用できます。"],
            ["A","事業の全部または一部を休止しようとするときは、許可は不要であり、あらかじめ都道府県知事に「届け出る」だけでよい。","第一種製造者は、事業の全部または一部を休止しようとするときは、あらかじめ知事の許可を受けなければならない。","事業を休止する場合は、危険性が高まるわけではないため許可は不要です。「あらかじめ届出」を行えば足ります。"],
            ["A","保安教育計画を定め、実施する義務（責任）を負うのは「事業者」であり、保安技術管理者ではない。","保安技術管理者は、第一種製造所において、自ら保安教育計画を作成し、実施する義務を負う。","保安教育計画を定め、実施する義務を負うのは「事業者」です。保安技術管理者はそれを補助する立場です。"],
            ["B","指定保安検査機関は、経済産業大臣または都道府県知事の指定を受けた「民間」の検査機関である。","指定保安検査機関は、都道府県の職員のみで構成される公的な検査機関である。","国や県から指定を受けた民間の機関が、行政に代わって保安検査を行うことができる制度があります。"],

            // ===== 追加問題（法令）=====
            ["S","充填容器（残ガス容器を含む）の保管場所は、常に温度40℃以下に保たなければならない。","充填容器は直射日光に当たらない場所で保管すればよく、特定の温度以下に保つ法的な義務はない。","<div class='reason-box'>容器内のガスは温度上昇で内圧が急激に上がります。40℃を超えると安全弁が作動したり、最悪の場合破裂するため、<b>「常に40℃以下」</b>は絶対的なルールです。残ガス容器も対象です。</div>"],
            ["S","第一種貯蔵所（貯蔵量が300m³または3000kg以上）を設置するには、都道府県知事の「許可」が必要である。","第一種貯蔵所を設置するには、都道府県知事への「届出」のみで足りる。","<div class='trap-box'>⚠️ <b>試験の罠：</b>「第一種貯蔵所（300m³/3000kg以上）＝知事の許可」「第二種貯蔵所（それ未満）＝届出のみ」の区別が頻出。貯蔵量が多いほど規制が厳しくなります。</div>"],
            ["A","製造保安責任者の選任・解任を行った場合、どちらの場合も遅滞なく都道府県知事に届け出なければならない。","製造保安責任者を新たに選任した場合は届け出るが、解任した場合には届出の義務はない。","選任も解任も「遅滞なく届出」が必要です。担当者が誰かを行政が常に把握するための制度です。解任だけ届け出なければ記録と実態が乖離し、保安体制が不明確になります。"],
            ["B","高圧ガスを車両で移動中に事故が発生した場合、速やかに最寄りの消防署・警察署または海上保安部等に直接届け出なければならない。","高圧ガスを移動中に事故が発生した場合、まず製造元の会社に連絡し、会社を経由して行政に報告すればよい。","<div class='reason-box'>移動中の事故は、会社経由の間接報告ではなく、<b>直接、行政機関（消防・警察・海上保安部）に通報</b>する義務があります。事故後に被害が拡大する前に行政が状況を把握できるようにするためです。</div>"],
            ["S","高圧ガスの容器は、容器再検査の期限が来たら再検査を受けなければならず、合格しなければ高圧ガスを充填することはできない。","高圧ガス容器は、最初の製造時の検査（容器検査）に合格すれば、その後の定期的な再検査は必要ない。","容器は使用年月とともに劣化・腐食が進みます。容器の種類ごとに定められた期間ごとに「容器再検査」を受け、合格し続けなければ使用できません。期限切れ容器への充填は厳禁です。"],
            ["A","認定完成検査実施者として認定された事業者は、自ら行った完成検査の結果を知事に届け出ることで、知事等が行う完成検査の受検が不要になる。","認定完成検査実施者であっても、新設・変更工事の完成検査は必ず知事等が直接実施しなければならない。","高い保安水準が認められた優良事業者に認定される制度です。自社完成検査の結果を届け出ることで、行政検査の手続きが不要になり、迅速に設備を稼働開始できます。"],
            ["A","可燃性ガスを廃棄する場合、火気のない安全な場所で少量ずつ大気に放出するか、燃焼設備で焼却（燃焼法）して廃棄しなければならない。","可燃性ガスを廃棄する場合、拡散が速いため、まとめて一度に大気に放出するのが安全かつ効率的である。","大量放出は爆発混合気体を形成する危険があります。廃棄の二大原則：①<b>少量ずつ拡散させる</b>（燃焼範囲に達しないよう希釈）、②<b>燃焼法</b>（燃やして無害なCO₂等に変換）です。"],
            ["B","高圧ガス保安協会（KHK）は、高圧ガス保安法に基づいて設立された公益法人であり、保安検査・容器検査・製品認定・保安教育などの業務を担う。","高圧ガス保安協会（KHK）は純粋な民間企業であり、高圧ガス保安法上の公的な権限は一切持っていない。","KHKは法律に基づく公益法人です。経済産業大臣の指定を受けて、行政に代わり保安検査・容器検査・特定機器認証・保安教育・調査研究を実施しています。"],

            ["B","充填容器を他者に譲渡・引渡しする場合、容器の外面に定められた表示（塗色・刻印・文字表示）がすべて揃っていなければ行ってはならない。","充填容器の譲渡・引渡しは、ガスの種類と量がわかれば、容器の外面表示が不完全でも行ってよい。","表示のない容器は「何のガスが入っているか不明」で非常に危険です。塗色・刻印・文字表示はすべて安全管理上の必須情報であり、いずれか一つでも欠けると譲渡・引渡しは禁止されています。"],

            ["S","輸入した高圧ガスおよびその容器は、日本の輸入検査を受け合格しなければ、原則として移動・消費・販売することができない。","輸入した高圧ガスは、製造国の安全基準を満たしていれば、日本の輸入検査なしに国内で使用できる。","海外の安全基準が日本の基準と同等以上かどうかは個別に確認が必要です。輸入品は日本の「輸入検査」に合格しなければ国内での使用・移動・販売が原則として禁止されます。"],

            ["S","可燃性ガスをパージする際、まず窒素等の不活性ガスで追い出し、その後、空気で置換するのが正しい。","可燃性ガスをパージする際、まず設備内に空気を送り込んでガスを追い出すのが正しい手順である。","<div class='reason-box'>可燃性ガスに直接「空気（酸素）」を入れると大爆発します。正解は<b>「①窒素で追い出す → ②その後、空気で置換する」</b>です。</div>"],
            ["S","配管の両端のバルブを閉め、内部に液化ガスが満たされた状態を「液封」と呼び、温度上昇により配管が破裂する危険がある。","配管の両端のバルブを閉め、内部に液化ガスが満たされた状態を「液封」と呼び、安全にガスを保管できる状態である。","液体は気体と違って圧縮されないため、逃げ場のない状態で温度が上がって膨張しようとすると、配管を破裂させるほどの超高圧になります。"],
            ["B","ホスゲンの漏洩検知には、ハリソン試験紙を用い、ガスに触れると赤色に変化する。","ホスゲンの漏洩検知には、アンモニア水を含ませた綿球を近づけて白煙を確認する方法が適している。","白煙（塩化アンモニウム）を生じるのは「塩素」や「塩化水素」です。ホスゲンには「ハリソン試験紙（赤色変化）」を用います。"],
            ["A","シアン化水素が漏洩した際の除害剤として、水酸化ナトリウム水溶液（苛性ソーダ）を用いるのは適切である。","シアン化水素が漏洩した際の除害剤として、塩酸などの酸性水溶液を用いるのは適切である。","シアン化水素は「弱酸性」なので、強アルカリである苛性ソーダ水溶液で中和・吸収させるのが効果的です。"],
            ["S","酸化エチレンは、空気がなくても自己分解して爆発を起こすため、貯槽には窒素などの不活性ガスを封入する。","酸化エチレンは、空気中の酸素と混ざらなければ爆発しないため、そのままタンクに保管してよい。","酸化エチレンは非常に不安定で「分解爆発」を起こしやすいガスです。空気を遮断するために窒素を封入し、冷却して保管します。"],
            ["A","防爆構造の「本質安全防爆構造」とは、発生する電気火花が、爆発性ガスに点火しないことが確認された構造である。","防爆構造の「本質安全防爆構造」とは、機器の周囲を頑丈な金属で覆い、爆発の圧力を封じ込める構造である。","そもそも「火花が出てもエネルギーが小さすぎて着火しない」ように設計された、最も安全性が高い構造です（主にセンサー等に使われます）。"],
            ["A","塩素ガスは完全に乾燥した状態であれば常温で鋼（鉄）を腐食しないため、鋼製容器に充填できる。","塩素ガスは強力な腐食性を持つため、いかなる状態であっても鋼製（鉄製）の容器には充填できない。","塩素は水分と混ざると金属を激しく腐食させますが、完全に乾燥していれば鋼材を腐食しません。水分がある場合はチタンなどを使います。"],
            ["S","アンモニアの容器の塗色は白色である。","アンモニアの容器の塗色は黄色である。","アンモニアは「白色」です。黄色は「塩素」です（アンシロ、エンキの語呂合わせ）。"],
            ["B","ホスゲンの除害には、消石灰水溶液や苛性ソーダ水溶液などのアルカリ水溶液を用いる。","ホスゲンの除害には水が最も適している。","ホスゲンは水には溶けにくく加水分解も遅いため、水だけでは処理できません。強アルカリ性の水溶液を散布して中和・分解させます。"],
            ["B","可燃性ガスの安全弁の排気管の開口部は、周囲に火気のない安全な場所に導き、かつ雨水が浸入しない構造とする。","可燃性ガスの安全弁の排気管の開口部は、点検しやすさを優先し、必ず作業員の足元に向けて開口させる。","ガスが噴き出した際、近くに火元があると大惨事になります。屋根の上などに放出し、雨水が溜まらないよう先端を曲げるなどの工夫をします。"],
            ["S","アセチレンを容器に充填する際は、容器内に多孔質物を詰め、それにアセトン等を含ませて、そこに溶解させる。","アセチレンを容器に充填する際は、他の圧縮ガスと同様に、空のボンベにそのまま高圧で圧縮して充填する。","アセチレンは単独で高圧に圧縮すると「分解爆発」を起こすため、そのままボンベに詰めることができません。溶剤に溶かし込んだ「溶解ガス」として保管します。"],
            ["A","塩素を含むフロンガス（CFC・HCFC系）は、高温の火炎に触れると熱分解してホスゲン・塩化水素などの猛毒ガスを発生することがある。","フロンガスは種類を問わず不燃性・無毒の安全なガスであり、火災時などの高温下においても有害ガスを発生することはない。","<div class='reason-box'>塩素を含むフロン（CFC・HCFC系）は高温分解でホスゲン（COCl₂）等の有毒ガスを生成します。一方、<b>塩素を含まないHFC系</b>（R-410A等）からはホスゲンは生成しませんが、フッ化水素は生成します。「フロン全般＝ホスゲン発生」は誤りです。</div>"],
            ["A","ガスの燃焼において、酸素の供給が不足すると不完全燃焼となり、有毒な一酸化炭素（CO）が発生する。","ガスの燃焼において、酸素の供給が不足して不完全燃焼が起きても、発生するのは無害な二酸化炭素のみである。","メタンなどが完全燃焼すれば二酸化炭素になりますが、酸素が足りないと有毒な一酸化炭素が発生し、中毒の原因となります。"],
            ["S","配管の「内部」の欠陥を検出するには、超音波探傷試験（UT）や放射線透過試験（RT）が適している。","配管内部（奥深く）の溶接欠陥を検出するには、浸透探傷試験（PT）が最も適している。","浸透探傷試験（PT）は色付きの液体を塗って「表面のキズ」を見つけるものです。<b>内部のキズ</b>には「放射線透過試験（RT）」や「超音波探傷試験（UT）」を用います。"],
            ["S","タンク内を窒素で置換した後、人が内部に入るためには、さらに空気で置換し、酸素濃度が18%以上であることを確認する。","タンク内を窒素で十分に置換した後であれば、内部は無菌状態になるため人が入って作業しても安全である。","窒素で置換しただけのタンク内は「無酸素状態」です。一呼吸で倒れ死亡する危険があるため、必ずさらに空気で再置換し、酸素濃度を確認してから入ります。"],
            ["B","毒性ガスの除害設備は、吸収剤の交換や補充が容易に行える構造でなければならない。","毒性ガスの除害設備は、吸収剤の交換ができないよう完全に密閉・溶接された構造でなければならない。","除害剤（水や苛性ソーダなど）はガスを吸収すると効果が薄れていくため、緊急時や定期メンテナンスで素早く交換・補充できる構造が必要です。"],
            ["A","ガス漏れを検知するため、配管の継手部に石鹸水を塗布して泡の発生を確認する試験を「発泡漏えい試験」という。","配管の継手部に石鹸水を塗布して泡の発生を確認する試験は、ガス漏れの検知には役に立たない。","現場で最もシンプルかつ確実に行われるガス漏れチェック方法です。微小な漏れでもプクプクと膨らむため、目視で容易に発見できます。"],
            ["B","圧縮機の潤滑油には、ガスの圧縮熱によって高温になっても引火したり分解したりしないよう、引火点が高く熱安定性の良いものが求められる。","圧縮機の潤滑油には、スムーズに流れるように引火点が低く蒸発しやすいものが求められる。","気体を圧縮すると温度が非常に高くなります。潤滑油の引火点が低いと、その熱で油が発火し、圧縮機内部で爆発を起こす原因となります。"],
            ["A","一酸化炭素（CO）を大量に廃棄する場合、燃焼設備を用いて完全燃焼させ、二酸化炭素（CO2）にして大気中に放出する方法がある。","一酸化炭素（CO）を大量に廃棄する場合、そのまま大気中に放出して拡散させれば安全である。","一酸化炭素は猛毒ですが、燃やす（酸化させる）と無毒な二酸化炭素になります。これを「燃焼法」による除害と呼びます。"],
            ["B","オーステナイト系ステンレス鋼は、引張応力と塩化物イオン（海水など）が存在する環境下で「応力腐食割れ」を起こすことがある。","オーステナイト系ステンレス鋼は塩分に極めて強いため、海水にさらされても腐食や割れを起こすことは絶対にない。","<div class='reason-box'>オーステナイト系ステンレス（SUS304など）の弱点です。応力（引っ張られる力）と塩分が揃うと、突然細かいヒビが入って割れる現象が起きます。</div>"],
            ["B","磁粉探傷試験（MT）は、鉄鋼などの磁石にくっつく材料の表面のキズを見つけるのに適している。","磁粉探傷試験（MT）は、ステンレス鋼やアルミニウムなどの非磁性材料のキズを見つけるのに適している。","MTは磁石の力で鉄粉を集めてキズを見つけるため、磁石にくっつかないステンレスやアルミニウムには使えません（鉄鋼材料専用です）。"],
            ["A","遠心式圧縮機（ターボ）を小流量で運転した際、吐出圧力と流量が周期的に変動し激しい振動を伴う現象を「サージング」という。","遠心式圧縮機（ターボ）を小流量で運転した際、配管内に真空が発生して液が逆流する現象を「サージング」という。","サージング（脈動現象）は、圧縮機が息継ぎをしているような状態です。配管や機器を破壊する恐れがあるため、バイパス弁を開いて流量を確保するなどの対策を行います。"],
            ["S","気体の比重（空気を1としたときの重さ）は、その気体の分子量を空気の平均分子量（約29）で割ることで概算できる。","気体の比重（空気を1としたときの重さ）は、気体の種類に関わらず温度だけで決定される。","アボガドロの法則により、重さの比＝分子量の比になります。例えばプロパン（分子量44）は 44÷29 ≒ 1.5倍で空気より重い、と計算できます。"],
            ["A","ポンプの運転において、吐出弁を完全に閉めた状態で長時間運転（締切運転）すると、内部の液温が上昇し故障の原因となる。","ポンプの運転において、吐出弁を完全に閉めた状態で長時間運転（締切運転）しても、液が流れないためポンプに負担はかからない。","逃げ場のない液体が羽根車でかき回され続けるため、摩擦熱で温度が急上昇し、ポンプ内部の焼き付きなどを起こします。"],
            ["A","ターボ圧縮機（遠心式圧縮機）は、往復式圧縮機に比べてガスの脈動が少なく、連続的にガスを送り出せる。","ターボ圧縮機（遠心式圧縮機）は、往復式圧縮機に比べてガスの脈動が大きく、バルブ等の部品の摩耗が激しいのが特徴である。","ターボ式は扇風機のように連続してガスを送り出すため<b>脈動が少ない（流れがスムーズ）</b>です。脈動が大きいのは、ピストンが往復する往復式圧縮機です。"],
            ["S","ガスの漏洩検知において、可燃性ガスには接触燃焼式センサー、毒性ガスには定電位電解式センサーなどがよく用いられる。","ガスの漏洩検知において、すべてのガスは接触燃焼式センサー１種類で検知できる。","接触燃焼式はガスが燃えたときの熱を利用し、定電位電解式はガスが電極で反応して流れる微小な電流を測るため、それぞれの特性に合わせて使い分けます。"],
            ["B","玉形弁（グローブバルブ）は、流体の流量を微調整する（絞る）目的に適したバルブである。","仕切弁（ゲートバルブ）は、流体の流量を微調整する（絞る）目的に最も適したバルブである。","<div class='reason-box'>仕切弁は「全開か全閉か」で使うバルブであり、半開きにすると弁の板が摩耗してしまいます。流量の微調整には「玉形弁（グローブバルブ）」が適しています。</div>"],
            ["B","配管内のガスを不活性ガスで置換する方法のうち、不活性ガスを連続的に流し続けて追い出す方法を「スウィープパージ」という。","配管内のガスを不活性ガスで置換する方法のうち、真空引きしてから不活性ガスを入れるのを繰り返す方法を「加圧パージ」という。","スウィープ（掃き出す）パージは、流し続けて追い出す方法です。真空引きするのは「真空パージ」です。"],
            ["S","ポンプの吸込口付近で圧力が液体の飽和蒸気圧より低くなり、液体中に気泡が発生する現象を「キャビテーション」という。","ポンプの吸込口付近で圧力が上がり、配管が破裂する現象を「キャビテーション」という。","キャビテーション（空洞現象）が起きると、発生した気泡がポンプ内で弾けて激しい振動や騒音を引き起こし、ポンプの羽根車を壊してしまいます。"],
            ["B","防爆構造の電気機器を使用する場合、その機器の「温度等級」は、対象となるガスの「発火点」よりも低いものを選ぶ必要がある。","防爆構造の電気機器を使用する場合、その機器の「温度等級」は、対象となるガスの「発火点」よりも高いものを選ぶ必要がある。","機器の表面温度がガスの発火点を超えると自然発火してしまうため、必ずガスの発火点よりも<b>「表面温度が低くなる」温度等級</b>の機器を選ばなければなりません。"],
            ["A","静電気の発生を抑えるため、可燃性液体の配管内流速は一般に 1 m/s 以下に制限することが推奨される。","静電気の発生を抑えるため、可燃性液体の配管内流速は 10 m/s 以上の高速に保つことが推奨される。","流速が速いほど静電気が発生しやすいため、特に導電率の低い（電気が逃げにくい）可燃性液体を流す場合は、流速を 1 m/s 以下などの安全な速度に制限します。"],
            ["A","可燃性液体をタンクに注入する際、配管をタンクの底まで伸ばし、液の中へ静かに注入する「液中注入」が推奨される。","可燃性液体をタンクに注入する際、液面の上からホースを垂らして落下させる「落下注入」は、静電気を発生させにくいため推奨される。","空中で液体が飛び散ると激しく静電気が発生するため非常に危険です。配管を底まで伸ばす「液中注入」が推奨されます。"],
            ["B","空気より重いフロンガスや窒素は、無毒であっても地下ピットなどに滞留すると酸素欠乏症（窒息）の危険がある。","フロンガスや窒素は無毒であるため、地下ピットなどの密閉空間で漏洩しても、窒息の危険性は全くない。","空気より重いガスが地下に滞留すると、空気を押し出してしまうため「酸素欠乏症（窒息）」の重大な危険があります。毒性がなくても危険です。"],

            // ===== 追加問題（保安管理）=====
            ["S","水素ガスは爆発下限界が約4%と低く、爆発範囲（4〜75%）が非常に広い上、着火に必要な最小点火エネルギーが約0.017mJと極めて小さい。","水素ガスは分子量が小さく軽いため、漏洩しても上方に急速に拡散し、爆発下限界に達することはほとんどない。","<div class='reason-box'>水素の最小点火エネルギー（0.017mJ）は人体の静電気（数mJ）でも着火するほど微小です。爆発範囲（4〜75%）はガスの中でも最広クラス。水素設備における<b>静電気対策・接地（アース）</b>は最重要課題です。</div>"],
            ["S","アンモニアガスの許容濃度は20ppm（日本産業衛生学会）であり、刺激臭があることで少量の漏洩に気づきやすいが、高濃度では危険な毒性を発現する。","アンモニアガスは無臭のため高濃度になるまで気づきにくく、非常に危険な毒性ガスである。","<div class='reason-box'>アンモニアは独特の刺激臭で少量の漏洩でも気づけます。許容濃度は<b>20ppm（日本産業衛生学会）</b>。20ppmを超えると目や喉への刺激、300ppm以上で呼吸困難、1000ppm以上で生命に危険な症状が現れます。</div>"],
            ["S","塩素ガスの漏洩検知には「ヨウ化カリウムデンプン紙」を用い、塩素がKIを酸化してI₂を遊離させ、デンプンと反応して青紫色に変色する。","塩素ガスの漏洩検知には「酢酸鉛試験紙」を用い、黒色に変化することで検知する。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 検知試験紙の対応早見表</p>塩素：<b>ヨウ化カリウムデンプン紙</b>（青紫色）<br>硫化水素：<b>酢酸鉛試験紙</b>（黒色：PbS生成）<br>ホスゲン：<b>ハリソン試験紙</b>（赤色）<br>この3つの対応は頻出中の頻出！</div>"],
            ["A","液化窒素（-196℃）を扱う際は、皮膚への接触による凍傷と、密閉空間での酸素欠乏（窒息）の両方の危険性に注意が必要である。","液化窒素は無毒な不活性ガスのため、素手で触れても安全であり、特別な防護具は不要である。","<div class='reason-box'>液化窒素の危険：①-196℃の「凍傷」（接触で即座に組織が凍傷壊死）②1L の液体窒素が気化すると約700Lの気体になる「酸素欠乏」。密閉室では瞬時に酸素濃度が低下して死亡事故に直結します。</div>"],
            ["S","スプリング式安全弁は、設定圧力（吹出し圧力）を超えると自動的に開放してガスを排出し、圧力が正常値に戻ると自動的に再閉止する「自動復帰型」の圧力安全装置である。","安全弁は、設定圧力を超えると開放するが、一度作動したら部品交換しないと再使用できない一回限りの装置である。","「一度作動したら交換が必要」なのは安全弁ではなく<b>「破裂板（ラプチャーディスク）」</b>です。安全弁は圧力が正常値に戻ると自動で閉まり繰り返し使用できます。両者の違いは試験頻出です。"],
            ["A","液化酸素は淡青色の液体で-183℃以下で存在し、有機物（油・グリース・ゴム等）が高濃度酸素に触れると自然発火・爆発する危険がある。","液化酸素は無色透明な液体であり、油が混入しても酸素自体は燃えないため発火・爆発の危険はない。","<div class='reason-box'>液化酸素の色は「淡い青色（空色）」が特徴。高濃度酸素環境では有機物が激しく燃焼します。液酸の製造・貯蔵設備は「絶対に油分禁止」が鉄則です。バルブのグリースにも注意が必要です。</div>"],
            ["S","一酸化炭素（CO）は無色無臭の可燃性かつ毒性ガスであり、ヘモグロビンとの結合力が酸素の約250倍であることから、低濃度でも重篤な中毒を引き起こす。","一酸化炭素（CO）は甘い独特の臭いがあるため、漏洩した場合でも早期に気づいて避難できる。","<div class='reason-box'>COは<b>「無色無臭」</b>で気づかない内に蓄積します。ヘモグロビン（Hb）との親和性はO₂の250倍のため、0.1%（1000ppm）で1時間、0.4%（4000ppm）で数分以内に死亡します。製鉄所・石炭ガス工場での事故が多い危険ガスです。</div>"],
            ["A","毒性ガスの充填容器は、可燃性ガスや不活性ガスの容器と区別し、専用の保管場所または仕切りを設けた場所に分別して保管しなければならない。","毒性ガスの充填容器は整理して置けばよく、他のガスの容器と同じ場所に保管してもよい。","毒性ガスは漏洩時に広範囲に被害が及びます。他のガスと混在させると事故時の状況把握が困難になるため、専用または区画された場所での分別保管が義務付けられています。"],
            ["B","水素が燃焼するときの炎（水素炎）は、日中の明るい屋外ではほぼ無色透明に見えるため視認が困難である。","水素が燃焼するときは、可燃性ガスの中でも特に明るいオレンジ色の炎を出すため、遠くからでも確認できる。","<div class='reason-box'>水素炎は<b>淡い青色で可視光線の輝度が非常に低く、日光の中ではほぼ見えません</b>（赤外線は強く放出）。接近作業時は赤外線炎感知器が必須です。知らずに踏み込んで火傷を負う事故が実際に発生しています。</div>"],
            ["A","毒性ガスを移送するポンプは、ダブルメカニカルシール構造、ベローズシール構造、マグネット駆動型など、外部へのガス漏洩を防止する特殊な構造を採用する。","毒性ガスの移送には通常の工業用ポンプを使用し、定期的なグランドパッキンの締め付けで対応すればよい。","毒性ガス設備のシール（封止機構）は二重以上が基本です。シングルシールは摩耗・劣化でのガス漏れリスクが高く、毒性ガスには使用できません。ダブルシール間の漏洩を検知する仕組みも設けます。"],
            ["A","窒素・アルゴン等の不活性ガスは毒性はないが、密閉空間で大量に漏洩すると酸素濃度を低下させ、酸素欠乏症（窒息）を引き起こす危険がある。","不活性ガスは毒性がないため、密閉された地下タンク内で漏洩しても人体への危険は全くない。","<div class='reason-box'>「毒性なし＝安全」は大誤解です。酸素欠乏の段階：21%（正常）→ 18%（欠乏）→ 16%以下（頭痛・判断力低下）→ 12%以下（意識不明）→ 6%以下（数分で死亡）。毒性ガスより気づきにくく危険です。</div>"],
            ["B","往復式圧縮機（レシプロ）は高圧縮比が得やすく少量〜大量まで対応できる反面、ピストンの往復による脈動が生じやすく、配管への振動対策が必要である。","往復式圧縮機（レシプロ）はターボ式と同様に脈動がなく、配管への振動対策は特に必要ない。","レシプロは吸入・圧縮・吐出のサイクルで間欠的にガスを吐出するため脈動が大きい。対策として多気筒化・バッファタンク設置・防振継手の採用などが行われます。"],
            ["A","毒性・腐食性の高圧ガス配管のフランジ接続部には、ガス特性（腐食性・温度・圧力）に適したガスケット材（PTFE・スパイラルガスケット等）を選定し、定期的な点検・交換を行う。","高圧ガス配管のフランジ部のガスケットは、安価な汎用品であれば材質にかかわらず使用できる。","ガスケットは温度・圧力・化学的腐食に対する耐久性が重要です。不適切な材質を使うと、熱膨張・腐食でガスケットが損傷し、甚大な漏洩事故につながります。"],
            ["S","火災の成立には「可燃物（燃料）」「支燃物（酸素）」「点火源（発火エネルギー）」の燃焼の三要素が同時に揃う必要があり、防火はこのいずれか一つを除去することで達成できる。","火災の成立には「可燃物」と「支燃物（酸素）」の2要素があれば十分で、点火源がなくても自然発火する。","<div class='tip-box'>💡 <b>防火の3戦略：</b><br>①可燃物の除去（代替溶剤への変更等）<br>②不活性ガス封入で酸素を排除（イナーティング）<br>③静電気・火花・高温面などの点火源排除<br>自然発火（発火点超過）も点火源があると同じ扱いです。</div>"],
            ["S","毒性ガスの製造施設の除害設備は、施設内で起こりうる最大量のガスが漏洩した場合でも処理できる能力を持つよう設計・維持しなければならない。","毒性ガスの除害設備は、日常の微小な漏洩を処理できる能力があれば十分で、大規模事故への対応は消防に任せればよい。","除害設備は「最悪のシナリオ（全量漏洩）」を想定した設計が法令上の要求です。消防隊が到着するまでの時間的余裕を生み出すためにも、十分な処理能力が必要です。"],
            ["S","プロパン（C₃H₈）の分子量は44で空気（約29）より重く、漏洩すると地面・床面付近の低い場所に滞留するため、ガス検知器は床面付近に設置する。","プロパンガスは空気より軽いため、漏洩すると天井部分に滞留する。そのため検知器は天井付近に設置する。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 ガス検知器の設置位置（比重で判断）</p><b>床面付近（低い位置）：</b>プロパン(44)・ブタン(58)・塩素(71)・硫化水素(34)・フロン<br><b>天井付近（高い位置）：</b>水素(2)・アンモニア(17)・アセチレン(26)・メタン(16)<br>分子量29（空気）と比較して判断</div>"],
            ["A","液化天然ガス（LNG）の主成分はメタン（CH₄）であり、常圧での沸点は約-162℃である。液体から気体になると体積は約600倍に膨張する。","液化天然ガス（LNG）の主成分はプロパンであり、常圧での沸点は約-42℃である。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 LNGとLPGの違い</p><b>LNG</b>（液化天然ガス）：主成分メタン、沸点<b>-162℃</b><br><b>LPG</b>（液化石油ガス）：主成分プロパン、沸点<b>-42℃</b><br>この区別は頻出。LNGの気化膨張は約600倍！</div>"],
            ["B","塩化水素（HCl）は刺激性の強い毒性ガスで、水分があると塩酸を生じ金属を腐食させる。また空気中では湿気と反応して白煙（塩酸ミスト）を生じる。","塩化水素（HCl）は乾燥した状態では金属を腐食しないが、空気中に放出されると黒煙を生じる。","塩化水素は乾燥状態では鉄鋼をほとんど腐食しませんが、水分が存在すると塩酸（HCl水溶液）を生じ金属を激しく腐食します。空気中では湿気と反応して<b>白煙</b>（塩酸ミスト）を生じます（黒煙ではありません）。"],
            ["S","フッ化水素（HF）は猛毒の毒性ガスで、皮膚・粘膜を激しく侵すだけでなく、ガラスやセラミックスを溶解する特異な性質を持つ。","フッ化水素（HF）は水に溶けにくい弱い毒性ガスであり、ガラスへの影響はほとんどない。","<div class='reason-box'>フッ化水素の特異性：①<b>ガラスを溶かす</b>（SiO₂ + 4HF → SiF₄ + 2H₂O）ためフッ酸はガラス容器に保存不可、②皮膚に触れると骨まで侵食する遅発性の深達性腐食（フッ素イオンがCa²⁺と反応してカルシウムを奪う）を起こします。</div>"],
            ["A","可燃性ガスで満たされた設備をメンテナンスで開放する際は、まず不活性ガス（窒素等）でパージしてから空気置換し、酸素濃度を確認した後に作業を開始する。","可燃性ガスの設備を開放する際は、空気を直接送り込んでガスを追い出してから作業を開始する。","<div class='reason-box'>可燃性ガスに直接空気を入れると爆発濃度範囲を通過する際に着火・爆発の危険があります。正しい手順：①<b>窒素でパージ</b>（安全な不燃性雰囲気にする）→②<b>空気置換</b>→③<b>酸素濃度確認</b>（18%以上）→作業開始</div>"],
            ["A","緊急遮断弁は、異常検知（火災・地震・ガス漏洩）の際に自動的または手動で閉止し、ガスの流れを遮断して被害の拡大を防ぐ安全装置である。","緊急遮断弁は通常は閉じており、ガスの流量が一定値を超えたときに自動的に開放してガスを逃がす圧力安全装置である。","「通常閉・緊急開」は安全弁。「<b>通常開・緊急閉</b>」が緊急遮断弁（ESV：Emergency Shut-Off Valve）です。火災・地震・ガス漏洩時にガスの流れを即座に止めることが目的の装置です。"],
            ["B","防爆エリアの区分において、通常の運転状態で爆発性雰囲気が継続的または長時間存在する区域を「Zone 0」と分類し、最も厳しい防爆規格の機器を使用する。","防爆エリアの区分では、爆発性雰囲気が最も発生しやすい区域を「Zone 2」と分類し、最も厳しい防爆規格の機器を使用する。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 防爆エリア区分</p><b>Zone 0</b>：常時危険→最も厳しい防爆機器（本質安全等）<br><b>Zone 1</b>：通常運転時に時々危険→防爆機器必須<br><b>Zone 2</b>：異常時のみ危険→一般電気機器も条件付きで可</div>"],
            ["A","可燃性ガスで満たされた設備を不活性ガス（窒素等）で充満させ、酸素濃度を爆発に必要なレベル以下に保つ操作を「イナーティング（不活性化）」という。","可燃性ガスで満たされた設備を酸素で充満させ、可燃性ガスを酸化・燃焼させて除去することを「イナーティング（不活性化）」という。","<div class='trap-box'>⚠️ 「酸素を入れる」のは全く逆で爆発の危険があります。イナーティングは<b>酸素を排除して爆発不可能な状態を作る</b>操作です（窒素・アルゴン・CO₂でパージ）。</div>"],
            ["S","可燃性液体をタンクや容器に充填する際に発生する静電気を防ぐため、充填設備とタンクの間は等電位ボンディング（等電位接続）と接地（アース）を行う必要がある。","可燃性液体を充填する際の静電気は、充填速度を上げて素早く充填することで発生を抑えられる。","<div class='reason-box'>静電気対策の3原則：<br>①<b>接地（アース）</b>：発生した電荷を大地に逃がす<br>②<b>等電位ボンディング</b>：異なる機器間の電位差をなくす<br>③<b>流速制限</b>（1m/s以下）：摩擦そのものを減らす<br>充填速度を「上げる」のは逆効果です。</div>"],
            ["A","ガス漏洩の検知警報設備の検知部は、対象ガスの比重や設置場所の換気状況に応じて、適切な高さ（空気より重いガスは床面付近、軽いガスは天井付近）に設置する。","ガス漏洩の検知警報設備は、点検のしやすさを優先して、すべてのガスで作業員の腰の高さに設置するのが最も効果的である。","検知器の高さはガスの比重で決まります。設置ルール：比重＞1（空気より重い）→床面から30cm以内。比重＜1（空気より軽い）→天井から30cm以内。腰の高さは正しくありません。"]
        ];

        const dbKno = [
            ["S","ボイルの法則により、温度一定で気体の圧力を2倍にすると、その体積は半分になる。","ボイルの法則により、温度一定で気体の圧力を2倍にすると、その体積も2倍になる。","$P \\times V = 一定$ なので、圧力と体積は反比例します。", 1],
            ["S","シャルルの法則では、気体の体積は「絶対温度（K）」に比例して変化する。","シャルルの法則では、気体の体積は「セルシウス温度（℃）」に比例して変化する。","℃ではなく、必ず<b>「絶対温度（K ＝ ℃ ＋ 273）」</b>に比例します。計算の最大の罠です。", 1],
            ["A","理想気体の状態方程式から、気体の密度 $\\rho$ は $\\rho = PM/RT$ で求められる。","理想気体の状態方程式から、気体の密度 $\\rho$ は $\\rho = PRT/M$ で求められる。","$PV = (w/M)RT$ より $P = (w/V)(RT/M)$。$w/V$ が密度 $\\rho$ なので、変形すると $\\rho = PM / RT$ になります。", 1],
            ["S","水素の圧縮係数 $Z$ は、圧力を上げると常に $1$ より大きくなる。","水素の圧縮係数 $Z$ は、圧力を上げると一度 $1$ より小さくなる。","水素は分子間力が小さく、分子の大きさ（排除体積）の影響が強いため反発し合って理想気体より膨らみます（Z>1）。"],
            ["S","アンモニアの圧縮係数 $Z$ は、圧力を上げると一度 $1$ より小さくなる。","アンモニアの圧縮係数 $Z$ は、圧力を上げると常に $1$ より大きくなる。","アンモニアは極性があり分子間力が強いため、少し圧力をかけると分子同士が引き合い、理想気体より体積が小さくなります（Z<1）。"],
            ["S","断熱膨張では、気体が外に仕事をするために自らの熱を消費するため、温度が下がる。","断熱膨張では、気体が外部から熱を吸収するため、温度が上がる。","熱の出入りがない状態で仕事をするため、自らの温度を下げてエネルギーを捻出します。そのため圧力も急激に落ち込みます。"],
            ["S","ル・シャトリエの原理により、気体反応の平衡状態で圧力を上げると、分子の数が「減る」方向に平衡が移動する。","ル・シャトリエの原理により、気体反応の平衡状態で圧力を上げると、分子の数が「増える」方向に平衡が移動する。","変化を打ち消す「天邪鬼」な法則です。圧力を上げると、圧力を下げようとして分子の数が「減る」方向に移動します。"],
            ["A","ベルヌーイの定理により、水平な配管が細くなり流速が上がると、その部分の静圧は下がる。","ベルヌーイの定理により、水平な配管が細くなり流速が上がると、その部分の静圧も上がる。","エネルギー保存の法則です。「流速エネルギー」と「圧力エネルギー」の和が一定なので、流速が上がれば圧力が下がります。"],
            ["A","気体の定圧モル熱容量($C_p$)と定積モル熱容量($C_v$)の関係は、常に $C_p > C_v$ である。","気体の定圧モル熱容量($C_p$)と定積モル熱容量($C_v$)の関係は、常に $C_p < C_v$ である。","マイヤーの関係式より $C_p = C_v + R$ なので、常に $C_p > C_v$ です。定圧変化は膨張する仕事の分だけ余計に熱が必要です。"],
            ["A","連続の式により、配管の断面積が半分になれば、非圧縮性流体の流速は2倍になる。","連続の式により、配管の断面積が半分になれば、非圧縮性流体の流速も半分になる。","「断面積 × 流速 ＝ 一定」です。同じ量の水を流すために、通り道が半分になればスピードを2倍にする必要があります。", 1],
            ["B","ステファン・ボルツマンの法則によれば、熱放射のエネルギーは絶対温度の「4乗」に比例する。","ステファン・ボルツマンの法則によれば、熱放射のエネルギーは絶対温度の「2乗」に比例する。","絶対温度の<b>「4乗」</b>に比例します。温度が2倍になると、放射エネルギーは16倍にも跳ね上がります。"],
            ["S","レイノルズ数が大きい流体ほど、流れが乱れて「乱流」になりやすい。","レイノルズ数が大きい流体ほど、流れが規則正しい「層流」になりやすい。","レイノルズ数が大きい（速い、管が太い、粘度が低い）と、流れが乱れて<b>「乱流」</b>になります。"],
            ["B","一次反応の半減期は、初期濃度に関わらず「常に一定」である。","一次反応の半減期は、初期濃度が高くなるほど短くなる。","一次反応の最大の特徴は、初期濃度がいくらであっても、半分になるまでの時間（半減期）が<b>「常に一定」</b>であることです。"],
            ["A","ジュールの法則によれば、理想気体の内部エネルギーは圧力や体積には依存せず、温度のみに依存する。","理想気体の内部エネルギーは、温度だけでなく圧力や体積にも大きく依存する。","理想気体は分子間力がないと仮定するため、どれだけ膨張・圧縮されても内部エネルギーは変わりません。温度だけで決まります。"],
            ["A","ダルトンの法則によれば、混合気体の全圧は、各成分気体の分圧の和に等しい。","混合気体の全圧は、各成分気体の分圧の平均値に等しい。","空気の全圧（1気圧）が、窒素の分圧（約0.8気圧）と酸素の分圧（約0.2気圧）を足し合わせたものになるのと同じです。"],
            ["B","触媒は反応の活性化エネルギーを小さくするが、平衡状態における生成物の最終的な量は変化させない。","触媒は反応の活性化エネルギーを小さくすることで、平衡状態における生成物の最終的な量も増やすことができる。","触媒は「山の標高を低くして反応を速くする」だけで、スタートとゴールの高さ（エネルギー差）は変えないため、最終的な量は変わりません。"],
            ["A","液体の蒸気圧が外圧（大気圧）と等しくなったときに、液体の内部からも気化が起こる「沸騰」が始まる。","液体の蒸気圧が外圧より低くなったときに、初めて「沸騰」が始まる。","これが沸騰のメカニズムです。山の上など外圧が低い場所では、より低い温度（低い蒸気圧）で外圧と等しくなるため沸点が下がります。"],
            ["B","絶対零度（0 K）は、セルシウス温度（℃）で表すと -273.15 ℃ である。","絶対零度（0 K）は、セルシウス温度（℃）で表すと 0 ℃ である。","これ以上温度が下がらない（分子の熱運動が完全に停止する）理論上の最低温度が絶対零度です。"],
            ["B","円管内を流れる層流の速度分布は、管壁付近でゼロになり、管の中心部で最も速くなる。","円管内を流れる層流の速度分布は、管の中心部で最も遅く、管壁付近で最も速くなる。","壁には摩擦が働くため速度はゼロになり、壁から最も遠い<b>「管の中心」</b>が一番速く流れる放物線の形になります。"],
            ["S","メタンの完全燃焼の式（$CH_4 + 2O_2 \\rightarrow CO_2 + 2H_2O$）より、必要な酸素の体積はメタンの体積の2倍である。","メタンの完全燃焼の式より、必要な酸素の体積はメタンの体積と同じである。","反応式の係数に注目します。$CH_4$ の係数は1、$O_2$ の係数は2なので、メタンの2倍の体積の酸素が必要です。", 1],
            ["B","熱の伝わり方のうち、真空中でも熱が伝わるのは「熱放射」のみである。","熱の伝わり方のうち、真空中でも熱が伝わるのは「熱伝達（対流）」のみである。","真空中でも伝わるのは<b>「熱放射」</b>のみです。太陽の熱が宇宙空間を通って地球に届くのがこれです。対流には空気や水が必要です。"],
            ["A","ファンデルワールスの状態方程式において、定数 $a$ は分子間力、定数 $b$ は分子の大きさに起因する補正項である。","ファンデルワールスの状態方程式において、定数 $a$ は分子の大きさに起因する補正項である。","定数 $a$ は「分子間力（圧力の補正）」を表し、定数 $b$ が「分子自身の体積（排除体積の補正）」を表します。"],
            ["A","純物質が「固体・液体・気体」の3つの状態で共存しているとき、ギブスの相律による自由度は 0 である。","純物質が「固体・液体・気体」の3つの状態で共存しているとき、ギブスの相律による自由度は 2 である。","$F = C - P + 2 = 1 - 3 + 2 = 0$ となります。温度も圧力も特定の1点に固定されている状態（三重点）を意味します。", 1],
            ["B","2成分系の混合物が「気体」と「液体」の2相で平衡にあるとき、ギブスの相律による自由度は 2 である。","2成分系の混合物が「気体」と「液体」の2相で平衡にあるとき、ギブスの相律による自由度は 0 である。","$F = 2 - 2 + 2 = 2$ となります。温度と圧力のうち2つの条件を自由に決めることができる状態です。", 1],
            ["A","理想気体 1 mol の標準状態（0℃、1 atm）における体積は、ガスの種類に関わらず約 22.4 L である。","理想気体 1 mol の標準状態における体積は、ガスの分子量によって大きく異なる。","アボガドロの法則です。水素でも酸素でも二酸化炭素でも、理想気体とみなせる状態であれば必ず 22.4 L を占めます。"],
            ["S","空気は酸素約21%、窒素約79%の混合気体であり、その平均分子量は約 29 になる。","空気は酸素と窒素の混合気体であり、その平均分子量は約 18 になる。","酸素(32)と窒素(28)の加重平均を計算すると約29になります。この「空気の分子量29」は他のガスの比重を計算する基準として頻出です。", 1],
            ["A","メタン（$CH_4$）の空気中での爆発下限界は約 5%、上限界は約 15% である。","メタン（$CH_4$）の空気中での爆発下限界は約 1%、上限界は約 50% である。","メタンの爆発範囲（5〜15%）は非常によく出題されます。プロパンは約2.1〜9.5%、水素は約4〜75%です。"],
            ["B","可燃性ガスの「最小発火エネルギー」は、一般に圧力が高いほど小さくなる（着火しやすくなる）。","可燃性ガスの「最小発火エネルギー」は、一般に圧力が高いほど大きくなる（着火しにくくなる）。","圧力が高いと分子が密集しているため、ごくわずかな火花（小さなエネルギー）でも簡単に連鎖反応が起きて着火（爆発）します。"],
            ["A","理想気体を等温で膨張させたとき、内部エネルギーの変化はゼロであり、系が外部にした仕事と系が吸収した熱量は等しい。","理想気体を等温で膨張させたとき、系が吸収した熱量はすべて内部エネルギーの増加に使われる。","等温なので内部エネルギーの増減はゼロ（$\\Delta U = 0$）です。熱力学第一法則 $Q = \\Delta U + W$ より、$Q = W$ となります。"],
            ["B","気体をシリンダー内で急激に圧縮すると、熱のやり取りが間に合わず温度が上昇する。これを「断熱圧縮」という。","気体をシリンダー内で急激に圧縮すると、熱のやり取りが間に合わず温度が上昇する。これを「等温圧縮」という。","熱のやり取りがない状態での圧縮は<b>「断熱圧縮」</b>です。ディーゼルエンジンはこれを利用して燃料を着火させます。"],
            ["A","熱力学の第二法則によれば、自然界で起こる不可逆変化において、孤立系のエントロピーは常に増大する。","熱力学の第二法則によれば、自然界で起こる不可逆変化において、孤立系のエントロピーは常に減少する。","エントロピー（乱雑さ）<b>増大</b>の法則です。インクが水に散らばるように、自然の現象は常に乱雑さが増す方向に進みます。"],
            ["B","エンタルピー $H$ は、内部エネルギー $U$、圧力 $P$、体積 $V$ を用いて $H = U + PV$ と定義される。","エンタルピー $H$ は、内部エネルギー $U$、圧力 $P$、体積 $V$ を用いて $H = U - PV$ と定義される。","正しくは $H = U + PV$ です。定圧変化の場合、系に出入りした熱量はエンタルピーの変化量と等しくなります。"],
            ["A","ある化学反応の活性化エネルギーが大きいほど、温度変化に対する反応速度の変化（影響）は大きくなる。","ある化学反応の活性化エネルギーが大きいほど、温度変化に対する反応速度の変化（影響）は小さくなる。","活性化エネルギー（反応のハードル）が高い反応ほど、温度を上げてエネルギーを増やしたときの「速度アップの恩恵」がより劇的に現れます。"],
            ["S","ル・シャトリエの原理によれば、吸熱反応が平衡状態にあるとき、温度を下げると平衡は生成物が減少する方向（左向き）に移動する。","ル・シャトリエの原理によれば、吸熱反応が平衡状態にあるとき、温度を下げると平衡は生成物が増加する方向（右向き）に移動する。","天邪鬼な法則です。温度を下げると系は「発熱しよう」とするため、吸熱の逆向き（発熱反応＝生成物が減る方向）に移動します。"],
            ["A","配管断面積 $A$、流速 $v$、密度 $\\rho$ のとき、単位時間あたりに流れる流体の質量（質量流量 $Q_m$）は $Q_m = A \\cdot v \\cdot \\rho$ である。","配管断面積 $A$、流速 $v$、密度 $\\rho$ のとき、単位時間あたりに流れる流体の質量（質量流量 $Q_m$）は $Q_m = A \\cdot v / \\rho$ である。","体積流量（$A \\cdot v$）に密度 $\\rho$ を<b>掛ける</b>ことで質量になります。正しくは $Q_m = A \\cdot v \\cdot \\rho$ です。", 1],
            ["B","熱伝達（対流）による伝熱量は、ニュートンの冷却法則に従い、固体表面と流体との温度差に比例する。","熱伝達（対流）による伝熱量は、ニュートンの冷却法則に従い、固体表面と流体との温度差に反比例する。","熱いコーヒーと冷たい空気のように、温度差が大きいほど熱は勢いよく移動するため、<b>温度差に比例</b>します。"],
            ["B","固体の内部を熱が伝わる現象（熱伝導）は、「フーリエの法則」に従う。","固体の内部を熱が伝わる現象（熱伝導）は、「ニュートンの冷却法則」に従う。","熱伝導はフーリエの法則、熱伝達（対流）はニュートンの冷却法則、熱放射はステファン・ボルツマンの法則です。"],
            ["A","比熱比 $\\gamma = C_p / C_v$ とすると、理想気体の可逆断熱変化では $PV^\\gamma = 一定$ が成り立つ。","理想気体の可逆断熱変化では $PV = 一定$ （ボイルの法則）がそのまま成り立つ。","断熱変化では $PV^\\gamma = 一定$ の式（ポアソンの式）が成り立ちます。エンジンの圧縮計算などで非常に重要です。", 1],
            ["S","起爆薬（雷汞など）は、わずかな衝撃や摩擦で容易に爆発するが、爆発の威力自体は爆薬（TNTなど）よりも小さい。","起爆薬（雷汞など）は、わずかな衝撃で爆発し、さらにその爆発の威力はTNTなどの爆薬よりもはるかに大きい。","起爆薬は「火種を作る（敏感）」のが仕事で、威力は小さいです。一方、爆薬（TNT）は鈍感ですが着火されると凄まじい威力を発揮します。"],
            ["B","流体が直管内を流れるときに生じる摩擦による圧力損失は、流速の「2乗」に比例する。","流体が直管内を流れるときに生じる摩擦による圧力損失は、流速に反比例する。","ダルシー・ワイスバッハの式により、圧力損失は流速の<b>「2乗に比例」</b>します。流速が2倍になるとロスは4倍になります。"],
            ["A","アレニウスの式によれば、温度が高くなると反応速度定数は大きくなる。","アレニウスの式によれば、温度が高くなると反応速度定数は小さくなる。","温度が高くなると分子の動きが活発になり、反応のハードルを超える分子が増えるため、反応速度は急激に大きくなります。"],
            ["B","レイノルズ数は、流体の密度と流速と管径に比例し、流体の「粘度」には反比例する。","レイノルズ数は、流体の密度と流速と管径に比例し、流体の「粘度」にも比例する。","粘度には<b>反比例</b>します。ハチミツのようにドロドロ（粘度が大きい）だと流れが乱れにくく（層流になりやすく）、水のようにサラサラだと乱流になりやすいです。"],
            ["A","可燃性液体の「引火点」と「発火点」を比較すると、一般に引火点の方が温度が低い。","可燃性液体の「引火点」と「発火点」を比較すると、一般に引火点の方が温度が高い。","引火点（火を近づけたときに着火する温度）の方が低く、発火点（火がなくても勝手に燃え出す温度）の方が高いです。"],
            ["S","標準状態で 5 L のメタンを完全燃焼させるのに必要な酸素は 10 L である。","標準状態で 5 L のメタンを完全燃焼させるのに必要な酸素は 5 L である。","$CH_4$ の係数は1、$O_2$ の係数は2なので、メタンの2倍の体積の酸素が必要です。$5 \\times 2 = 10 \\text{ L}$ です。", 1],
            ["S","ある気体が、圧力 2 MPa、体積 3 L から、温度を変えずに圧力を 1 MPa に下げた。体積は 6 L になる。","ある気体が、圧力 2 MPa、体積 3 L から、温度を変えずに圧力を 1 MPa に下げた。体積は 1.5 L になる。","ボイルの法則より $2 \\times 3 = 1 \\times V$ となり、$V = 6 \\text{ L}$ です。", 1],
            ["S","27℃、体積 2 L の気体を、圧力を変えずに 327℃ まで加熱した。体積は 4 L になる。","27℃、体積 2 L の気体を、圧力を変えずに 327℃ まで加熱した。体積は 24 L になる。","絶対温度に直すと、300K から 600K（2倍）になっています。シャルルの法則より、体積も2倍の 4 L になります。", 1],
            ["S","ある気体が、圧力 1 MPa、体積 2 L から、温度を変えずに圧力を 0.2 MPa に下げた。体積は 10 L になる。","ある気体が、圧力 1 MPa、体積 2 L から、温度を変えずに圧力を 0.2 MPa に下げた。体積は 5 L になる。","ボイルの法則より $1 \\times 2 = 0.2 \\times V$ となり、$V = 10 \\text{ L}$ が正解です。", 1],
            ["B","理想気体の状態方程式 $PV = nRT$ において、$R$ は気体の種類によらず常に同じ値の定数である。","理想気体の状態方程式 $PV = nRT$ において、$R$ は気体の種類によって異なる定数である。","$R$ は「気体定数」と呼ばれる全気体共通のユニバーサルな定数（約8.31 J/(mol・K)）です。気体の種類によらず同じ値です。"],
            ["A","触媒は反応が平衡に達するまでの時間を短くするだけで、平衡の移動（最終的な生成物の量）には影響を与えない。","反応 $N_2 + 3H_2 \\rightleftharpoons 2NH_3$ において、触媒を加えると平衡はアンモニアが生成する方向（右向き）に移動する。","触媒は「反応が平衡に達するまでの時間を短くする」だけで、平衡の移動（最終的な生成物の量）には影響を与えません。"],
            ["A","熱力学の第一法則は「エネルギー保存の法則」の表現の一つである。","熱力学の第一法則は「エントロピー増大の法則」の表現の一つである。","熱力学第一法則 $Q = \\Delta U + W$ は、熱エネルギーが内部エネルギーと仕事の和として完全に保存されることを示しています。"],

            // ===== 追加問題（学識）=====
            ["A","ヘスの法則により、化学反応の反応熱（エンタルピー変化）は反応の経路や中間ステップに関わらず、反応物と生成物の状態だけで決まる。","ヘスの法則により、化学反応の反応熱は反応の速さや経路によって変わるため、経路ごとに個別に測定する必要がある。","エネルギー保存則の化学版です。直接測れない反応熱も複数の既知の反応を組み合わせて計算できます。例：生成熱＋燃焼熱→生成エンタルピーの計算が可能です。"],
            ["S","純粋な物質では、臨界温度・臨界圧力を超えた状態（超臨界状態）になると液相と気相の境界が消失し、単一の「超臨界流体」相となる。","純粋な物質では、臨界温度・臨界圧力を超えると全て気体になり、それ以上は圧力をかけても液化しなくなる。","<div class='reason-box'>臨界点より上では液体でも気体でもない「超臨界流体」になります。<b>「気体になる」のではなく「気液の区別がなくなる」</b>が正しい表現です。CO₂の超臨界流体（臨界温度31℃・臨界圧7.4MPa）はドライクリーニングや食品抽出に活用されています。</div>"],
            ["A","一般に温度を10℃上昇させると反応速度は約2倍になるという経験則（ファントホッフの規則）は、アレニウスの式の近似として導かれる。","一般に温度を10℃上昇させると反応速度は約10倍になるという経験則がある。","「温度10℃上昇で反応速度2倍」は重要な経験則です（実際は活性化エネルギーによって2〜3倍程度）。これによれば60℃温度を上げると $2^6 = 64$ 倍にもなります。アレニウスの式と矛盾しません。", 1],
            ["S","気体定数 $R = 8.314$ J/(mol·K) は、気体の種類によらない普遍定数であり、状態方程式の計算では必ず絶対温度（K）と組み合わせて使用する。","気体定数 $R$ は、扱う気体の分子量に応じて異なる値を持つため、気体の種類ごとに使い分ける必要がある。","$R$（気体定数）は全気体共通の値（≈8.314 J/mol·K）。「比ガス定数 $r = R/M$」はガス固有の値です。状態方程式 $PV=nRT$ で使う $R$ は 8.314 J/(mol·K) です。絶対温度 K＝℃＋273.15 を忘れずに！", 1],
            ["A","向流型（対向流型）熱交換器は、高温流体と低温流体が逆方向に流れるため、並流型（同方向流型）より温度効率が高く、一般に高い伝熱量が得られる。","並流型（同方向流型）熱交換器は、流体の流れが整然としているため、向流型より伝熱効率が高い。","<div class='reason-box'>向流型は流路全体で大きな温度差（伝熱の駆動力）が保たれます。並流型は出口付近で温度差が縮まるため効率が低下します。実際の熱交換器（プレート式・シェル＆チューブ式）は向流設計が多数採用されます。</div>"],
            ["B","共沸混合物とは、ある特定の組成において液相と気相の組成が等しくなる混合液であり、通常の蒸留では完全な分離ができない。","共沸混合物は、蒸留の繰り返し操作によって最終的には完全に純粋な成分に分離できる。","<div class='reason-box'>共沸点（azeotrope）では液と気の組成が同一なため、蒸留しても組成が変わりません。分離するには<b>加圧蒸留・共沸剤添加・膜分離</b>などの特殊な操作が必要です。エタノール-水（95.6%エタノール）が最も有名な共沸例です。</div>"],
            ["A","圧縮機の断熱効率（等エントロピー効率）は、可逆断熱圧縮の理論仕事と実際の圧縮に要した仕事の比であり、高いほどエネルギー効率が良いことを示す。","圧縮機の断熱効率が高いほど、実際の圧縮に要するエネルギーが多くなり、運転コストが増大する。","断熱効率 = 理論仕事 ÷ 実際の仕事。効率1.0（100%）が理想で、実際の機械は70〜85%程度です。効率が高い方が少ないエネルギーで圧縮できます。効率が高いほどコストが下がります。"],
            ["B","配管内流体の摩擦による圧力損失（ダルシー・ワイスバッハの式）は、配管長さに比例し、配管内径に反比例し、流速の2乗に比例する。","配管内流体の摩擦による圧力損失は、配管長さに反比例し、配管内径に比例し、流速の2乗に反比例する。","ダルシー・ワイスバッハ式：$\\Delta P = f \\cdot \\frac{L}{D} \\cdot \\frac{\\rho v^2}{2}$。L↑→損失↑、D↑→損失↓、v↑→損失は速度の<b>2乗で↑</b>。配管が細いほど・長いほど・流速が速いほど損失が大きくなります。", 1],
            ["A","可逆断熱過程（等エントロピー過程）では、系と外部の間の熱のやり取りがないため、系のエントロピーは変化しない（ΔS＝0）。","可逆断熱過程においても、圧縮による温度上昇があるため、系のエントロピーは増大する。","可逆断熱過程：dQ = 0 かつ 可逆 → dS = dQ/T = 0。エントロピーは変化しません（等エントロピー変化）。<b>不可逆</b>断熱過程（実際の圧縮）ではΔS > 0となります。理想（可逆）と現実（不可逆）の違いが重要です。", 1],
            ["S","爆発の分類において、アセチレン・酸化エチレン・ヒドラジン等のように空気中の酸素なしにガス自体が自己分解して爆発する現象を「分解爆発」という。","アセチレン・酸化エチレン・ヒドラジン等の爆発は、空気中の酸素と混合して燃焼する「燃焼爆発」である。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 爆発の種類まとめ</p><b>分解爆発</b>：酸素不要・単独爆発（アセチレン・酸化エチレン・ヒドラジン等）<br><b>燃焼爆発</b>：酸素と可燃物の混合が必要（メタン・水素・プロパン等）<br>分解爆発物は密閉容器での高圧貯蔵も危険！</div>"],
            ["A","物質の「比熱（比熱容量）」は単位質量あたりの熱容量（J/（kg·K））であり、「熱容量」は物体全体の熱容量（J/K）で、「熱容量＝質量×比熱」の関係がある。","物質の「比熱」は物体全体が温度1K上昇するのに必要な熱量であり、「熱容量」はその材料固有の物性値である。","比熱：材料固有の物性値（J/（kg·K））・質量に無関係。熱容量：その物体全体に依存（J/K）＝質量×比熱。例：水の比熱4186 J/（kg·K）。1kgの水の熱容量は4186 J/K。"],
            ["S","閉塞した配管内に液化ガスが充満した「液封」状態で温度が上昇すると、液体の熱膨張により配管内圧が急激に上昇し、配管や弁の破裂につながる危険がある。","閉塞した配管内に液化ガスが充満した「液封」状態でも、液体は圧縮されにくいため温度が上昇しても圧力はほとんど上昇しない。","<div class='reason-box'>液体の体積弾性率は非常に大きい（ほぼ非圧縮性）です。密閉容器内で温度が1℃上昇しただけで数MPaもの圧力上昇が生じます。「液体は圧縮しにくい＝逆に膨張を閉じ込めると危険」という性質が液封事故の本質です。</div>"],
            ["B","ラウールの法則（理想溶液）では、溶液中の各成分の分圧は、その成分の純粋状態の飽和蒸気圧に<b>モル分率</b>を乗じた値に等しい（$P_i = x_i \\cdot P_i^*$）。","ラウールの法則では、溶液中の各成分の分圧は、その成分の純粋状態の飽和蒸気圧に<b>体積分率</b>を乗じた値に等しい。","ラウールの法則：$P_i = x_i \\cdot P_i^*$（$x_i$：<b>モル分率</b>、$P_i^*$：純粋成分の蒸気圧）。体積分率ではなくモル分率を使うことに注意。理想溶液（混合時の体積・エンタルピー変化なし）の近似です。", 1],
            ["A","ヌセルト数（Nu = hL/λ）は対流熱伝達の強さを表す無次元数で、Nu数が大きいほど流体の運動による熱伝達率が高い。一方、レイノルズ数（Re）は慣性力と粘性力の比を表す。","ヌセルト数（Nu）は粘性力と慣性力の比を表す無次元数であり、高いほど流れが乱流になりやすいことを示す。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 無次元数まとめ（頻出！）</p><b>Nu（ヌセルト）</b>＝対流熱伝達 / 熱伝導の比<br><b>Re（レイノルズ）</b>＝慣性力 / 粘性力の比（層流・乱流の判定）<br><b>Pr（プラントル）</b>＝動量拡散 / 熱拡散の比<br>これら無次元数の混同が頻出ミスです！</div>"],
            ["S","複数の可燃性ガスの混合気体の爆発下限界（LFL）は、ル・シャトリエの式 $L = 100 \\div \\sum(C_i/L_i)$ で計算できる。ここで $C_i$ は各成分の組成(%)、$L_i$ は各成分の爆発下限界(%)。","複数の可燃性ガスの混合気体の爆発下限界は、各成分のうち最も低い爆発下限界の値を混合ガスの爆発下限界とする。","ル・シャトリエの式：$L_{mix} = \\frac{100}{\\sum C_i/L_i}$。<b>最低値ではなく加重平均的な計算</b>をします。例：メタン(下限5%) 80%＋プロパン(下限2.1%) 20%の混合ガスは式で計算した値が下限界となります。", 1],
            ["A","理想気体の等温変化では、内部エネルギーの変化はゼロ（ΔU＝0）となり、熱力学第一法則（Q＝ΔU＋W）より、系が吸収した熱量はすべて外部への仕事に変換される。","理想気体を等温で膨張させた場合、膨張に使った仕事の分だけ内部エネルギーが減少し、温度が下がる。","等温変化では温度一定 → 内部エネルギーは温度のみに依存（ジュールの法則）→ $\\Delta U=0$。したがって $Q=W$ となり、吸熱した熱量がすべて仕事に変換されます。", 1],
            ["A","ギブスの自由エネルギー変化（ΔG）が負（ΔG<0）の場合、その反応は自発的に進行できる（熱力学的に可能）。","ギブスの自由エネルギー変化（ΔG）が正（ΔG>0）の場合、その反応は自発的に進行できる。","$\\Delta G = \\Delta H - T\\Delta S$。<b>ΔG<0：自発的（自然に起こる）</b>反応。ΔG>0：非自発的（外部エネルギーが必要）。ΔG=0：平衡状態。化学反応の「起こりやすさ」を示す最重要な熱力学関数です。", 1],
            ["B","ニュートン流体とは、せん断応力がせん断速度（速度勾配）に比例する流体であり、水・空気・多くの有機溶剤はニュートン流体である。","ニュートン流体とは、せん断速度が増加すると粘度が増加する流体であり、水はこの典型例である。","ニュートン流体：τ = μ（dv/dy）。粘度μは一定（せん断速度によらない）。水・空気・ガソリン等がこれです。粘度が変化するのは「非ニュートン流体」（マヨネーズ・血液・泥水等）です。"],
            ["A","連続の方程式（質量保存則）において、非圧縮性流体（密度一定）が配管内を流れるとき、断面積が変化しても単位時間あたりの体積流量（流速×断面積）は一定に保たれる。","連続の方程式において、配管の断面積が2倍になると、非圧縮性流体の流速も2倍になる。","連続の式：$A_1 v_1 = A_2 v_2$（断面積と流速は<b>反比例</b>）。断面積が2倍 → 流速は<b>半分</b>になります。「流速も2倍」は逆です。同じ流量が流れているので通路が広くなれば速度は下がります。", 1],
            ["A","実在気体の圧縮因子（Z＝PV/nRT）が1より大きい（Z>1）場合、その気体は理想気体より体積が大きい（分子間の反発＝排除体積の影響が優勢）ことを示す。","実在気体の圧縮因子（Z>1）は、その気体が理想気体より体積が小さい（分子間の引力が優勢）ことを示す。","<div class='goro-box'><p class='font-bold text-pink-600 mb-1'>📌 圧縮因子Zの解釈</p><b>Z>1</b>：排除体積の影響大、実際の体積>理想気体（水素・ヘリウムで典型）<br><b>Z<1</b>：分子間引力が優勢、実際の体積<理想気体（アンモニア・CO₂等、高圧・低温で典型）</div>"],
            ["A","ファントホッフの式によれば、発熱反応（ΔH°<0）では温度上昇により平衡定数は小さくなる（生成物が減る方向に平衡が移動する）。","ファントホッフの式によれば、発熱反応では温度を上げると平衡定数が増大し、生成物がより多く生成される。","$d(\\ln K)/dT = \\Delta H°/(RT^2)$：発熱反応（ΔH°<0）ならdK/dT<0、つまり温度↑→K↓（生成物が減る）。これはル・シャトリエの原理（発熱反応を温度上昇が逆向きに引き戻す）と一致します。", 1],
            ["A","ジュール・トムソン効果とは、断熱状態で高圧側から低圧側に気体が流れる際に温度が変化する現象で、多くの実在気体は常温において圧力が下がると温度も下がる（冷却される）。","ジュール・トムソン効果では、多くの実在気体は常温において圧力が下がると温度が上昇する（加熱される）。","<div class='reason-box'>JT効果の符号：μ_JT > 0（正）→圧力低下で温度も低下（冷却）：多くの実在気体（窒素・酸素・CO₂等）。μ_JT < 0（負）→圧力低下で温度上昇（加熱）：水素・ヘリウム（常温では）。これが冷凍機や液化装置に利用されています。</div>"],
            ["S","プロパン（$C_3H_8$）の完全燃焼式は $C_3H_8 + 5O_2 \\rightarrow 3CO_2 + 4H_2O$ であり、必要な酸素はプロパンの体積の5倍である。","プロパン（$C_3H_8$）の完全燃焼に必要な酸素はプロパンの体積の3倍である。","$C_3H_8 + 5O_2 \\rightarrow 3CO_2 + 4H_2O$：酸素はプロパンの5倍が必要です。メタン($CH_4$)：2倍、ブタン($C_4H_{10}$)：6.5倍と合わせて覚えましょう。", 1],
            ["S","物体から放射される熱放射の全エネルギー（全放射能）は、ステファン・ボルツマンの法則により絶対温度の4乗に比例する（$E = \\varepsilon \\sigma T^4$）。温度が2倍になると放射エネルギーは16倍になる。","物体から放射される熱放射の全エネルギーは、ステファン・ボルツマンの法則により絶対温度の2乗に比例する。","$E \\propto T^4$（<b>4乗</b>）。T が2倍 → E は$2^4＝16$倍。T が3倍 → E は$3^4＝81$倍。この急激な変化のため高温物体の輻射冷却は非常に重要です。太陽から地球への熱伝達はこの輻射熱です。", 1],
            ["B","理想気体を定圧下で加熱すると、系は膨張仕事（P⊿V）を行うため、定圧モル熱容量（$C_p$）は定積モル熱容量（$C_v$）より大きい（マイヤーの関係式：$C_p = C_v + R$）。","定積変化では気体が外部に仕事をしないため、定積モル熱容量（$C_v$）は定圧モル熱容量（$C_p$）より大きい。","マイヤーの関係式：$C_p = C_v + R$。定圧変化では膨張仕事（$R = P\\Delta V/\\Delta T$ に相当）の分だけ余計に熱が必要なため、<b>常にCp > Cv</b>です。比熱比 $\\gamma = C_p/C_v > 1$ もこれに由来します。", 1]
        ];

        const allData = [].concat(
            dbLaw.map(item => ["law", item[0], item[1], item[2], item[3], item[4] || 0]),
            dbSec.map(item => ["sec", item[0], item[1], item[2], item[3], item[4] || 0]),
            dbSec.map(item => ["sec", item[0] === "S" ? "A" : "B", item[2].replace("。", "とは限らない。"), item[1].replace("。", "とは考えられない。"), "【別パターンの出題です】<br>" + item[3], item[4] || 0]),
            dbKno.map(item => ["kno", item[0], item[1], item[2], item[3], item[4] || 0]),
            dbKno.map(item => ["kno", item[0] === "S" ? "A" : "B", item[2].replace("。", "とは限らない。").replace("なる。", "なるわけではない。"), item[1].replace("。", "とは考えられない。").replace("なる。", "ならない。"), "【別パターンの出題です】<br>" + item[3], item[4] || 0])
        );

        const questionMaster = [];
        let qId = 1;

        allData.forEach(d => {
            const cat = d[0], rank = d[1], qTrue = d[2], qFalse = d[3], exp = d[4], needsCv = d[5] === 1;
            questionMaster.push({ id: `q${qId++}`, c: cat, r: rank, t: qTrue, isTrue: true, cv: needsCv, e: exp });
            questionMaster.push({ id: `q${qId++}`, c: cat, r: rank, t: qFalse, isTrue: false, cv: needsCv, e: exp });
        });

        // ★ 軽量化2: O(n)の線形探索をO(1)のMapに変換（ノート画面の高速化）
        const questionMap = new Map(questionMaster.map(q => [q.id, q]));

        // ヘッダーの問題数を実際の数で動的表示
        document.getElementById('total-count-badge').textContent = `全${questionMaster.length}問収録`;

        // ★ 軽量化3: KaTeX描画結果をキャッシュ（同じ数式を何度も再描画しない）
        const katexCache = new Map();

        function getQDetails(q) {
            const rankHtml = q.r === 'S' ? '<span class="text-red-600 font-bold">👑 超頻出 S</span>' : q.r === 'A' ? '<span class="text-orange-500 font-bold">⭐ 頻出 A</span>' : '<span class="text-blue-500 font-bold">📘 基本 B</span>';
            const catStr = q.c === 'law' ? '法令' : q.c === 'sec' ? '保安管理' : '学識';
            const catCol = q.c === 'law' ? 'bg-emerald-500' : q.c === 'sec' ? 'bg-amber-500' : 'bg-rose-500';
            const expHtml = `<span class='font-bold ${q.isTrue ? "text-red-600" : "text-blue-600"} text-base'>答えは ${q.isTrue ? "〇" : "×"}！</span><br><br>${q.e}`;
            return { rankHtml, catStr, catCol, expHtml };
        }

        const katexDelimiters = [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
        ];

        function renderMath(elementId, cacheKey) {
            if (typeof renderMathInElement !== 'function') return;
            const el = els[elementId];
            if (!el) return;
            const html = el.innerHTML;
            if (!html.includes('$') && !html.includes('\\(')) return;
            // キャッシュが存在すれば即座に適用（再描画なし）
            if (cacheKey && katexCache.has(cacheKey)) {
                el.innerHTML = katexCache.get(cacheKey);
                return;
            }
            renderMathInElement(el, { delimiters: katexDelimiters, throwOnError: false });
            if (cacheKey) katexCache.set(cacheKey, el.innerHTML);
        }

        let userProgress = JSON.parse(localStorage.getItem('userProgress')) || {};
        let saveTimeout;

        function requestSaveProgress() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('userProgress', JSON.stringify(userProgress));
            }, 2000);
        }

        window.addEventListener('beforeunload', () => {
            localStorage.setItem('userProgress', JSON.stringify(userProgress));
        });

        function saveProgressToDB(questionId, isCorrect) {
            let data = userProgress[questionId] || { consecutive_correct: 0, is_bookmarked: false };
            let nextReviewDate = new Date();
            if (isCorrect) {
                data.consecutive_correct++;
                let days = data.consecutive_correct === 1 ? 1 : data.consecutive_correct === 2 ? 3 : data.consecutive_correct === 3 ? 7 : data.consecutive_correct === 4 ? 14 : 30;
                nextReviewDate.setDate(nextReviewDate.getDate() + days);
            } else {
                data.consecutive_correct = Math.max(0, Math.floor(data.consecutive_correct / 2));
                nextReviewDate.setDate(nextReviewDate.getDate() + 1); 
            }
            data.next_review_date = nextReviewDate.getTime();
            userProgress[questionId] = data;
            requestSaveProgress();
            updateHomeData();
        }

        function toggleBookmarkDB(questionId) {
            let data = userProgress[questionId] || { consecutive_correct: 0, is_bookmarked: false, next_review_date: 0 };
            data.is_bookmarked = !data.is_bookmarked;
            userProgress[questionId] = data;
            requestSaveProgress();
            return data.is_bookmarked;
        }

        function getReviewTasks() {
            const now = new Date().getTime();
            return questionMaster.filter(q => userProgress[q.id] && userProgress[q.id].next_review_date && userProgress[q.id].next_review_date <= now);
        }

        function updateHomeData() {
            const reviewCount = getReviewTasks().length;
            if(reviewCount > 0){ els['review-badge'].innerText = `${reviewCount}問`; els['review-badge'].classList.remove('hidden'); } else { els['review-badge'].classList.add('hidden'); }

            const cats = { law: {t:0, c:0}, sec: {t:0, c:0}, kno: {t:0, c:0} };
            questionMaster.forEach(q => {
                cats[q.c].t++;
                if(userProgress[q.id] && userProgress[q.id].consecutive_correct >= 2) cats[q.c].c++;
            });
            
            setTimeout(() => {
                ['law', 'sec', 'kno'].forEach(c => {
                    const percent = cats[c].t === 0 ? 0 : Math.round((cats[c].c / cats[c].t) * 100);
                    els[`bar-${c}`].style.width = `${percent}%`;
                    els[`score-${c}-text`].innerHTML = `${c==='law'?'法令':c==='sec'?'保安管理':'学識'} <span class="${c==='law'?'text-emerald-600':c==='sec'?'text-amber-500':'text-rose-500'}">${percent}%</span>`;
                });
            }, 50); 
        }

        let activeFilters = { law: true, sec: true, kno: true };
        function toggleFilter(cat) {
            activeFilters[cat] = !activeFilters[cat];
            const btn = els[`flt-${cat}`];
            const color = { law: 'emerald', sec: 'amber', kno: 'rose' }[cat];
            if (activeFilters[cat]) {
                btn.classList.remove('bg-white', `text-${color}-500`, 'border-gray-200');
                btn.classList.add(`bg-${color}-500`, 'text-white', `border-${color}-500`);
            } else {
                btn.classList.remove(`bg-${color}-500`, 'text-white', `border-${color}-500`);
                btn.classList.add('bg-white', `text-${color}-500`, 'border-gray-200');
            }
        }

        let currentQuestions = [], currentIndex = 0, score = 0;

        function initApp() { updateHomeData(); renderNotebook(); }

        function switchTab(tabId) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            ['view-home', 'view-modes', 'view-notebook', 'ui-standard', 'ui-result'].forEach(id => els[id].classList.add('hidden'));
            els[`view-${tabId}`].classList.remove('hidden');
            els['btn-open-canvas'].classList.add('hidden');
            
            if(tabId === 'home') updateHomeData();
            if(tabId === 'notebook') renderNotebook();
        }

        function startReview() {
            const tasks = getReviewTasks();
            if(tasks.length === 0) { alert("今日の復習はありません！"); return; }
            currentQuestions = tasks.sort(() => Math.random() - 0.5).slice(0, 10); 
            startSession();
        }

        function startQuizMode() {
            const pool = questionMaster.filter(q => activeFilters[q.c]);
            if (pool.length === 0) { alert("学習する科目を1つ以上選んでください。"); return; }
            currentQuestions = [...pool].sort(() => Math.random() - 0.5).slice(0, 10); 
            startSession();
        }

        function startSession() {
            currentIndex = 0; score = 0;
            els['view-home'].classList.add('hidden');
            els['view-modes'].classList.add('hidden');
            els['btn-open-canvas'].classList.add('hidden');
            els['ui-standard'].classList.remove('hidden');
            showStandardQuestion();
        }

        function showStandardQuestion() {
            const q = currentQuestions[currentIndex];
            const details = getQDetails(q);
            const isBookmarked = userProgress[q.id]?.is_bookmarked;
            
            els['std-explanation-view'].classList.add('hidden');
            els['std-explanation-view'].classList.remove('pop-in'); 
            els['std-answers'].classList.remove('hidden');
            els['std-next'].classList.add('hidden');
            els['std-finish'].classList.add('hidden');
            
            els['std-bookmark'].innerHTML = isBookmarked ? '<i class="fa-solid fa-star text-yellow-400"></i>' : '<i class="fa-regular fa-star text-gray-400"></i>';
            els['std-counter'].innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
            
            els['std-category'].innerText = details.catStr;
            els['std-category'].className = `text-white px-3 py-1 rounded shadow-sm ${details.catCol}`;
            
            els['std-rank'].innerHTML = details.rankHtml;
            els['std-text'].innerHTML = q.t;

            if(q.cv) {
                els['btn-open-canvas'].classList.remove('hidden');
                els['btn-inline-canvas'].classList.remove('hidden');
            } else { 
                els['btn-open-canvas'].classList.add('hidden'); 
                els['btn-inline-canvas'].classList.add('hidden'); 
            }
            
            if(els['main-content']) els['main-content'].scrollTop = 0;
            renderMath('std-text', q.cv ? `${q.id}_text` : null);
        }

        function checkStandardAnswer(userAnswer) {
            const q = currentQuestions[currentIndex];
            const isRight = (userAnswer === q.isTrue);
            const details = getQDetails(q);
            
            saveProgressToDB(q.id, isRight); 
            if(isRight) score++;

            els['btn-open-canvas'].classList.add('hidden');
            els['btn-inline-canvas'].classList.add('hidden');
            els['std-answers'].classList.add('hidden');
            
            els['std-explanation-view'].classList.remove('hidden');
            void els['std-explanation-view'].offsetWidth; 
            els['std-explanation-view'].classList.add('pop-in');
            
            if (currentIndex + 1 < currentQuestions.length) els['std-next'].classList.remove('hidden');
            else els['std-finish'].classList.remove('hidden');

            els['std-result-mark'].innerHTML = isRight ? '<span class="text-rose-500"><i class="fa-regular fa-circle"></i></span>' : '<span class="text-blue-500"><i class="fa-solid fa-xmark"></i></span>';
            els['std-explanation-text'].innerHTML = details.expHtml;
            renderMath('std-explanation-view', q.cv ? `${q.id}_exp` : null);
            
            setTimeout(() => { if(els['main-content']) els['main-content'].scrollBy({ top: 300, behavior: 'smooth' }); }, 50);
        }

        function nextQuestion() {
            currentIndex++;
            if(currentIndex < currentQuestions.length) showStandardQuestion();
            else finishSession();
        }

        function finishSession() {
            els['btn-open-canvas'].classList.add('hidden');
            els['ui-standard'].classList.add('hidden');
            els['ui-result'].classList.remove('hidden');
            els['res-score'].innerText = score;
            els['res-total'].innerText = currentQuestions.length;
        }

        function toggleBookmark(event) {
            if(event) event.stopPropagation(); 
            const q = currentQuestions[currentIndex];
            const isNowBookmarked = toggleBookmarkDB(q.id);
            els['std-bookmark'].innerHTML = isNowBookmarked ? '<i class="fa-solid fa-star text-yellow-400"></i>' : '<i class="fa-regular fa-star text-gray-400"></i>';
        }

        function renderNotebook() {
            const bookmarkedIds = Object.keys(userProgress).filter(id => userProgress[id].is_bookmarked);
            if(bookmarkedIds.length === 0) {
                els['notebook-empty'].classList.remove('hidden'); 
                els['notebook-list'].innerHTML = '';
                return;
            }
            els['notebook-empty'].classList.add('hidden');

            let htmlBuilder = [];
            bookmarkedIds.forEach(id => {
                const q = questionMap.get(id);
                if(!q) return;
                const details = getQDetails(q);
                htmlBuilder.push(`
                    <div class="bg-white p-4 rounded-xl shadow-sm border-2 border-yellow-200 relative mb-3">
                        <button onclick="removeBookmarkFromNotebook('${q.id}')" class="absolute top-3 right-3 text-yellow-500 hover:text-gray-300 text-xl transition-colors"><i class="fa-solid fa-star"></i></button>
                        <div class="flex gap-1 mb-2">
                            <span class="text-[10px] text-white ${details.catCol} px-2 py-1 rounded shadow-sm">${details.catStr}</span>
                            <span class="text-[10px] bg-slate-100 text-slate-600 border px-2 py-1 rounded">${details.rankHtml}</span>
                        </div>
                        <div class="font-bold text-sm mt-3 mb-3 text-slate-800 leading-relaxed">${q.t}</div>
                        <div class="bg-slate-50 p-3 rounded-lg text-xs text-slate-700 border border-slate-200">${details.expHtml}</div>
                    </div>
                `);
            });
            
            els['notebook-list'].innerHTML = htmlBuilder.join('');
            renderMath('notebook-list'); 
        }
        
        window.removeBookmarkFromNotebook = function(id) {
            if(confirm("この問題をまとめノートから削除しますか？")) {
                toggleBookmarkDB(id);
                renderNotebook();
            }
        }

        let canvas, ctx, isDrawing = false, isCanvasInitialized = false;

        function initCanvas() {
            if(isCanvasInitialized) return;
            canvas = els['drawing-canvas']; 
            ctx = canvas.getContext('2d');
            const e = ['mousedown','touchstart'], m = ['mousemove','touchmove'], u = ['mouseup','mouseout','touchend','touchcancel'];
            e.forEach(ev => canvas.addEventListener(ev, startDrawing, {passive:false}));
            m.forEach(ev => canvas.addEventListener(ev, draw, {passive:false}));
            u.forEach(ev => canvas.addEventListener(ev, stopDrawing));
            window.addEventListener('resize', resizeCanvas);
            isCanvasInitialized = true;
        }
        
        function openCanvasModal() {
            initCanvas();
            els['canvas-modal'].classList.remove('hidden');
            setTimeout(resizeCanvas, 50); 
        }
        
        function closeCanvasModal() { els['canvas-modal'].classList.add('hidden'); }
        
        function resizeCanvas() {
            if(!canvas || canvas.offsetParent === null) return; 
            const rect = canvas.parentElement.getBoundingClientRect();
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
            tempCtx.drawImage(canvas, 0, 0);

            canvas.width = rect.width; 
            canvas.height = rect.height; 
            ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#3b82f6'; 
            ctx.drawImage(tempCanvas, 0, 0);
        }
        
        function getPos(e) { 
            const r = canvas.getBoundingClientRect(); 
            return e.touches ? {x:e.touches[0].clientX-r.left, y:e.touches[0].clientY-r.top} : {x:e.clientX-r.left, y:e.clientY-r.top}; 
        }
        function startDrawing(e) { e.preventDefault(); isDrawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); }
        function draw(e) { if (!isDrawing) return; e.preventDefault(); ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); }
        function stopDrawing(e) { if(e && e.cancelable) e.preventDefault(); isDrawing = false; ctx.beginPath(); }
        function clearCanvas() { if(ctx) ctx.clearRect(0,0,canvas.width,canvas.height); }

    </script>
</body>
</html>
